<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会場案内 ｜ さくら市立南小学校 体育館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --court:#c9772f;        /* コート（オレンジブラウン） */
    --ball:#ee6c2b;         /* バスケットボール */
    --ball-d:#d2541a;
    --line:#f4efe6;         /* コートライン（クリーム） */
    --ink:#2b2118;          /* 文字 */
    --ink-soft:#7a6b58;
    --paper:#fbf7ef;        /* 背景 */
    --card:#ffffff;
    --shadow:0 6px 22px rgba(120,80,30,.14);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'M PLUS Rounded 1c',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% -5%, rgba(238,108,43,.10), transparent 40%),
      radial-gradient(circle at 95% 12%, rgba(201,119,47,.10), transparent 35%),
      var(--paper);
    line-height:1.75;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 64px}

  /* ===== ヘッダー ===== */
  header{
    position:relative;
    background:linear-gradient(135deg,var(--ball) 0%,var(--ball-d) 100%);
    color:#fff;border-radius:0 0 28px 28px;
    padding:26px 22px 30px;text-align:center;overflow:hidden;
    box-shadow:var(--shadow);
  }
  header::after{ /* バスケットの線イメージ */
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 50% -60%, rgba(255,255,255,.18), transparent 60%);
    pointer-events:none;
  }
  .ball-emoji{font-size:34px;display:block;line-height:1}
  header h1{font-size:1.35rem;font-weight:800;margin-top:8px;letter-spacing:.02em}
  header .sub{font-size:.86rem;font-weight:500;opacity:.95;margin-top:4px}
  header .addr{
    margin-top:14px;display:inline-block;background:rgba(255,255,255,.18);
    border-radius:999px;padding:6px 16px;font-size:.82rem;font-weight:500;
    backdrop-filter:blur(2px);
  }

  /* ===== セクション共通 ===== */
  section{margin-top:26px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-left:2px}
  .sec-no{
    flex:none;width:30px;height:30px;border-radius:9px;
    background:var(--ink);color:#fff;font-weight:800;font-size:.95rem;
    display:grid;place-items:center;
  }
  .sec-head h2{font-size:1.12rem;font-weight:800}

  .card{
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .card .body{padding:16px 18px}

  /* ===== 地図 ===== */
  .map-frame{width:100%;aspect-ratio:16/11;border:0;display:block;background:#eee}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;border:0;cursor:pointer;text-decoration:none;
    font-family:inherit;font-weight:800;font-size:1.02rem;
    padding:15px;border-radius:14px;transition:transform .08s ease,filter .15s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn-nav{background:var(--ball);color:#fff;margin-top:14px}
  .btn-nav:hover{filter:brightness(1.05)}
  .btn-line{background:#06c755;color:#fff;margin-top:10px}
  .hint{font-size:.8rem;color:var(--ink-soft);text-align:center;margin-top:10px}

  /* ===== 写真プレースホルダー ===== */
  .photo{
    width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f0ebe1;
  }
  .photo-ph{
    width:100%;aspect-ratio:4/3;display:grid;place-items:center;gap:6px;
    background:repeating-linear-gradient(45deg,#f4efe6,#f4efe6 12px,#efe7d8 12px,#efe7d8 24px);
    color:#b9a98f;text-align:center;
  }
  .photo-ph .ic{font-size:30px}
  .photo-ph .tx{font-size:.78rem;font-weight:700}

  /* ===== 案内図 ===== */
  .guidemap{
    position:relative;display:block;width:100%;cursor:zoom-in;
    background:#f6f1e7;
  }
  .guidemap img{width:100%;height:auto;display:block}
  .guidemap .zoom-tag{
    position:absolute;right:10px;bottom:10px;
    background:rgba(43,33,24,.72);color:#fff;
    font-size:.74rem;font-weight:700;padding:5px 11px;border-radius:999px;
    display:inline-flex;align-items:center;gap:5px;backdrop-filter:blur(2px);
    pointer-events:none;
  }
  .map-cap{
    font-size:.78rem;color:var(--ink-soft);text-align:center;
    padding:9px 14px 2px;
  }
  /* 方位記号（コンパス） */
  .compass{
    position:absolute;bottom:12px;left:12px;width:52px;height:52px;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.28));pointer-events:none;z-index:2;
  }
  .compass svg{display:block;width:100%;height:100%}
  .compass-n{
    position:absolute;top:1px;left:50%;transform-origin:center;
    font:800 13px/1 'M PLUS Rounded 1c',system-ui,sans-serif;color:#e5484d;
  }

  /* ライトボックス（拡大表示） */
  .lightbox{
    position:fixed;inset:0;z-index:50;display:none;
    background:rgba(20,14,8,.9);
    padding:14px;overflow:auto;
    -webkit-overflow-scrolling:touch;
  }
  .lightbox.open{display:block}
  .lightbox img{
    display:block;margin:0 auto;max-width:100%;height:auto;
    border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .lightbox .close{
    position:fixed;top:12px;right:14px;z-index:51;
    width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.92);color:var(--ink);
    font-size:1.3rem;font-weight:800;line-height:1;
    display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);
  }

  /* ===== 駐車場 ===== */
  .park-tag{
    display:inline-flex;align-items:center;gap:6px;background:var(--line);
    color:var(--court);font-weight:700;font-size:.82rem;
    padding:5px 12px;border-radius:999px;margin-bottom:10px;
  }
  .park-row{display:flex;gap:14px;font-size:.92rem;padding:6px 0;border-top:1px dashed #e7ddca}
  .park-row:first-of-type{border-top:0}
  .park-row .k{flex:none;width:64px;color:var(--ink-soft);font-weight:700}

  /* ===== ルートステップ ===== */
  .step{position:relative;margin-bottom:16px}
  .step .card{display:flex;flex-direction:column}
  .step-num{
    position:absolute;top:-8px;left:-6px;z-index:2;
    width:34px;height:34px;border-radius:50%;
    background:var(--ball);color:#fff;font-weight:800;
    display:grid;place-items:center;box-shadow:0 3px 8px rgba(210,84,26,.4);
    border:3px solid var(--paper);
  }
  .step .cp-photo{width:100%;height:auto;display:block;background:#f0ebe1}
  .step .body h3{font-size:1.02rem;font-weight:800;margin-bottom:2px}
  .step .body p{font-size:.9rem;color:#52463a}
  .step-line{
    height:22px;width:3px;margin:0 auto -6px;
    background:linear-gradient(var(--ball),rgba(238,108,43,.25));border-radius:3px;
  }

  /* ===== 持ち物・お願い ===== */
  .notes li{
    list-style:none;display:flex;gap:10px;align-items:flex-start;
    padding:9px 0;border-top:1px dashed #e7ddca;font-size:.93rem;
  }
  .notes li:first-child{border-top:0}
  .notes .ic{flex:none;font-size:1.05rem;line-height:1.6}

  /* ===== 連絡先 ===== */
  .tel{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:1.25rem;font-weight:800;color:var(--court);text-decoration:none;
    padding:6px 0 2px;
  }
  .tel small{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:600;text-align:center}

  footer{text-align:center;color:var(--ink-soft);font-size:.74rem;margin-top:34px;line-height:1.7}
</style>
</head>
<body>
<header>
  <span class="ball-emoji">🏀</span>
  <h1 id="venueName">さくら市立南小学校 体育館</h1>
  <div class="sub" id="eventName">ミニバス大会 会場案内</div>
  <div class="addr" id="venueAddr">〒329-1311 栃木県さくら市氏家1061-3</div>
</header>

<div class="wrap">

  <!-- 地図 -->
  <section id="map">
    <div class="card">
      <iframe class="map-frame" id="mapFrame" loading="lazy" allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="body" style="padding-top:14px">
        <a class="btn btn-nav" id="navBtn" target="_blank" rel="noopener">🧭 地図アプリでナビ開始</a>
        <div class="hint">お使いのスマホの地図アプリでルート案内が始まります</div>
      </div>
    </div>
  </section>

  <!-- ① 会場までの車ルート（チェックポイント） -->
  <section id="route">
    <div class="sec-head"><div class="sec-no">1</div><h2>会場までの車ルート</h2></div>
    <div class="card" style="margin-bottom:16px">
      <div id="routeMapWrap"></div>
    </div>
    <div id="checkpoints"></div>
  </section>

  <!-- ② 駐車場のご案内 -->
  <section id="parking">
    <div class="sec-head"><div class="sec-no">2</div><h2>駐車場のご案内</h2></div>
    <div class="card">
      <div id="guideMapWrap"></div>
      <div class="body">
        <span class="park-tag">🅿️ 来場チーム用駐車場</span>
        <div id="parkInfo"></div>
      </div>
    </div>
  </section>

  <!-- ③ 持ち物・お願い -->
  <section id="notes">
    <div class="sec-head"><div class="sec-no">3</div><h2>持ち物・お願い</h2></div>
    <div class="card"><div class="body">
      <ul class="notes" id="noteList"></ul>
    </div></div>
  </section>

  <!-- 連絡先 -->
  <section id="contact">
    <div class="card"><div class="body" style="text-align:center">
      <small style="color:var(--ink-soft);font-weight:700;font-size:.8rem">当日のお問い合わせ</small>
      <a class="tel" id="telLink"></a>
    </div></div>
    <a class="btn btn-line" id="lineBtn">💬 LINEでこの案内を共有</a>
  </section>

  <footer>
    南ヶ丘MBC 会場案内
  </footer>
</div>

<!-- 地図・案内図 拡大表示 -->
<div class="lightbox" id="lightbox">
  <button class="close" id="lightboxClose" aria-label="閉じる">✕</button>
  <img id="lightboxImg" src="" alt="拡大表示">
</div>

<script>
/* =========================================================
   ▼▼▼ ここだけ編集すれば完成します（CONFIG）▼▼▼
   ========================================================= */
const CONFIG = {
  // --- 会場の基本情報 ---
  venueName : "さくら市立南小学校 体育館",
  eventName : "ミニバス会場案内",          // 大会名・サブタイトル
  address   : "〒329-1311 栃木県さくら市氏家1061-3",
  // ナビ・地図のピン用（学校名＋住所が一番正確に出ます）
  mapQuery  : "さくら市立南小学校 栃木県さくら市氏家1061-3",

  // --- 当日連絡先 ---
  tel       : "090-0000-0000",                  // ←実際の番号に

  // --- ① 会場までの車ルート ---
  // ルート地図（①〜⑤を書き込んだ地図画像）。タップで拡大できます。
  routeMap        : "minami-gym-route-map.jpg",
  routeMapCaption : "赤い線が来場者の順路です。①〜⑤は下のチェックポイントと対応しています。図はタップで拡大できます。",
  // 5つのチェックポイント（photo に写真URLを入れると各カードに表示されます）
  checkpoints : [
    { title:"学校正門前の交差点を右折", desc:"学校正門前の交差点が順路のスタートです。この交差点を右折し道なりに進みます。", photo:"minami-gym-cp1.jpg" },
    { title:"南東の角を左折",     desc:"突き当りの角を左折し、学校の東側に沿った道路を北へ進みます。", photo:"minami-gym-cp2.jpg" },
    { title:"学校東側の裏門から左折で校内へ",   desc:"学校東側の裏門から校内に入り、通路に沿って北上します。段差に気をつけてください。", photo:"minami-gym-cp3.jpg" },
    { title:"校舎北東の通路に沿って左へ",     desc:"校舎の北東まで来たら通路に沿って左に曲がります。", photo:"minami-gym-cp4.jpg" },
    { title:"体育館周辺の駐車場に到着",     desc:"角を曲がった先が来場チーム用の駐車場です。体育館横の砂利の駐車場と校舎横のアスファルトの駐車場をご使用ください。", photo:"minami-gym-cp5.jpg" }
  ],

  // --- ② 駐車場のご案内 ---
  guideMap        : "minami-gym-parking-map.png",
  guideMapCaption : "赤い枠が来場チーム用の駐車場です。図はタップで拡大できます。",
  mapNorthDeg     : 90,   // 案内図の北の向き（0=上が北 / -90=左が北 / 90=右が北 / 180=下が北）

  // 駐車場の案内（行は自由に増減OK）
  parking : [
    { k:"場所",   v:"体育館まわりの来場チーム用駐車場（案内図の赤枠）" },
    { k:"台数",   v:"チームごとに譲り合ってご利用ください" },
    { k:"注意",   v:"児童が通ります。スピードにご注意ください" }
  ],

  // --- 持ち物・お願い（アイコン＋本文） ---
  notes : [
    { ic:"👟", t:"シューズ・スリッパ（保護者・選手とも必須）" },
    { ic:"🗑️", t:"ゴミは各自お持ち帰りください" },
    { ic:"🚗", t:"校内は徐行運転、児童の安全にご配慮を" },
    { ic:"📣", t:"応援は譲り合って、マナーよくお願いします" }
  ]
};
/* =========================================================
   ▲▲▲ 編集はここまで。以下は触らなくてOK ▲▲▲
   ========================================================= */

// --- 反映処理 ---
document.getElementById('venueName').textContent = CONFIG.venueName;
document.getElementById('eventName').textContent = CONFIG.eventName;
document.getElementById('venueAddr').textContent = CONFIG.address;
document.title = "会場案内 ｜ " + CONFIG.venueName;

const q = encodeURIComponent(CONFIG.mapQuery);
document.getElementById('mapFrame').src = "https://maps.google.com/maps?q=" + q + "&z=17&output=embed";
document.getElementById('navBtn').href = "https://www.google.com/maps/dir/?api=1&destination=" + q;

// 連絡先
const tel = document.getElementById('telLink');
tel.href = "tel:" + CONFIG.tel.replace(/[^0-9+]/g,'');
tel.innerHTML = "📞 " + CONFIG.tel;

// --- 拡大表示（ライトボックス）共通処理 ---
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightboxImg');
function openLightbox(src, alt){
  lbImg.src = src; lbImg.alt = alt || '拡大表示';
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
});

// タップで拡大できる地図画像を生成（overlay に方位記号などを差し込める）
function zoomableMap(src, alt, caption, overlay){
  const cap = caption ? `<div class="map-cap">${caption}</div>` : '';
  return `<div class="guidemap" role="button" tabindex="0" aria-label="${alt}を拡大"
             data-full="${src}" data-alt="${alt}">
            <img src="${src}" alt="${alt}">
            ${overlay || ''}
            <span class="zoom-tag">🔍 タップで拡大</span>
          </div>${cap}`;
}
function bindZoom(el){
  if (!el) return;
  const open = (e) => { e.preventDefault(); openLightbox(el.dataset.full, el.dataset.alt); };
  el.addEventListener('click', open);
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(e); });
}

// 方位記号（コンパス）SVG ※針のみ。北の方角は mapNorthDeg で回転
const COMPASS_SVG = `
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="方位">
  <circle cx="32" cy="32" r="30" fill="#ffffff" fill-opacity="0.93"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#e0d6c4" stroke-width="2"/>
  <polygon points="32,16 38,34 32,30 26,34" fill="#e5484d"/>
  <polygon points="32,52 38,34 32,38 26,34" fill="#9a8f7d"/>
  <circle cx="32" cy="34" r="2.6" fill="#2b2118"/>
</svg>`;

// ① 車ルート地図＋チェックポイント
(function(){
  const wrap = document.getElementById('routeMapWrap');
  if (CONFIG.routeMap) {
    wrap.innerHTML = zoomableMap(CONFIG.routeMap, '会場までの車ルート地図', CONFIG.routeMapCaption);
    bindZoom(wrap.querySelector('.guidemap'));
  } else {
    wrap.innerHTML = `<div class="photo-ph"><span class="ic">🗺️</span><span class="tx">ルート地図をここに</span></div>`;
  }
  const cps = CONFIG.checkpoints || [];
  document.getElementById('checkpoints').innerHTML = cps.map((c,i) => {
    const line = i < cps.length-1 ? `<div class="step-line"></div>` : '';
    const media = c.photo ? `<img class="cp-photo" src="${c.photo}" alt="${c.title}" loading="lazy">` : '';
    return `<div class="step">
        <div class="step-num">${i+1}</div>
        <div class="card">${media}<div class="body"><h3>${c.title}</h3><p>${c.desc}</p></div></div>
      </div>${line}`;
  }).join('');
})();

// ② 駐車場案内図（方位記号つき）
(function(){
  const wrap = document.getElementById('guideMapWrap');
  if (CONFIG.guideMap) {
    const deg = Number(CONFIG.mapNorthDeg) || 0;
    const compass = `<div class="compass" style="transform:rotate(${deg}deg)">${COMPASS_SVG}` +
      `<span class="compass-n" style="transform:translateX(-50%) rotate(${-deg}deg)">N</span></div>`;
    wrap.innerHTML = zoomableMap(CONFIG.guideMap,
      'さくら市立南小学校 体育館周辺 駐車場ご案内図', CONFIG.guideMapCaption, compass);
    bindZoom(wrap.querySelector('.guidemap'));
  } else {
    wrap.innerHTML = `<div class="photo-ph"><span class="ic">📷</span><span class="tx">駐車場の写真をここに</span></div>`;
  }
})();

// 駐車場テキスト
document.getElementById('parkInfo').innerHTML = CONFIG.parking.map(r =>
  `<div class="park-row"><span class="k">${r.k}</span><span>${r.v}</span></div>`).join('');

// 持ち物
document.getElementById('noteList').innerHTML = CONFIG.notes.map(n =>
  `<li><span class="ic">${n.ic}</span><span>${n.t}</span></li>`).join('');

// LINE共有
document.getElementById('lineBtn').addEventListener('click', () => {
  const url = location.href.split('#')[0];
  const text = `【会場案内】${CONFIG.venueName}\n${CONFIG.address}\n${url}`;
  const share = "https://line.me/R/msg/text/?" + encodeURIComponent(text);
  if (navigator.share) {
    navigator.share({ title:CONFIG.venueName, text:`【会場案内】${CONFIG.venueName}`, url }).catch(()=>location.href=share);
  } else {
    location.href = share;
  }
});
</script>
</body>
</html>
