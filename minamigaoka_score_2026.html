<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合結果入力フォーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #666;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            bottom: -2px;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .year-link {
            text-align: center;
            margin-bottom: 25px;
        }

        .year-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 15px;
            border: 2px solid #667eea;
            border-radius: 20px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .year-link a:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="time"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .datetime-group {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .score-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .footer-info h4 {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .url-display {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #333;
            word-break: break-all;
            line-height: 1.6;
            border: 1px solid #e0e0e0;
        }

        .url-display.not-configured {
            color: #e74c3c;
            font-family: inherit;
            font-style: italic;
        }

        .url-display.configured {
            color: #28a745;
        }

        .preview-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-header h3 {
            margin: 0;
            color: #333;
        }

        .reload-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reload-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .reload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .preview-container {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table thead {
            background: #667eea;
            color: white;
        }

        .data-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .data-table tbody tr:hover {
            background: #f8f9fa;
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* 勝敗列のスタイル */
        .result-cell {
            font-weight: 700;
            text-align: center;
        }

        .result-win {
            color: #28a745;
            background: #d4edda;
        }

        .result-lose {
            color: #fd7e14;
            background: #fff3cd;
        }

        .result-draw {
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #667eea;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: #e74c3c;
        }

        .data-count {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        .stats-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 15px;
            color: white;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.9;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
        }

        .stats-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat-value {
                font-size: 16px;
            }
        }

        .required {
            color: #e74c3c;
        }

        .config-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .config-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .config-section small {
            color: #666;
            display: block;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .score-group {
                grid-template-columns: 1fr;
            }

            .tabs {
                gap: 5px;
            }

            .tab {
                padding: 10px 16px;
                font-size: 14px;
            }

            .preview-header {
                justify-content: center;
            }

            .reload-btn {
                width: auto;
            }

            .data-table {
                font-size: 12px;
            }

            .data-table th,
            .data-table td {
                padding: 8px;
            }
        }

        /* 編集・削除ボタン */
        .action-btns {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .edit-btn, .delete-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .edit-btn {
            background: #667eea;
            color: white;
        }

        .edit-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .delete-btn:hover {
            background: #c0392b;
            transform: translateY(-1px);
        }

        .image-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .upload-image-btn {
            background: #27ae60;
            color: white;
        }

        .upload-image-btn:hover {
            background: #229954;
            transform: translateY(-1px);
        }

        .view-image-btn {
            background: #3498db;
            color: white;
        }

        .view-image-btn:hover {
            background: #2980b9;
            transform: translateY(-1px);
        }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            color: #333;
            font-size: 22px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #999;
            cursor: pointer;
            line-height: 1;
            padding: 0;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn.primary {
            background: #667eea;
            color: white;
        }

        .modal-btn.primary:hover {
            background: #5568d3;
        }

        .modal-btn.secondary {
            background: #e0e0e0;
            color: #333;
        }

        .modal-btn.secondary:hover {
            background: #d0d0d0;
        }

        .modal-btn.danger {
            background: #e74c3c;
            color: white;
        }

        .modal-btn.danger:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏀 南ヶ丘MBC試合結果記録アプリ(2026年度)</h1>
        <p class="subtitle">南ヶ丘MBCの試合データを記録/閲覧</p>
        <div class="year-link">
            <a href="https://upstartman.github.io/minamigaoka/minamigaoka_score.html" target="_blank">📅 2025年度データ</a>
        </div>


        <!-- タブナビゲーション -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('form')">📝 データ入力</button>
            <button class="tab" onclick="switchTab('preview')">📊 データ閲覧</button>
        </div>

        <!-- データ入力タブ -->
        <div id="formTab" class="tab-content active">
            <form id="matchForm">
            <div class="form-group">
                <label for="date">日付・試合終了時間 <span class="required">*</span></label>
                <div class="datetime-group">
                    <input type="date" id="date" name="date" required />
                    <input type="time" id="endTime" name="endTime" required placeholder="試合終了時間" />
                </div>
            </div>

            <div class="form-group">
                <label for="tournament">大会名 <span class="required">*</span></label>
                <input type="text" id="tournament" name="tournament" placeholder="例：練習試合" required />
            </div>

            <div class="form-group">
                <label for="venue">会場 <span class="required">*</span></label>
                <input type="text" id="venue" name="venue" placeholder="例：南小学校" required />
            </div>

            <div class="form-group">
                <label for="opponent">対戦チーム名 <span class="required">*</span></label>
                <input type="text" id="opponent" name="opponent" placeholder="例：西が岡" required />
            </div>

            <div class="form-group">
                <label>スコア <span class="required">*</span></label>
                <div class="score-group">
                    <div>
                        <input type="number" id="scoreMinamiGaoka" name="scoreMinamiGaoka" placeholder="南ヶ丘" min="0" required />
                    </div>
                    <div>
                        <input type="number" id="scoreOpponent" name="scoreOpponent" placeholder="対戦チーム" min="0" required />
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="scoresheetImage">📷 スコアシート画像 <span style="color: #999; font-weight: normal;">(任意)</span></label>
                <input type="file" id="scoresheetImage" name="scoresheetImage" accept="image/*" style="padding: 10px; border: 2px dashed #667eea; border-radius: 8px;" />
                <p style="margin-top: 8px; font-size: 12px; color: #666;">
                    JPG, PNG, JPEG形式（最大10MB）
                </p>
                <div id="imagePreviewBox" style="display: none; margin-top: 10px;">
                    <p style="font-size: 13px; color: #667eea; margin-bottom: 5px;">プレビュー:</p>
                    <div style="max-width: 100%; max-height: 200px; overflow: auto; border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: #f8f9fa;">
                        <img id="imagePreviewMain" style="max-width: 100%; height: auto;" />
                    </div>
                    <button type="button" onclick="clearImageSelection()" style="margin-top: 8px; padding: 6px 12px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 12px;">画像をクリア</button>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">データを追加</button>
        </form>

        <div id="statusMessage" class="status-message"></div>
        </div>

        <!-- データプレビュータブ -->
        <div id="previewTab" class="tab-content">
            <div class="preview-header">
                <button class="reload-btn" onclick="loadPreviewData()">🔄 更新</button>
            </div>
            
            <div id="previewContent">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>データを読み込んでいます...</p>
                </div>
            </div>
            
            <div class="data-count" id="dataCount"></div>
        </div>

        <div class="footer-info">
            <h4>📡 設定情報</h4>
            <div id="urlDisplay" class="url-display"></div>
        </div>
    </div>

    <!-- 編集モーダル -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ データを編集</h2>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editRowIndex">
                
                <div class="form-group">
                    <label for="editDate">日付と試合終了時間 <span class="required">*</span></label>
                    <div class="datetime-group">
                        <input type="date" id="editDate" required />
                        <input type="time" id="editEndTime" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="editTournament">大会名 <span class="required">*</span></label>
                    <input type="text" id="editTournament" required />
                </div>

                <div class="form-group">
                    <label for="editVenue">会場 <span class="required">*</span></label>
                    <input type="text" id="editVenue" required />
                </div>

                <div class="form-group">
                    <label for="editOpponent">対戦チーム名 <span class="required">*</span></label>
                    <input type="text" id="editOpponent" required />
                </div>

                <div class="form-group">
                    <label>スコア <span class="required">*</span></label>
                    <div class="score-group">
                        <div>
                            <input type="number" id="editScoreMinamiGaoka" placeholder="南ヶ丘" min="0" required />
                        </div>
                        <div>
                            <input type="number" id="editScoreOpponent" placeholder="対戦チーム" min="0" required />
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="modal-btn secondary" onclick="closeEditModal()">キャンセル</button>
                    <button type="submit" class="modal-btn primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🗑️ データを削除</h2>
                <button class="close-btn" onclick="closeDeleteModal()">&times;</button>
            </div>
            <p style="margin: 20px 0; color: #666;">このデータを削除してもよろしいですか？</p>
            <div id="deletePreview" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 15px 0;"></div>
            <input type="hidden" id="deleteRowIndex">
            <div class="modal-actions">
                <button type="button" class="modal-btn secondary" onclick="closeDeleteModal()">キャンセル</button>
                <button type="button" class="modal-btn danger" onclick="confirmDelete()">削除</button>
            </div>
        </div>
    </div>

    <!-- 画像アップロードモーダル -->
    <div id="imageUploadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📷 スコアシート画像を追加</h2>
                <button class="close-btn" onclick="closeImageUploadModal()">&times;</button>
            </div>
            <div id="imageUploadInfo" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 15px 0;"></div>
            <input type="hidden" id="imageUploadRowIndex">
            
            <div class="form-group">
                <label for="imageFileInput">画像を選択 <span class="required">*</span></label>
                <input type="file" id="imageFileInput" accept="image/*" required style="padding: 10px; border: 2px dashed #667eea; border-radius: 8px;" />
                <p style="margin-top: 8px; font-size: 12px; color: #666;">JPG, PNG, JPEG形式の画像をアップロードできます</p>
            </div>
            
            <div id="imagePreviewContainer" style="display: none; margin: 15px 0;">
                <label>プレビュー:</label>
                <div style="max-width: 100%; max-height: 400px; overflow: auto; border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: #f8f9fa;">
                    <img id="imagePreview" style="max-width: 100%; height: auto;" />
                </div>
            </div>
            
            <div class="modal-actions">
                <button type="button" class="modal-btn secondary" onclick="closeImageUploadModal()">キャンセル</button>
                <button type="button" class="modal-btn primary" onclick="uploadImage()">アップロード</button>
            </div>
        </div>
    </div>

    <!-- 画像表示モーダル -->
    <div id="imageViewModal" class="modal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h2>📷 スコアシート画像</h2>
                <button class="close-btn" onclick="closeImageViewModal()">&times;</button>

        // プレビューデータを読み込む
        async function loadPreviewData() {
            if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                showPreviewError('Google Apps Script URLが設定されていません');
                return;
            }

            const previewContent = document.getElementById('previewContent');
            const dataCount = document.getElementById('dataCount');
            
            // ローディング表示
            previewContent.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>データを読み込んでいます...</p>
                </div>
            `;
            dataCount.textContent = '';

            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();

                if (result.status === 'success') {
                    if (result.data && result.data.length > 0) {
                        // 日付と試合終了時間でソート（新しい順）
                        const sortedData = result.data.sort((a, b) => {
                            // 日付文字列をYYYY-MM-DD形式に正規化
                            const dateA = a.date.replace(/\//g, '-');
                            const dateB = b.date.replace(/\//g, '-');
                            
                            // 日付と時間を組み合わせて比較
                            const datetimeA = dateA + ' ' + (a.endTime || '00:00');
                            const datetimeB = dateB + ' ' + (b.endTime || '00:00');
                            
                            // 降順ソート（新しいものが上）
                            return datetimeB.localeCompare(datetimeA);
                        });
                        
                        displayPreviewData(sortedData, result.stats);
                        dataCount.textContent = `${result.count}件のデータ`;
                    } else {
                        showPreviewEmpty();
                    }
                } else {
                    showPreviewError(result.message || 'データの取得に失敗しました');
                }
            } catch (error) {
                console.error('Preview error:', error);
                showPreviewError('データの読み込み中にエラーが発生しました');
            }
        }

        // プレビューデータを表示
        function displayPreviewData(data, stats) {

            // 集計情報を表示（J1~N2）

                        html += `

                }
                
                html += `

            // データテーブルを表示
            html += `

            data.forEach(row => {
                // 日付をスラッシュ区切りに変換
                const formattedDate = formatDateForDisplay(row.date);

                // 勝敗に応じたクラスを決定

                    resultClass += ' result-lose';

        // パーセント表示にフォーマット（小数点以下2桁）
        function formatPercentage(value) {
            if (value === '' || value === null || value === undefined) {
                return '';
            }
            
            try {
                let numValue = parseFloat(value);
                
                // 既にパーセント値（0-100の範囲）の場合
                if (numValue > 1) {
                    return numValue.toFixed(2) + '%';
                }
                
                // 小数（0-1の範囲）の場合は100倍してパーセント表示
                return (numValue * 100).toFixed(2) + '%';
            } catch (error) {
                // 数値に変換できない場合はそのまま返す
                return String(value);
            }
        }

        // 日付をYYYY/MM/DD形式でフォーマット
        function formatDateForDisplay(dateStr) {
            if (!dateStr) return '';
            
            try {
                // 既にYYYY/MM/DD形式の場合はそのまま返す
                if (/^\d{4}\/\d{2}\/\d{2}$/.test(dateStr)) {
                    return dateStr;
                }
                
                // YYYY-MM-DD形式の場合はスラッシュに変換
                if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                    return dateStr.replace(/-/g, '/');
                }
                
                // ISO形式（YYYY-MM-DDTHH:mm:ss.sssZ）の場合
                if (dateStr.includes('T')) {
                    const date = new Date(dateStr);
                    if (!isNaN(date.getTime())) {
                        const year = date.getFullYear();
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        const day = String(date.getDate()).padStart(2, '0');
                        return `${year}/${month}/${day}`;
                    }
                }
                
                // その他の形式の場合もDateオブジェクトとしてパース
                const date = new Date(dateStr);
                if (!isNaN(date.getTime())) {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}/${month}/${day}`;
                }
                
                // パースできない場合は元の文字列を返す
                return dateStr;
            } catch (error) {
                console.error('Date formatting error:', error);
                return dateStr;
            }
        }

        // 時刻をHH:MM形式でフォーマット
        function formatTimeForDisplay(timeStr) {
            if (!timeStr || timeStr === '') return '';
            
            try {
                // 既にHH:MM形式の場合はそのまま返す
                if (/^\d{1,2}:\d{2}$/.test(timeStr)) {
                    return timeStr;
                }
                
                // ISO形式（1899-12-30T06:26:00.000Zなど）の場合
                if (typeof timeStr === 'string' && timeStr.includes('T')) {
                    const date = new Date(timeStr);
                    if (!isNaN(date.getTime())) {
                        const hours = String(date.getHours()).padStart(2, '0');
                        const minutes = String(date.getMinutes()).padStart(2, '0');
                        return `${hours}:${minutes}`;
                    }
                }
                
                // その他の場合はそのまま返す
                return timeStr;
            } catch (error) {
                console.error('Time formatting error:', error);
                return timeStr;
            }
        }

        // データ追加時の画像アップロード
        async function uploadImageWithData(file) {
            // ファイルサイズチェック（10MB以下）
            if (file.size > 10 * 1024 * 1024) {
                console.error('ファイルサイズエラー:', file.size);
                showMessage('画像ファイルサイズが大きすぎます（10MB以下にしてください）', 'error');
                return;
            }
            
            try {
                console.log('画像ファイル情報:', {
                    name: file.name,
                    size: file.size,
                    type: file.type
                });
                
                // ファイルをBase64に変換
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        console.log('Base64変換完了');
                        resolve(reader.result);
                    };
                    reader.onerror = () => {
                        console.error('ファイル読み込みエラー');
                        reject(new Error('ファイル読み込みエラー'));
                    };
                    reader.readAsDataURL(file);
                });
                
                const uploadData = {
                    action: 'upload_image',
                    rowIndex: 2, // 新しく追加された行は常に2行目
                    imageData: base64Data,
                    fileName: file.name,
                    mimeType: file.type
                };
                
                console.log('画像アップロードリクエスト送信:', {
                    action: uploadData.action,
                    rowIndex: uploadData.rowIndex,
                    fileName: uploadData.fileName,
                    mimeType: uploadData.mimeType,
                    dataLength: base64Data.length
                });
                
                // Google Apps Scriptに送信（2行目に画像を紐づける）
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(uploadData),
                    mode: 'no-cors'
                });
                
                console.log('画像アップロードリクエスト送信完了');
                
                // no-corsモードなので、Google Apps Scriptのログで結果を確認する必要がある
                console.log('⚠️ no-corsモードのため、アップロード結果は確認できません');
                console.log('Google Apps Scriptの実行ログで結果を確認してください');
                
            } catch (error) {
                console.error('Image upload error:', error);
                showMessage('データは追加されましたが、画像のアップロードに失敗しました', 'error');
                throw error;
            }
        }

                <p style="margin: 5px 0;"><strong>大会名:</strong> ${escapeHtml(row.tournament)}</p>
                <p style="margin: 5px 0;"><strong>対戦チーム:</strong> ${escapeHtml(row.opponent)}</p>
                <p style="margin: 5px 0;"><strong>スコア:</strong> ${escapeHtml(row.scoreMinamiGaoka)} - ${escapeHtml(row.scoreOpponent)}</p>
            `;
            
            document.getElementById('deleteModal').classList.add('show');
        }

        // 削除モーダルを閉じる
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
        }

        // 削除を実行
        async function confirmDelete() {
            if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                showMessage('エラー: HTMLファイル内のSCRIPT_URLを設定してください', 'error');
                return;
            }

            const rowIndex = parseInt(document.getElementById('deleteRowIndex').value);

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'delete',
                        rowIndex: rowIndex
                    })
                });

                showMessage('データを削除しました！', 'success');
                closeDeleteModal();
                
                // プレビューを更新
                setTimeout(() => {
                    loadPreviewData();
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                showMessage('エラーが発生しました。', 'error');
            }
        }

        // モーダル外クリックで閉じる
        window.onclick = function(event) {
            const editModal = document.getElementById('editModal');
            const deleteModal = document.getElementById('deleteModal');
            const imageUploadModal = document.getElementById('imageUploadModal');
            const imageViewModal = document.getElementById('imageViewModal');
            
            if (event.target == editModal) {
                closeEditModal();
            }
            if (event.target == deleteModal) {
                closeDeleteModal();
            }
            if (event.target == imageUploadModal) {
                closeImageUploadModal();
            }
            if (event.target == imageViewModal) {
                closeImageViewModal();
            }
        }

        // ===== 画像アップロード関連の関数 =====
        
        /**
         * Google DriveのURLを直接表示可能な形式に変換
         * 複数の形式を試して最も確実な方法を使用
         */
        function convertToDirectImageUrl(url) {
            if (!url) return '';
            
            // 既に直接表示形式の場合はそのまま返す
            if (url.includes('drive.google.com/uc?export=view&id=') || 
                url.includes('drive.google.com/thumbnail?id=')) {
                return url;
            }
            
            // FILE_IDを抽出
            let fileId = null;
            
            // パターン1: https://drive.google.com/file/d/FILE_ID/view
            const pattern1 = /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/;
            const match1 = url.match(pattern1);
            if (match1) {
                fileId = match1[1];
            }
            
            // パターン2: https://drive.google.com/open?id=FILE_ID
            const pattern2 = /drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/;
            const match2 = url.match(pattern2);
            if (match2) {
                fileId = match2[1];
            }
            
            // パターン3: URLパラメータからid取得
            const pattern3 = /[?&]id=([a-zA-Z0-9_-]+)/;
            const match3 = url.match(pattern3);
            if (match3) {
                fileId = match3[1];
            }
            
            // ファイルIDが見つかった場合、サムネイル表示URLに変換（より確実）
            if (fileId) {
                // サムネイル形式（最も確実に表示できる）
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
            }
            
            // 変換できない場合は元のURLを返す
            console.warn('URLからファイルIDを抽出できませんでした:', url);
            return url;
        }
        
        // 画像アップロードモーダルを開く
        function openImageUploadModal(rowData) {
            const modal = document.getElementById('imageUploadModal');
            const infoDiv = document.getElementById('imageUploadInfo');
            const rowIndexInput = document.getElementById('imageUploadRowIndex');
            const fileInput = document.getElementById('imageFileInput');
            const previewContainer = document.getElementById('imagePreviewContainer');
            
            // 行番号を保存
            rowIndexInput.value = rowData.rowIndex;
            
            // 試合情報を表示
            infoDiv.innerHTML = `
                <strong>試合情報:</strong><br>
                日付: ${escapeHtml(formatDateForDisplay(rowData.date))} ${escapeHtml(rowData.endTime)}<br>
                大会名: ${escapeHtml(rowData.tournament)}<br>
                対戦相手: ${escapeHtml(rowData.opponent)}
            `;
            
            // ファイル入力とプレビューをリセット
            fileInput.value = '';
            previewContainer.style.display = 'none';
            
            // モーダルを表示
            modal.style.display = 'block';
        }
        
        // 画像アップロードモーダルを閉じる
        function closeImageUploadModal() {
            const modal = document.getElementById('imageUploadModal');
            modal.style.display = 'none';
        }
        
        // ファイル選択時のプレビュー表示
        document.getElementById('imageFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const preview = document.getElementById('imagePreview');
                    const container = document.getElementById('imagePreviewContainer');
                    preview.src = event.target.result;
                    container.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
        
        // 画像をアップロード
        async function uploadImage() {
            const fileInput = document.getElementById('imageFileInput');
            const rowIndex = document.getElementById('imageUploadRowIndex').value;
            
            if (!fileInput.files || fileInput.files.length === 0) {
                showMessage('画像ファイルを選択してください', 'error');
                return;
            }
            
            const file = fileInput.files[0];
            
            // ファイルサイズチェック（10MB以下）
            if (file.size > 10 * 1024 * 1024) {
                showMessage('ファイルサイズが大きすぎます（10MB以下にしてください）', 'error');
                return;
            }
            
            try {
                // ファイルをBase64に変換
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64Data = e.target.result;
                    
                    // Google Apps Scriptに送信
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            action: 'upload_image',
                            rowIndex: parseInt(rowIndex),
                            imageData: base64Data,
                            fileName: file.name,
                            mimeType: file.type
                        }),
                        mode: 'no-cors'
                    });
                    
                    // アップロード成功
                    showMessage('画像をアップロードしました！', 'success');
                    closeImageUploadModal();
                    
                    // プレビューを更新（Google Driveの共有設定反映を待つため3秒待機）
                    setTimeout(() => {
                        loadPreviewData();
                    }, 3000);
                };
                reader.readAsDataURL(file);
                
            } catch (error) {
                console.error('Error:', error);
                showMessage('画像のアップロードに失敗しました', 'error');
            }
        }
        
        // 画像を表示
        function viewImage(imageUrl, rowData) {
            const modal = document.getElementById('imageViewModal');
            const infoDiv = document.getElementById('imageViewInfo');
            const rowIndexInput = document.getElementById('imageViewRowIndex');
            const imageUrlInput = document.getElementById('imageViewUrl');
            const imageDisplay = document.getElementById('imageViewDisplay');
            const downloadLink = document.getElementById('imageDownloadLink');
            
            // デバッグ用：元のURLをコンソールに出力
            console.log('元の画像URL:', imageUrl);
            
            // 行番号とURLを保存
            rowIndexInput.value = rowData.rowIndex;
            imageUrlInput.value = imageUrl;
            
            // 試合情報を表示
            infoDiv.innerHTML = `
                <strong>試合情報:</strong><br>
                日付: ${escapeHtml(formatDateForDisplay(rowData.date))} ${escapeHtml(rowData.endTime)}<br>
                大会名: ${escapeHtml(rowData.tournament)}<br>
                対戦相手: ${escapeHtml(rowData.opponent)}
            `;
            
            // URLを直接表示可能な形式に変換
            const directImageUrl = convertToDirectImageUrl(imageUrl);
            
            // デバッグ用：変換後のURLをコンソールに出力
            console.log('変換後の画像URL:', directImageUrl);
            
            // 画像を表示
            imageDisplay.src = directImageUrl;
            
            // 画像読み込みエラーのハンドリング
            imageDisplay.onerror = function() {
                console.error('画像の読み込みに失敗しました:', directImageUrl);
                // エラー時に代替テキストを表示
                infoDiv.innerHTML += `<br><span style="color: red;">⚠️ 画像の読み込みに失敗しました。URLをご確認ください。</span><br>URL: ${directImageUrl}`;
            };
            
            imageDisplay.onload = function() {
                console.log('画像の読み込みに成功しました');
            };
            
            downloadLink.href = directImageUrl;
            downloadLink.download = `scoresheet_${rowData.date}_${rowData.opponent}.jpg`;
            
            // モーダルを表示
            modal.style.display = 'block';
        }
        
        // 画像表示モーダルを閉じる
        function closeImageViewModal() {
            const modal = document.getElementById('imageViewModal');
            modal.style.display = 'none';
        }
        
        // 画像を変更（既存の画像を置き換え）
        function replaceImage() {
            const rowIndex = document.getElementById('imageViewRowIndex').value;
            const rowData = { rowIndex: parseInt(rowIndex) };
            
            // 画像表示モーダルを閉じる
            closeImageViewModal();
            
            // 画像アップロードモーダルを開く
            // 現在のデータを再取得してから開く
            const previewContent = document.getElementById('previewContent');
            // データを取得し直してからモーダルを開く（簡易的に再読み込み）
            setTimeout(() => {
                loadPreviewData().then(() => {
                    // データが更新されたら、該当行のデータを見つけて画像アップロードモーダルを開く
                    // ここでは簡易的に行番号だけで処理
                    const simpleRowData = {
                        rowIndex: parseInt(rowIndex),
                        date: '',
                        endTime: '',
                        tournament: '（画像を変更中）',
                        opponent: ''
                    };
                    openImageUploadModal(simpleRowData);
                });
            }, 100);
        }
    </script>
