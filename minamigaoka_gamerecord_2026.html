<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合結果入力フォーム</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #666;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            bottom: -2px;
        }

        .tab:hover { color: #667eea; }
        .tab.active { color: #667eea; border-bottom-color: #667eea; }

        .tab-content { display: none; }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 { color: #333; margin-bottom: 10px; font-size: 28px; text-align: center; }

        .subtitle { text-align: center; color: #666; margin-bottom: 10px; font-size: 14px; }

        .year-link { text-align: center; margin-bottom: 25px; }
        .year-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 15px;
            border: 2px solid #667eea;
            border-radius: 20px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .year-link a:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
        }

        .form-group { margin-bottom: 25px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="time"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .datetime-group { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; }
        .score-group    { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        .status-message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-message.error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-message.show    { display: block; animation: slideIn 0.3s ease; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .footer-info { margin-top: 30px; padding-top: 20px; border-top: 2px solid #e0e0e0; }
        .footer-info h4 {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .url-display {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #333;
            word-break: break-all;
            line-height: 1.6;
            border: 1px solid #e0e0e0;
        }
        .url-display.not-configured { color: #e74c3c; font-family: inherit; font-style: italic; }
        .url-display.configured { color: #28a745; }

        .preview-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .reload-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .reload-btn:hover { background: #5568d3; transform: translateY(-1px); }
        .reload-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .preview-container { overflow-x: auto; border-radius: 10px; border: 1px solid #e0e0e0; }

        .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .data-table thead { background: #667eea; color: white; }
        .data-table th { padding: 12px; text-align: left; font-weight: 600; white-space: nowrap; }
        .data-table td { padding: 12px; border-bottom: 1px solid #e0e0e0; }
        .data-table tbody tr:hover { background: #f8f9fa; }
        .data-table tbody tr:last-child td { border-bottom: none; }

        .result-cell { font-weight: 700; text-align: center; }
        .result-win  { color: #28a745; background: #d4edda; }
        .result-lose { color: #fd7e14; background: #fff3cd; }
        .result-draw { color: #666; }

        .empty-state { text-align: center; padding: 40px 20px; color: #666; }
        .empty-state-icon { font-size: 48px; margin-bottom: 10px; }

        .loading-state { text-align: center; padding: 40px 20px; color: #667eea; }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-state { text-align: center; padding: 40px 20px; color: #e74c3c; }
        .data-count { color: #666; font-size: 14px; margin-top: 10px; }

        .stats-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 15px;
            color: white;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .stat-item {
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .stat-label { font-size: 11px; opacity: 0.9; margin-bottom: 3px; }
        .stat-value { font-size: 18px; font-weight: 700; }
        .stats-title { font-size: 14px; font-weight: 600; margin: 0; }

        .required { color: #e74c3c; }

        /* 編集・削除・画像ボタン */
        .action-btns { display: flex; gap: 5px; justify-content: center; }
        .edit-btn, .delete-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .edit-btn   { background: #667eea; color: white; }
        .edit-btn:hover { background: #5568d3; transform: translateY(-1px); }
        .delete-btn { background: #e74c3c; color: white; }
        .delete-btn:hover { background: #c0392b; transform: translateY(-1px); }

        .image-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .upload-image-btn { background: #27ae60; color: white; }
        .upload-image-btn:hover { background: #229954; transform: translateY(-1px); }
        .view-image-btn { background: #3498db; color: white; }
        .view-image-btn:hover { background: #2980b9; transform: translateY(-1px); }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
        }
        .modal.show { display: flex; justify-content: center; align-items: center; animation: fadeIn 0.3s ease; }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { margin: 0; color: #333; font-size: 22px; }
        .close-btn { background: none; border: none; font-size: 28px; color: #999; cursor: pointer; line-height: 1; padding: 0; }
        .close-btn:hover { color: #333; }

        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .modal-btn.primary   { background: #667eea; color: white; }
        .modal-btn.primary:hover { background: #5568d3; }
        .modal-btn.secondary { background: #e0e0e0; color: #333; }
        .modal-btn.secondary:hover { background: #d0d0d0; }
        .modal-btn.danger    { background: #e74c3c; color: white; }
        .modal-btn.danger:hover { background: #c0392b; }
        .modal-btn.upload-image-btn { background: #27ae60; color: white; }
        .modal-btn.upload-image-btn:hover { background: #229954; }

        @media (max-width: 600px) {
            .container { padding: 20px 12px; }
            h1 { font-size: 20px; }
            .score-group { grid-template-columns: 1fr; }
            .tabs { gap: 5px; }
            .tab { padding: 10px 14px; font-size: 13px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-value { font-size: 16px; }
        }

        /* スマホ：テーブル → カード形式 */
        @media (max-width: 768px) {
            .preview-container { border: none; background: transparent; box-shadow: none; }
            .data-table thead { display: none; }
            .data-table, .data-table tbody { display: block; }
            .data-table tr {
                display: block;
                margin-bottom: 12px;
                border-radius: 12px;
                border: 1px solid #e0e0e0;
                overflow: hidden;
                background: white;
                box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            }
            .data-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 14px;
                border-bottom: 1px solid #f3f3f3;
                font-size: 14px;
                text-align: right;
            }
            .data-table td:last-child { border-bottom: none; }
            .data-table td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #999;
                font-size: 11px;
                text-align: left;
                flex-shrink: 0;
                margin-right: 10px;
                min-width: 70px;
                text-transform: uppercase;
                letter-spacing: 0.3px;
            }
            .result-cell { font-size: 16px !important; padding: 12px 14px !important; }
            .result-win  { border-left: 4px solid #28a745; }
            .result-lose { border-left: 4px solid #fd7e14; }
            .action-btns { flex-wrap: wrap; justify-content: flex-end; }
            .modal-content { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🏀 南ヶ丘MBC試合結果記録アプリ(2026年度)</h1>
    <p class="subtitle">南ヶ丘MBCの試合データを記録/閲覧</p>
    <div class="year-link">
        <a href="https://upstartman.github.io/minamigaoka/minamigaoka_gamerecord.html" target="_blank">📅 2025年度データ</a>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('form')">📝 データ入力</button>
        <button class="tab" onclick="switchTab('preview')">📊 データ閲覧</button>
    </div>

    <!-- データ入力タブ -->
    <div id="formTab" class="tab-content active">
        <form id="matchForm">
            <div class="form-group">
                <label for="date">日付・試合終了時間 <span class="required">*</span></label>
                <div class="datetime-group">
                    <input type="date" id="date" name="date" required />
                    <input type="time" id="endTime" name="endTime" required />
                </div>
            </div>
            <div class="form-group">
                <label for="tournament">大会名 <span class="required">*</span></label>
                <input type="text" id="tournament" name="tournament" placeholder="例：練習試合" required />
            </div>
            <div class="form-group">
                <label for="venue">会場 <span class="required">*</span></label>
                <input type="text" id="venue" name="venue" placeholder="例：南小学校" required />
            </div>
            <div class="form-group">
                <label for="opponent">対戦チーム名 <span class="required">*</span></label>
                <input type="text" id="opponent" name="opponent" placeholder="例：西が岡" required />
            </div>
            <div class="form-group">
                <label>スコア <span class="required">*</span></label>
                <div class="score-group">
                    <input type="number" id="scoreMinamiGaoka" name="scoreMinamiGaoka" placeholder="南ヶ丘" min="0" required />
                    <input type="number" id="scoreOpponent" name="scoreOpponent" placeholder="対戦チーム" min="0" required />
                </div>
            </div>
            <div class="form-group">
                <label for="scoresheetImage">📷 スコアシート画像 <span style="color:#999;font-weight:normal;">(任意)</span></label>
                <input type="file" id="scoresheetImage" accept="image/*" style="padding:10px;border:2px dashed #667eea;border-radius:8px;width:100%;" />
                <p style="margin-top:8px;font-size:12px;color:#666;">JPG, PNG, JPEG形式（最大10MB）</p>
                <div id="imagePreviewBox" style="display:none;margin-top:10px;">
                    <p style="font-size:13px;color:#667eea;margin-bottom:5px;">プレビュー:</p>
                    <div style="max-width:100%;max-height:200px;overflow:auto;border:1px solid #ddd;border-radius:8px;padding:10px;background:#f8f9fa;">
                        <img id="imagePreviewMain" style="max-width:100%;height:auto;" />
                    </div>
                    <button type="button" onclick="clearImageSelection()" style="margin-top:8px;padding:6px 12px;background:#e74c3c;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;">画像をクリア</button>
                </div>
            </div>
            <button type="submit" class="btn" id="submitBtn">データを追加</button>
        </form>
        <div id="statusMessage" class="status-message"></div>
    </div>

    <!-- データ閲覧タブ -->
    <div id="previewTab" class="tab-content">
        <div class="preview-header">
            <button class="reload-btn" onclick="loadPreviewData()">🔄 更新</button>
        </div>
        <div id="previewContent">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>データを読み込んでいます...</p>
            </div>
        </div>
        <div class="data-count" id="dataCount"></div>
    </div>

    <div class="footer-info">
        <h4>📡 接続情報</h4>
        <div id="firebaseStatus" class="url-display"></div>
    </div>
</div>

<!-- 編集モーダル -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>✏️ データを編集</h2>
            <button class="close-btn" onclick="closeEditModal()">&times;</button>
        </div>
        <form id="editForm">
            <input type="hidden" id="editDocId">
            <div class="form-group">
                <label>日付と試合終了時間 <span class="required">*</span></label>
                <div class="datetime-group">
                    <input type="date" id="editDate" required />
                    <input type="time" id="editEndTime" required />
                </div>
            </div>
            <div class="form-group">
                <label>大会名 <span class="required">*</span></label>
                <input type="text" id="editTournament" required />
            </div>
            <div class="form-group">
                <label>会場 <span class="required">*</span></label>
                <input type="text" id="editVenue" required />
            </div>
            <div class="form-group">
                <label>対戦チーム名 <span class="required">*</span></label>
                <input type="text" id="editOpponent" required />
            </div>
            <div class="form-group">
                <label>スコア <span class="required">*</span></label>
                <div class="score-group">
                    <input type="number" id="editScoreMinamiGaoka" placeholder="南ヶ丘" min="0" required />
                    <input type="number" id="editScoreOpponent" placeholder="対戦チーム" min="0" required />
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn secondary" onclick="closeEditModal()">キャンセル</button>
                <button type="submit" class="modal-btn primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 削除確認モーダル -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🗑️ データを削除</h2>
            <button class="close-btn" onclick="closeDeleteModal()">&times;</button>
        </div>
        <p style="margin:20px 0;color:#666;">このデータを削除してもよろしいですか？</p>
        <div id="deletePreview" style="background:#f8f9fa;padding:15px;border-radius:8px;margin:15px 0;"></div>
        <input type="hidden" id="deleteDocId">
        <input type="hidden" id="deleteImageUrl">
        <div class="modal-actions">
            <button type="button" class="modal-btn secondary" onclick="closeDeleteModal()">キャンセル</button>
            <button type="button" class="modal-btn danger" onclick="confirmDelete()">削除</button>
        </div>
    </div>
</div>

<!-- 画像アップロードモーダル -->
<div id="imageUploadModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📷 スコアシート画像を追加</h2>
            <button class="close-btn" onclick="closeImageUploadModal()">&times;</button>
        </div>
        <div id="imageUploadInfo" style="background:#f8f9fa;padding:15px;border-radius:8px;margin:15px 0;"></div>
        <input type="hidden" id="imageUploadDocId">
        <div class="form-group">
            <label for="imageFileInput">画像を選択 <span class="required">*</span></label>
            <input type="file" id="imageFileInput" accept="image/*" style="padding:10px;border:2px dashed #667eea;border-radius:8px;width:100%;" />
            <p style="margin-top:8px;font-size:12px;color:#666;">JPG, PNG, JPEG形式（最大10MB）</p>
        </div>
        <div id="imagePreviewContainer" style="display:none;margin:15px 0;">
            <label>プレビュー:</label>
            <div style="max-width:100%;max-height:400px;overflow:auto;border:1px solid #ddd;border-radius:8px;padding:10px;background:#f8f9fa;">
                <img id="imagePreview" style="max-width:100%;height:auto;" />
            </div>
        </div>
        <div class="modal-actions">
            <button type="button" class="modal-btn secondary" onclick="closeImageUploadModal()">キャンセル</button>
            <button type="button" class="modal-btn primary" onclick="uploadImageFromModal()">アップロード</button>
        </div>
    </div>
</div>

<!-- 画像表示モーダル -->
<div id="imageViewModal" class="modal">
    <div class="modal-content" style="max-width:900px;">
        <div class="modal-header">
            <h2>📷 スコアシート画像</h2>
            <button class="close-btn" onclick="closeImageViewModal()">&times;</button>
        </div>
        <div id="imageViewInfo" style="background:#f8f9fa;padding:15px;border-radius:8px;margin:15px 0;"></div>
        <input type="hidden" id="imageViewRowData">
        <div style="max-width:100%;max-height:600px;overflow:auto;border:1px solid #ddd;border-radius:8px;padding:10px;background:#f8f9fa;margin:15px 0;">
            <img id="imageViewDisplay" style="max-width:100%;height:auto;" />
        </div>
        <div class="modal-actions">
            <button type="button" class="modal-btn secondary" onclick="closeImageViewModal()">閉じる</button>
            <a id="imageDownloadLink" class="modal-btn primary" download style="text-decoration:none;display:inline-block;text-align:center;">ダウンロード</a>
            <button type="button" class="modal-btn upload-image-btn" onclick="replaceImage()">📷 画像を変更</button>
        </div>
    </div>
</div>

  Firebase SDK (v10 モジュラー型)

<script type="module">
import { initializeApp }                       from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc,
         getDocs, updateDoc, deleteDoc, doc,
         serverTimestamp }                      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ============================================================
//  ★ Firebase設定をここに貼り付けてください
//    Firebase Console → プロジェクト設定 → マイアプリ → firebaseConfig
// ============================================================
const firebaseConfig = {

// ============================================================
//  純粋関数（テスト対象）
// ============================================================

export function calculateResult(scoreA, scoreB) {
    const a = parseInt(scoreA), b = parseInt(scoreB);
    if (isNaN(a) || isNaN(b)) return '';
    if (a > b) return '勝';
    if (a < b) return '負';
    return '引き分け';
}

export function calculateStats(matches) {
    const total  = matches.length;
    const wins   = matches.filter(m => m.result === '勝').length;
    const losses = matches.filter(m => m.result === '負').length;
    const draws  = matches.filter(m => m.result === '引き分け').length;
    const winRate = total > 0 ? (wins / total * 100).toFixed(2) + '%' : '0.00%';
    return { total, wins, losses, draws, winRate };
}

export function formatPercentage(value) {
    if (value === '' || value === null || value === undefined) return '';
    try {
        const n = parseFloat(value);
        if (isNaN(n)) return String(value);
        return (n > 1 ? n : n * 100).toFixed(2) + '%';
    } catch { return String(value); }
}

export function formatDateForDisplay(dateStr) {
    if (!dateStr) return '';
    try {
        if (/^\d{4}\/\d{2}\/\d{2}$/.test(dateStr)) return dateStr;
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr))   return dateStr.replace(/-/g, '/');
        if (dateStr.includes('T')) {
            const d = new Date(dateStr);
            if (!isNaN(d.getTime()))
                return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
        }
        return dateStr;
    } catch { return dateStr; }
}

export function formatTimeForDisplay(timeStr) {
    if (!timeStr) return '';
    try {
        if (/^\d{1,2}:\d{2}$/.test(timeStr)) return timeStr;
        if (typeof timeStr === 'string' && timeStr.includes('T')) {
            const d = new Date(timeStr);
            if (!isNaN(d.getTime()))
                return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        return timeStr;
    } catch { return timeStr; }
}

export function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = String(text ?? '');
    return div.innerHTML;
}

// ============================================================
//  Firebase CRUD
// ============================================================

async function loadMatches() {
    const snapshot = await getDocs(collection(db, COLLECTION_NAME));
    return snapshot.docs.map(d => {
        const data = d.data();
        return {
            id:               d.id,
            date:             data.date             || '',
            endTime:          data.endTime          || '',
            tournament:       data.tournament       || '',
            venue:            data.venue            || '',
            opponent:         data.opponent         || '',
            scoreMinamiGaoka: data.scoreMinamiGaoka ?? '',
            scoreOpponent:    data.scoreOpponent    ?? '',
            result:           data.result           || '',
            imageUrl:         data.imageUrl         || ''
        };
    });
}

async function addMatch(data) {
    return await addDoc(collection(db, COLLECTION_NAME), {
        ...data,
        result:    calculateResult(data.scoreMinamiGaoka, data.scoreOpponent),
        imageUrl:  '',
        createdAt: serverTimestamp()
    });
}

async function editMatch(docId, data) {
    await updateDoc(doc(db, COLLECTION_NAME, docId), {
        ...data,
        result: calculateResult(data.scoreMinamiGaoka, data.scoreOpponent)
    });
}

async function deleteMatch(docId, imageUrl) {
    // 画像がある場合はGASに削除を依頼（fire-and-forget）
    if (imageUrl && IS_GAS_CONFIGURED) {
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode:   'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body:   JSON.stringify({ action: 'delete_image', imageUrl })
        }).catch(() => {});
    }
    await deleteDoc(doc(db, COLLECTION_NAME, docId));
}

async function uploadImageViaGAS(file, docId, dateStr, opponent, existingImageUrl = '') {
    if (!IS_GAS_CONFIGURED) throw new Error('GAS URLが設定されていません（SCRIPT_URLを設定してください）');

    const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });

    fetch(SCRIPT_URL, {
        method: 'POST',
        mode:   'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body:   JSON.stringify({
            action:             'upload_image',
            firestoreProjectId: firebaseConfig.projectId,
            firestoreApiKey:    firebaseConfig.apiKey,
            firestoreDocId:     docId,
            imageData:          base64,
            fileName:           file.name,
            mimeType:           file.type,
            dateStr:            dateStr,
            opponent:           opponent,
            existingImageUrl:   existingImageUrl
        })
    });
    // GASが非同期でFirestoreのimageUrlを更新する（5〜15秒後に反映）
}

async function loadPreviewData() {
    if (!IS_CONFIGURED) { showPreviewError('Firebase設定が未完了です'); return; }

    const previewContent = document.getElementById('previewContent');
    const dataCount      = document.getElementById('dataCount');
    previewContent.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><p>データを読み込んでいます...</p></div>`;
    dataCount.textContent = '';

    try {
        const matches = await loadMatches();
        if (matches.length > 0) {
            matches.sort((a, b) => {
                const da  = (a.date || '').replace(/\//g, '-') + ' ' + (a.endTime || '00:00');
                const db2 = (b.date || '').replace(/\//g, '-') + ' ' + (b.endTime || '00:00');
                return db2.localeCompare(da);
            });
            displayPreviewData(matches, calculateStats(matches));
            dataCount.textContent = `${matches.length}件のデータ`;
        } else {
            showPreviewEmpty();
        }
    } catch (err) {
        console.error('loadPreviewData error:', err);
        showPreviewError('データの読み込み中にエラーが発生しました');
    }
}

function displayPreviewData(data, stats) {

            <div class="stats-grid">
                <div class="stat-item"><div class="stat-label">総試合数</div><div class="stat-value">${stats.total}</div></div>
                <div class="stat-item"><div class="stat-label">勝率</div><div class="stat-value">${stats.winRate}</div></div>
                <div class="stat-item"><div class="stat-label">勝ち</div><div class="stat-value">${stats.wins}</div></div>
                <div class="stat-item"><div class="stat-label">負け</div><div class="stat-value">${stats.losses}</div></div>
                <div class="stat-item"><div class="stat-label">引き分け</div><div class="stat-value">${stats.draws}</div></div>
            </div>
        </div>
        <div class="preview-container">
            <table class="data-table">
                <thead><tr>
                    <th>日付</th><th>終了時間</th><th>大会名</th><th>会場</th>
                    <th>対戦チーム</th><th>南ヶ丘</th><th>対戦相手</th><th>勝敗</th>
                    <th>画像</th><th>操作</th>
                </tr></thead>
                <tbody>`;

    data.forEach(row => {
        const result      = String(row.result || '').trim();
        let resultClass   = 'result-cell';
        if      (result === '勝')     resultClass += ' result-win';
        else if (result === '負')     resultClass += ' result-lose';
        else if (result === '引き分け') resultClass += ' result-draw';

        // onclick用にrowデータをJSON化（シングルクォートをエスケープ）
        const rowJson = JSON.stringify(row).replace(/'/g, '&#39;');

        html += `
            <tr>
                <td data-label="日付">${escapeHtml(formatDateForDisplay(row.date))}</td>
                <td data-label="終了時間">${escapeHtml(formatTimeForDisplay(row.endTime))}</td>
                <td data-label="大会名">${escapeHtml(row.tournament)}</td>
                <td data-label="会場">${escapeHtml(row.venue)}</td>
                <td data-label="対戦チーム">${escapeHtml(row.opponent)}</td>
                <td data-label="南ヶ丘">${escapeHtml(String(row.scoreMinamiGaoka))}</td>
                <td data-label="対戦相手">${escapeHtml(String(row.scoreOpponent))}</td>
                <td data-label="勝敗" class="${resultClass}">${escapeHtml(result)}</td>
                <td data-label="画像">${row.imageUrl
                    ? `<button class="image-btn view-image-btn" onclick='viewImage(${rowJson})'>📷 表示</button>`
                    : `<button class="image-btn upload-image-btn" onclick='openImageUploadModal(${rowJson})'>📷 追加</button>`
                }</td>
                <td data-label="操作">
                    <div class="action-btns">
                        <button class="edit-btn"   onclick='openEditModal(${rowJson})'>編集</button>
                        <button class="delete-btn" onclick='openDeleteModal(${rowJson})'>削除</button>
                    </div>
                </td>
            </tr>`;
    });

    html += `</tbody></table></div>`;
    document.getElementById('previewContent').innerHTML = html;
}

function switchTab(tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if (tabName === 'form') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('formTab').classList.add('active');
    } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('previewTab').classList.add('active');
        loadPreviewData();
    }
}

function clearImageSelection() {

}

// ============================================================
//  フォーム送信（データ追加）
// ============================================================
document.getElementById('matchForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!IS_CONFIGURED) { showMessage('Firebase設定が未完了です', 'error'); return; }

    const submitBtn = document.getElementById('submitBtn');
    const imageFile = document.getElementById('scoresheetImage').files[0];

    const formData = {
        date:             document.getElementById('date').value,
        endTime:          document.getElementById('endTime').value,
        tournament:       document.getElementById('tournament').value,
        venue:            document.getElementById('venue').value,
        opponent:         document.getElementById('opponent').value,
        scoreMinamiGaoka: parseInt(document.getElementById('scoreMinamiGaoka').value),
        scoreOpponent:    parseInt(document.getElementById('scoreOpponent').value)
    };

    submitBtn.disabled    = true;
    submitBtn.textContent = '送信中...';

    try {
        const docRef = await addMatch(formData);

        if (imageFile) {
            if (imageFile.size > 10 * 1024 * 1024) {
                showMessage('データを追加しました！（画像は10MB超のためスキップ）', 'error');
            } else {
                await uploadImageViaGAS(imageFile, docRef.id, formData.date, formData.opponent);
                showMessage('データを追加しました！（画像は数秒後に反映されます）', 'success');
            }
        } else {
            showMessage('データを追加しました！', 'success');
        }

        // 送信後リセット
        document.getElementById('opponent').value         = '';
        document.getElementById('scoreMinamiGaoka').value = '';
        document.getElementById('scoreOpponent').value    = '';
        clearImageSelection();
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        const now = new Date();
        document.getElementById('endTime').value =
            now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

        if (document.getElementById('previewTab').classList.contains('active')) loadPreviewData();

    } catch (err) {
        console.error('addMatch error:', err);
        showMessage('エラーが発生しました: ' + err.message, 'error');
    } finally {
        submitBtn.disabled    = false;
        submitBtn.textContent = 'データを追加';
    }
});

        await uploadImageViaGAS(file, docId, row.date, row.opponent, row.imageUrl || '');
        showMessage('アップロードリクエストを送信しました（数秒後に反映されます）', 'success');
