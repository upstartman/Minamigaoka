<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カタログ燃費検索（国土交通省データ）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0efe8;
    --card: #ffffff;
    --accent: #1a5632;
    --accent2: #2a7a4a;
    --accent-light: #e4efe8;
    --text: #2c2c2c;
    --text-sub: #777;
    --border: #ddd9cf;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
    --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans JP','DM Sans',sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 1.5rem 1rem 3rem;
  }
  .container { max-width: 700px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 1.8rem; }
  header h1 {
    font-family: 'DM Sans',sans-serif;
    font-size: 1.5rem; font-weight: 700; color: var(--accent);
    margin-bottom: 0.2rem;
  }
  header h1 span {
    font-family: 'Noto Sans JP',sans-serif;
    font-size: 1rem; font-weight: 500; color: var(--text); margin-left: 0.3rem;
  }
  header p { font-size: 0.78rem; color: var(--text-sub); font-weight: 300; }

  /* Search */
  .search-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 1.2rem 1.4rem; margin-bottom: 1rem;
  }
  .search-card label {
    display: block; font-size: 0.76rem; font-weight: 500;
    color: var(--text-sub); margin-bottom: 0.4rem;
  }
  .search-row { display: flex; gap: 0.5rem; }
  .search-row input {
    flex: 1; padding: 0.65rem 1rem; font-size: 1rem;
    font-family: 'Noto Sans JP',sans-serif;
    border: 1.5px solid var(--border); border-radius: 8px;
    outline: none; background: var(--bg); transition: border-color 0.2s;
  }
  .search-row input:focus { border-color: var(--accent); }
  .btn {
    padding: 0.6rem 1.3rem; font-size: 0.9rem;
    font-family: 'Noto Sans JP',sans-serif; font-weight: 600;
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; cursor: pointer; white-space: nowrap;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }

  .filter-row {
    display: flex; flex-wrap: wrap; gap: 0.4rem;
    margin-top: 0.6rem; align-items: center;
  }
  .filter-label { font-size: 0.72rem; color: var(--text-sub); margin-right: 0.2rem; }
  .filter-btn {
    font-size: 0.72rem; padding: 0.15rem 0.5rem;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--card); color: var(--text-sub);
    cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans JP',sans-serif;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }

  .quick-tags {
    margin-top: 0.6rem; font-size: 0.73rem; color: var(--text-sub);
  }
  .quick-tags span {
    display: inline-block; background: var(--accent-light); color: var(--accent);
    padding: 0.12rem 0.45rem; border-radius: 4px;
    margin: 0.1rem 0.15rem; cursor: pointer; font-weight: 500;
    transition: background 0.15s;
  }
  .quick-tags span:hover { background: #d0e2d6; }

  .data-info {
    font-size: 0.72rem; color: var(--text-sub);
    margin-top: 0.5rem; text-align: right;
  }

  /* Results */
  #results { margin-top: 0.8rem; }
  .result-count {
    font-size: 0.8rem; color: var(--text-sub); margin-bottom: 0.6rem;
  }

  .rc {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; margin-bottom: 0.7rem;
  }
  .rc-head {
    background: var(--accent); color: #fff;
    padding: 0.65rem 1.1rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .rc-name { font-size: 1.05rem; font-weight: 700; }
  .rc-sub { font-size: 0.72rem; opacity: 0.85; }
  .rc-badge {
    font-size: 0.65rem; background: rgba(255,255,255,0.2);
    padding: 0.1rem 0.4rem; border-radius: 4px;
  }
  .rc-body { padding: 0.8rem 1.1rem; }

  .fuel-main {
    display: flex; align-items: baseline; gap: 0.5rem;
    margin-bottom: 0.5rem;
  }
  .fuel-main .big {
    font-family: 'DM Sans',sans-serif;
    font-size: 2rem; font-weight: 700; color: var(--accent);
    line-height: 1;
  }
  .fuel-main .unit { font-size: 0.8rem; color: var(--text-sub); }
  .fuel-main .mode-label {
    font-size: 0.68rem; color: var(--text-sub);
    background: var(--accent-light); padding: 0.1rem 0.4rem;
    border-radius: 3px; font-weight: 500;
  }

  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 0 1.5rem;
  }
  .info-item {
    display: flex; justify-content: space-between;
    padding: 0.25rem 0; font-size: 0.82rem;
    border-bottom: 1px dashed var(--border);
  }
  .info-item .ik { color: var(--text-sub); font-weight: 300; }
  .info-item .iv { font-weight: 500; text-align: right; }

  details { margin-top: 0.5rem; }
  details summary {
    font-size: 0.73rem; color: var(--text-sub); cursor: pointer;
    padding: 0.2rem 0;
  }
  details summary:hover { color: var(--accent); }
  .vtable {
    width: 100%; font-size: 0.7rem; border-collapse: collapse;
    margin-top: 0.3rem;
  }
  .vtable th {
    background: var(--bg); padding: 0.3rem 0.4rem;
    text-align: left; font-weight: 500; color: var(--text-sub);
    position: sticky; top: 0;
  }
  .vtable td {
    padding: 0.25rem 0.4rem; border-bottom: 1px solid var(--border);
  }
  .vtable .fuel-val { font-weight: 700; color: var(--accent); text-align: center; }

  .no-results {
    text-align: center; padding: 2.5rem 1rem;
    color: var(--text-sub); font-size: 0.9rem;
  }

  footer {
    text-align: center; margin-top: 2rem;
    font-size: 0.68rem; color: var(--text-sub); line-height: 1.7;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 500px) {
    .info-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>&#9981; Fuel Search <span>カタログ燃費検索</span></h1>
    <p>国土交通省 自動車燃費一覧（令和7年3月）データ内蔵 ・ 完全無料 ・ オフラインOK</p>
  </header>

  <div class="search-card">
    <label>車種名・メーカー名で検索</label>
    <div class="search-row">
      <input type="text" id="q" placeholder="例: フィット、ヤリス、N-BOX" autocomplete="off">
      <button class="btn" onclick="doSearch()">検索</button>
    </div>
    <div class="filter-row">
      <span class="filter-label">メーカー:</span>
      <button class="filter-btn active" data-maker="all" onclick="toggleMaker(this)">すべて</button>
    </div>
    <div class="quick-tags">
      例:
      <span onclick="qS('フィット')">フィット</span>
      <span onclick="qS('ヤリス')">ヤリス</span>
      <span onclick="qS('ノート')">ノート</span>
      <span onclick="qS('N-BOX')">N-BOX</span>
      <span onclick="qS('CX-5')">CX-5</span>
      <span onclick="qS('アルト')">アルト</span>
      <span onclick="qS('タント')">タント</span>
      <span onclick="qS('プリウス')">プリウス</span>
    </div>
    <div class="data-info" id="dataInfo"></div>
  </div>

  <div id="results"></div>

  <footer>
    出典: 国土交通省「<a href="https://www.mlit.go.jp/jidosha/jidosha_tk10_000048.html" target="_blank">自動車燃費一覧（令和7年3月）</a>」<br>
    ガソリン乗用車（普通・小型 + 軽自動車）WLTCモードデータを内蔵<br>
    データはすべてブラウザ内で処理されます。
  </footer>
</div>

// ====== Init ======
let activeMaker = 'all';
const qInput = document.getElementById('q');

window.addEventListener('DOMContentLoaded', () => {
  // Build maker filter buttons
  const makers = [...new Set(DATA.map(d => d.m))].sort();
  const filterRow = document.querySelector('.filter-row');
  makers.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.maker = m;
    btn.textContent = m;
    btn.onclick = function() { toggleMaker(this); };
    filterRow.appendChild(btn);
  });

  const totalVariants = DATA.reduce((s, d) => s + d.cnt, 0);
  document.getElementById('dataInfo').textContent =
    DATA.length + '車種 / ' + totalVariants + 'グレード収録';

  qInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  qInput.addEventListener('input', () => { if (qInput.value.length >= 2) doSearch(); });

  // Show all on load
  renderResults(DATA.slice(0, 20), '', true);
});

function toggleMaker(el) {
  const maker = el.dataset.maker;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  activeMaker = maker;
  doSearch();
}

function qS(term) { qInput.value = term; doSearch(); }

function doSearch() {
  const query = qInput.value.trim().toLowerCase();
  const normalize = s => s.toLowerCase()
    .replace(/[\s\u3000]+/g, '')
    .replace(/[\-\uff0d]/g, '-');

  let results = DATA;

  // Maker filter
  if (activeMaker !== 'all') {
    results = results.filter(d => d.m === activeMaker);
  }

  // Text search
  if (query) {
    const nq = normalize(query);
    const terms = query.split(/\s+/);
    results = results.filter(d => {
      const text = normalize(d.m + d.n + (d.e ? d.e.join('') : ''));
      return terms.every(t => text.includes(normalize(t)));
    });
  }

  renderResults(results, query, !query);
}

function renderResults(results, query, isDefault) {
  const container = document.getElementById('results');

  if (results.length === 0) {
    container.innerHTML = '<div class="no-results">一致する車種が見つかりません。<br><span style="font-size:0.8rem;">検索語を短くするか、メーカー名で絞り込んでください。</span></div>';
    return;
  }

  let html = '';
  if (query) {
    html += '<div class="result-count">' + esc(query) + ' : ' + results.length + '車種</div>';
  } else if (isDefault) {
    html += '<div class="result-count">全 ' + results.length + ' 車種（検索語を入力して絞り込み）</div>';
  }

  const show = results.slice(0, 50);
  show.forEach(d => {
    const fuelDisplay = d.fmin === d.fmax
      ? d.fmin.toFixed(1)
      : d.fmin.toFixed(1) + ' ～ ' + d.fmax.toFixed(1);

    html += '<div class="rc">'
      + '<div class="rc-head">'
      + '<div><div class="rc-name">' + esc(d.n) + '</div>'
      + '<div class="rc-sub">' + esc(d.m) + ' ・ ' + esc(d.cat) + '</div></div>'
      + '<div class="rc-badge">' + d.cnt + 'グレード</div>'
      + '</div>'
      + '<div class="rc-body">'
      + '<div class="fuel-main">'
      + '<span class="mode-label">WLTC</span>'
      + '<span class="big">' + fuelDisplay + '</span>'
      + '<span class="unit">km/L</span>'
      + '</div>'
      + '<div class="info-grid">'
      + infoItem('排気量', d.d.join(' / ') || '—')
      + infoItem('エンジン', (d.e || []).join(' / ') || '—')
      + infoItem('変速機', d.t.join(' / ') || '—')
      + infoItem('グレード数', d.cnt + '種')
      + '</div>';

    // Variant details
    if (d.v && d.v.length > 1) {
      html += '<details><summary>全グレード詳細を表示</summary>'
        + '<div style="max-height:260px;overflow-y:auto;">'
        + '<table class="vtable"><tr><th>型式</th><th>排気量</th><th>変速</th><th>重量</th><th>WLTC</th></tr>';
      d.v.forEach(v => {
        html += '<tr>'
          + '<td>' + esc(v[0]) + '</td>'
          + '<td style="text-align:center;">' + esc(v[1] || '—') + '</td>'
          + '<td style="text-align:center;">' + esc(v[2] || '—') + '</td>'
          + '<td style="text-align:center;">' + (v[3] ? esc(v[3]) + 'kg' : '—') + '</td>'
          + '<td class="fuel-val">' + v[4].toFixed(1) + '</td>'
          + '</tr>';
      });
      html += '</table></div></details>';
    }

    html += '</div></div>';
  });

  if (results.length > 50) {
    html += '<div class="no-results">他 ' + (results.length - 50) + ' 車種は省略。検索語で絞り込んでください。</div>';
  }

  container.innerHTML = html;
}

function infoItem(key, val) {
  return '<div class="info-item"><span class="ik">' + esc(key) + '</span><span class="iv">' + esc(val) + '</span></div>';
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
