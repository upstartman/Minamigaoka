<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ミニバス スコアシート</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif; }
    input, button, select { font-size: 16px; }
    .foul-box { 
      width: 22px; height: 22px; border: 1px solid #ccc; 
      display: inline-flex; align-items: center; justify-content: center; 
      font-size: 9px; font-weight: bold; border-radius: 2px;
    }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    .print-only { display: none; }
    .scoresheet-table { border-collapse: collapse; font-size: 8px; }
    .scoresheet-table th, .scoresheet-table td { border: 1px solid #333; padding: 2px 4px; }
    .running-score-cell { width: 18px; height: 14px; text-align: center; font-size: 7px; position: relative; }
    .running-score-cell.scored::after {
      content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px;
      border-bottom: 1px solid #000; transform: rotate(-45deg);
    }
    .q-circle { width: 12px; height: 12px; border: 1px solid #333; border-radius: 50%; 
      display: inline-flex; align-items: center; justify-content: center; font-size: 7px; margin: 0 1px; }
    .q-circle.starter { background: #22c55e; color: white; }
    .q-circle.sub { background: #f97316; color: white; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    const STORAGE_KEYS = {
      MY_TEAM: 'minibasket_my_team',
      GAMES: 'minibasket_games',
      CURRENT_GAME: 'minibasket_current_game'
    };

    const createEmptyPlayer = (id) => ({
      id, number: '', licenseNo: '', name: '',
      quarters: [
        { played: false, isStarter: false },
        { played: false, isStarter: false },
        { played: false, isStarter: false },
        { played: false, isStarter: false }
      ],
      fouls: ['', '', '', '', ''],
      quarterPoints: [0, 0, 0, 0]
    });

    const createEmptyTeam = (name = '') => ({
      name, coach: '', assistantCoach: '',
      players: Array.from({ length: 15 }, (_, i) => createEmptyPlayer(i + 1)),
      timeouts: [0, 0, 0, 0, 0], teamFouls: [0, 0, 0, 0]
    });

    const createEmptyGame = () => ({
      id: Date.now(), tournamentName: '', date: new Date().toISOString().split('T')[0],
      time: '', gameNo: '', venue: '',
      teamA: createEmptyTeam(), teamB: createEmptyTeam(),
      onCourt: { A: [], B: [] },
      startersSet: { A: [false, false, false, false], B: [false, false, false, false] },
      runningScore: [], currentQuarter: 1, winner: '', endTime: ''
    });

    const getPlayerTotalPoints = (player) => (player.quarterPoints || [0,0,0,0]).reduce((sum, p) => sum + (p || 0), 0);
    const getPlayerFoulCount = (player) => (player.fouls || []).filter(f => f !== '').length;

    const recalculateFromHistory = (game) => {
      const newGame = JSON.parse(JSON.stringify(game));
      newGame.teamA.players.forEach(p => {
        p.quarterPoints = [0, 0, 0, 0]; p.fouls = ['', '', '', '', ''];
        p.quarters = [{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false }];
      });
      newGame.teamB.players.forEach(p => {
        p.quarterPoints = [0, 0, 0, 0]; p.fouls = ['', '', '', '', ''];
        p.quarters = [{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false }];
      });
      newGame.teamA.teamFouls = [0, 0, 0, 0]; newGame.teamB.teamFouls = [0, 0, 0, 0];
      newGame.startersSet = { A: [false, false, false, false], B: [false, false, false, false] };
      newGame.onCourt = { A: [], B: [] };
      
      newGame.runningScore.forEach(action => {
        const team = action.scoringTeam === 'A' ? newGame.teamA : newGame.teamB;
        if (action.type === 'score') {
          const player = team.players[action.scoringPlayerIndex];
          if (!player.quarterPoints) player.quarterPoints = [0, 0, 0, 0];
          player.quarterPoints[action.quarter - 1] += action.points;
        } else if (action.type === 'foul') {
          const player = team.players[action.scoringPlayerIndex];
          if (!player.fouls) player.fouls = ['', '', '', '', ''];
          const foulCount = player.fouls.filter(f => f !== '').length;
          if (foulCount < 5) player.fouls[foulCount] = action.foulType;
          if (!team.teamFouls) team.teamFouls = [0, 0, 0, 0];
          team.teamFouls[action.quarter - 1] = (team.teamFouls[action.quarter - 1] || 0) + 1;
        } else if (action.type === 'starter') {
          action.playerIndexes.forEach(idx => {
            if (!team.players[idx].quarters) team.players[idx].quarters = [{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false }];
            team.players[idx].quarters[action.quarter - 1] = { played: true, isStarter: true };
          });
          newGame.startersSet[action.scoringTeam][action.quarter - 1] = true;
          newGame.onCourt[action.scoringTeam] = [...action.playerIndexes];
        } else if (action.type === 'substitution') {
          const playerIn = team.players[action.playerIn];
          if (!playerIn.quarters) playerIn.quarters = [{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false }];
          playerIn.quarters[action.quarter - 1] = { played: true, isStarter: false };
          const onCourt = newGame.onCourt[action.scoringTeam] || [];
          newGame.onCourt[action.scoringTeam] = onCourt.filter(i => i !== action.playerOut);
          newGame.onCourt[action.scoringTeam].push(action.playerIn);
        }
      });
      return newGame;
    };

    function App() {
      const [view, setView] = useState('home');
      const [myTeam, setMyTeam] = useState(null);
      const [currentGame, setCurrentGame] = useState(null);
      const [games, setGames] = useState([]);

      useEffect(() => {
        try {
          const savedTeam = localStorage.getItem(STORAGE_KEYS.MY_TEAM);
          const savedGames = localStorage.getItem(STORAGE_KEYS.GAMES);
          const savedCurrentGame = localStorage.getItem(STORAGE_KEYS.CURRENT_GAME);
          if (savedTeam) setMyTeam(JSON.parse(savedTeam));
          if (savedGames) setGames(JSON.parse(savedGames));
          if (savedCurrentGame) setCurrentGame(JSON.parse(savedCurrentGame));
        } catch (e) { console.error('Load error:', e); }
      }, []);

      const saveMyTeam = (team) => { setMyTeam(team); localStorage.setItem(STORAGE_KEYS.MY_TEAM, JSON.stringify(team)); };
      const saveGame = (game) => { setCurrentGame(game); localStorage.setItem(STORAGE_KEYS.CURRENT_GAME, JSON.stringify(game)); };
      const finishGame = (game) => {
        const updatedGames = [...games, game];
        setGames(updatedGames);
        localStorage.setItem(STORAGE_KEYS.GAMES, JSON.stringify(updatedGames));
        localStorage.removeItem(STORAGE_KEYS.CURRENT_GAME);
        setCurrentGame(null);
      };
      const deleteGame = (gameId) => {
        const updatedGames = games.filter(g => g.id !== gameId);
        setGames(updatedGames);
        localStorage.setItem(STORAGE_KEYS.GAMES, JSON.stringify(updatedGames));
      };

      return (
        <div className="min-h-screen bg-gray-100">
          {view === 'home' && <HomeView myTeam={myTeam} currentGame={currentGame} onTeamSetup={() => setView('team-setup')} onNewGame={() => setView('game-setup')} onContinueGame={() => setView('scoring')} onGamesList={() => setView('games-list')} />}
          {view === 'team-setup' && <TeamSetupView team={myTeam} onSave={(team) => { saveMyTeam(team); setView('home'); }} onBack={() => setView('home')} />}
          {view === 'game-setup' && <GameSetupView myTeam={myTeam} onStart={(game) => { saveGame(game); setView('scoring'); }} onBack={() => setView('home')} />}
          {view === 'scoring' && currentGame && <ScoringView game={currentGame} onUpdate={saveGame} onFinish={(game) => { finishGame(game); setView('home'); }} onBack={() => setView('home')} onEditHistory={() => setView('history')} onPrintScoresheet={() => setView('print')} />}
          {view === 'history' && currentGame && <HistoryEditView game={currentGame} onUpdate={saveGame} onBack={() => setView('scoring')} />}
          {view === 'print' && currentGame && <PrintScoresheetView game={currentGame} onBack={() => setView('scoring')} />}
          {view === 'games-list' && <GamesListView games={games} onBack={() => setView('home')} onSelectGame={(game) => { setCurrentGame(game); setView('scoring'); }} onDeleteGame={deleteGame} />}
        </div>
      );
    }

    function HomeView({ myTeam, currentGame, onTeamSetup, onNewGame, onContinueGame, onGamesList }) {
      return (
        <div className="p-4 max-w-lg mx-auto">
          <h1 className="text-2xl font-bold text-center mb-6 text-blue-800">🏀 ミニバス スコアシート</h1>
          <div className="space-y-4">
            <button onClick={onTeamSetup} className="w-full p-4 bg-blue-600 text-white rounded-lg text-lg font-semibold active:bg-blue-700">{myTeam ? '⚙️ 自チーム編集' : '➕ 自チーム登録'}</button>
            {myTeam && <div className="p-3 bg-blue-50 rounded-lg text-sm"><span className="font-semibold">登録チーム:</span> {myTeam.name}<span className="ml-2 text-gray-600">({myTeam.players.filter(p => p.name).length}名)</span></div>}
            {currentGame && <button onClick={onContinueGame} className="w-full p-4 bg-orange-500 text-white rounded-lg text-lg font-semibold active:bg-orange-600">▶️ 試合を再開<div className="text-sm mt-1">{currentGame.teamA.name} vs {currentGame.teamB.name}</div></button>}
            <button onClick={onNewGame} disabled={!myTeam} className={`w-full p-4 rounded-lg text-lg font-semibold ${myTeam ? 'bg-green-600 text-white active:bg-green-700' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>🆕 新しい試合を開始</button>
            <button onClick={onGamesList} className="w-full p-4 bg-gray-600 text-white rounded-lg text-lg font-semibold active:bg-gray-700">📋 試合履歴</button>
          </div>
          <p className="text-xs text-gray-400 text-center mt-8">データはこのブラウザに保存されます</p>
        </div>
      );
    }

    function TeamSetupView({ team, onSave, onBack }) {
      const [formData, setFormData] = useState(team || createEmptyTeam());
      const updatePlayer = (index, field, value) => {
        const newPlayers = [...formData.players];
        newPlayers[index] = { ...newPlayers[index], [field]: value };
        setFormData({ ...formData, players: newPlayers });
      };
      return (
        <div className="p-4 max-w-2xl mx-auto pb-20">
          <div className="flex items-center mb-4"><button onClick={onBack} className="text-blue-600 mr-4 text-lg">← 戻る</button><h2 className="text-xl font-bold">自チーム登録</h2></div>
          <div className="bg-white rounded-lg p-4 mb-4 shadow">
            <div className="grid grid-cols-1 gap-3">
              <div><label className="block text-sm font-medium mb-1">チーム名 *</label><input type="text" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} className="w-full border rounded p-2" placeholder="南ヶ丘MBC" /></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-sm font-medium mb-1">コーチ</label><input type="text" value={formData.coach} onChange={(e) => setFormData({ ...formData, coach: e.target.value })} className="w-full border rounded p-2" /></div>
                <div><label className="block text-sm font-medium mb-1">A.コーチ</label><input type="text" value={formData.assistantCoach} onChange={(e) => setFormData({ ...formData, assistantCoach: e.target.value })} className="w-full border rounded p-2" /></div>
              </div>
            </div>
          </div>
          <div className="bg-white rounded-lg p-4 shadow">
            <h3 className="font-semibold mb-3">選手登録</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-sm"><thead><tr className="bg-gray-100"><th className="p-2 w-16">背番号</th><th className="p-2 w-20">ライセンス</th><th className="p-2">氏名</th></tr></thead>
                <tbody>{formData.players.map((player, i) => (<tr key={i} className="border-b"><td className="p-1"><input type="text" value={player.number} onChange={(e) => updatePlayer(i, 'number', e.target.value)} className="w-full border rounded p-1 text-center" /></td><td className="p-1"><input type="text" value={player.licenseNo} onChange={(e) => updatePlayer(i, 'licenseNo', e.target.value)} className="w-full border rounded p-1 text-center" maxLength="3" /></td><td className="p-1"><input type="text" value={player.name} onChange={(e) => updatePlayer(i, 'name', e.target.value)} className="w-full border rounded p-1" /></td></tr>))}</tbody>
              </table>
            </div>
          </div>
          <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t"><button onClick={() => onSave(formData)} disabled={!formData.name} className={`w-full p-3 rounded-lg text-white font-semibold ${formData.name ? 'bg-blue-600 active:bg-blue-700' : 'bg-gray-300 cursor-not-allowed'}`}>保存</button></div>
        </div>
      );
    }

    function GameSetupView({ myTeam, onStart, onBack }) {
      const [game, setGame] = useState(() => {
        const newGame = createEmptyGame();
        newGame.teamA = { ...myTeam, timeouts: [0, 0, 0, 0, 0], teamFouls: [0, 0, 0, 0] };
        newGame.teamA.players = myTeam.players.map(p => ({ ...p, quarters: [{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false }], fouls: ['', '', '', '', ''], quarterPoints: [0, 0, 0, 0] }));
        return newGame;
      });
      const [isTeamAHome, setIsTeamAHome] = useState(true);
      const updateOpponentPlayer = (index, field, value) => {
        const newPlayers = [...game.teamB.players];
        newPlayers[index] = { ...newPlayers[index], [field]: value };
        setGame({ ...game, teamB: { ...game.teamB, players: newPlayers } });
      };
      const handleStart = () => {
        const finalGame = { ...game };
        if (!isTeamAHome) { const temp = finalGame.teamA; finalGame.teamA = finalGame.teamB; finalGame.teamB = temp; }
        onStart(finalGame);
      };
      return (
        <div className="p-4 max-w-2xl mx-auto pb-20">
          <div className="flex items-center mb-4"><button onClick={onBack} className="text-blue-600 mr-4 text-lg">← 戻る</button><h2 className="text-xl font-bold">試合設定</h2></div>
          <div className="bg-white rounded-lg p-4 mb-4 shadow">
            <h3 className="font-semibold mb-3">大会情報</h3>
            <div className="grid grid-cols-2 gap-3">
              <div className="col-span-2"><label className="block text-sm font-medium mb-1">大会名</label><input type="text" value={game.tournamentName} onChange={(e) => setGame({ ...game, tournamentName: e.target.value })} className="w-full border rounded p-2" /></div>
              <div><label className="block text-sm font-medium mb-1">日付</label><input type="date" value={game.date} onChange={(e) => setGame({ ...game, date: e.target.value })} className="w-full border rounded p-2" /></div>
              <div><label className="block text-sm font-medium mb-1">時間</label><input type="time" value={game.time} onChange={(e) => setGame({ ...game, time: e.target.value })} className="w-full border rounded p-2" /></div>
              <div><label className="block text-sm font-medium mb-1">Game No.</label><input type="text" value={game.gameNo} onChange={(e) => setGame({ ...game, gameNo: e.target.value })} className="w-full border rounded p-2" /></div>
              <div><label className="block text-sm font-medium mb-1">会場</label><input type="text" value={game.venue} onChange={(e) => setGame({ ...game, venue: e.target.value })} className="w-full border rounded p-2" /></div>
            </div>
          </div>
          <div className="bg-white rounded-lg p-4 mb-4 shadow">
            <h3 className="font-semibold mb-3">チーム配置</h3>
            <div className="flex gap-2">
              <button onClick={() => setIsTeamAHome(true)} className={`flex-1 p-3 rounded text-sm ${isTeamAHome ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}><div className="font-bold">チームA (白)</div><div>{myTeam.name}</div></button>
              <button onClick={() => setIsTeamAHome(false)} className={`flex-1 p-3 rounded text-sm ${!isTeamAHome ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}><div className="font-bold">チームB</div><div>{myTeam.name}</div></button>
            </div>
          </div>
          <div className="bg-white rounded-lg p-4 shadow">
            <h3 className="font-semibold mb-3">相手チーム情報</h3>
            <div className="grid grid-cols-1 gap-3 mb-4">
              <div><label className="block text-sm font-medium mb-1">チーム名 *</label><input type="text" value={game.teamB.name} onChange={(e) => setGame({ ...game, teamB: { ...game.teamB, name: e.target.value } })} className="w-full border rounded p-2" /></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-sm font-medium mb-1">コーチ</label><input type="text" value={game.teamB.coach} onChange={(e) => setGame({ ...game, teamB: { ...game.teamB, coach: e.target.value } })} className="w-full border rounded p-2" /></div>
                <div><label className="block text-sm font-medium mb-1">A.コーチ</label><input type="text" value={game.teamB.assistantCoach} onChange={(e) => setGame({ ...game, teamB: { ...game.teamB, assistantCoach: e.target.value } })} className="w-full border rounded p-2" /></div>
              </div>
            </div>
            <h4 className="font-medium mb-2 text-sm">選手</h4>
            <div className="overflow-x-auto max-h-48 overflow-y-auto border rounded">
              <table className="w-full text-sm"><thead className="sticky top-0 bg-gray-100"><tr><th className="p-2 w-16">背番号</th><th className="p-2 w-20">ライセンス</th><th className="p-2">氏名</th></tr></thead>
                <tbody>{game.teamB.players.slice(0, 15).map((player, i) => (<tr key={i} className="border-b"><td className="p-1"><input type="text" value={player.number} onChange={(e) => updateOpponentPlayer(i, 'number', e.target.value)} className="w-full border rounded p-1 text-center" /></td><td className="p-1"><input type="text" value={player.licenseNo} onChange={(e) => updateOpponentPlayer(i, 'licenseNo', e.target.value)} className="w-full border rounded p-1 text-center" maxLength="3" /></td><td className="p-1"><input type="text" value={player.name} onChange={(e) => updateOpponentPlayer(i, 'name', e.target.value)} className="w-full border rounded p-1" /></td></tr>))}</tbody>
              </table>
            </div>
          </div>
          <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t"><button onClick={handleStart} disabled={!game.teamB.name} className={`w-full p-3 rounded-lg text-white font-semibold text-lg ${game.teamB.name ? 'bg-green-600 active:bg-green-700' : 'bg-gray-300 cursor-not-allowed'}`}>🏀 試合開始</button></div>
        </div>
      );
    }

    function ScoringView({ game, onUpdate, onFinish, onBack, onEditHistory, onPrintScoresheet }) {
      const [selectedTeam, setSelectedTeam] = useState('A');
      const [showPlayerSelect, setShowPlayerSelect] = useState(null);
      const [showStarterSelect, setShowStarterSelect] = useState(false);
      const [showSubstitution, setShowSubstitution] = useState(false);
      const [showUndoMenu, setShowUndoMenu] = useState(false);
      const [tempStarters, setTempStarters] = useState([]);

      useEffect(() => { if (!game.onCourt) onUpdate({ ...game, onCourt: { A: [], B: [] }, startersSet: { A: [false,false,false,false], B: [false,false,false,false] } }); }, []);

      const getTeamScore = (team) => team.players.reduce((sum, p) => sum + getPlayerTotalPoints(p), 0);
      const getQuarterScore = (teamKey, quarter) => {
        const team = teamKey === 'A' ? game.teamA : game.teamB;
        return team.players.reduce((sum, p) => sum + ((p.quarterPoints || [0,0,0,0])[quarter - 1] || 0), 0);
      };
      const isStartersSet = (teamKey) => game.startersSet && game.startersSet[teamKey] && game.startersSet[teamKey][game.currentQuarter - 1];

      const setStarters = (teamKey, playerIndexes) => {
        const newGame = JSON.parse(JSON.stringify(game));
        const team = teamKey === 'A' ? newGame.teamA : newGame.teamB;
        playerIndexes.forEach(idx => {
          if (!team.players[idx].quarters) team.players[idx].quarters = [{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false }];
          team.players[idx].quarters[game.currentQuarter - 1] = { played: true, isStarter: true };
        });
        if (!newGame.startersSet) newGame.startersSet = { A: [false,false,false,false], B: [false,false,false,false] };
        newGame.startersSet[teamKey][game.currentQuarter - 1] = true;
        if (!newGame.onCourt) newGame.onCourt = { A: [], B: [] };
        newGame.onCourt[teamKey] = [...playerIndexes];
        newGame.runningScore.push({ id: Date.now(), type: 'starter', quarter: game.currentQuarter, scoringTeam: teamKey, playerIndexes: [...playerIndexes] });
        onUpdate(newGame); setShowStarterSelect(false); setTempStarters([]);
      };

      const makeSubstitution = (teamKey, playerOut, playerIn) => {
        const newGame = JSON.parse(JSON.stringify(game));
        const team = teamKey === 'A' ? newGame.teamA : newGame.teamB;
        if (!team.players[playerIn].quarters) team.players[playerIn].quarters = [{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false }];
        team.players[playerIn].quarters[game.currentQuarter - 1] = { played: true, isStarter: false };
        const onCourt = newGame.onCourt[teamKey] || [];
        newGame.onCourt[teamKey] = onCourt.filter(i => i !== playerOut);
        newGame.onCourt[teamKey].push(playerIn);
        newGame.runningScore.push({ id: Date.now(), type: 'substitution', quarter: game.currentQuarter, scoringTeam: teamKey, playerOut, playerIn });
        onUpdate(newGame); setShowSubstitution(false);
      };

      const addScore = (teamKey, playerIndex, points) => {
        const newGame = JSON.parse(JSON.stringify(game));
        const team = teamKey === 'A' ? newGame.teamA : newGame.teamB;
        if (!team.players[playerIndex].quarterPoints) team.players[playerIndex].quarterPoints = [0, 0, 0, 0];
        team.players[playerIndex].quarterPoints[game.currentQuarter - 1] += points;
        newGame.runningScore.push({ id: Date.now(), quarter: game.currentQuarter, scoringTeam: teamKey, scoringPlayerIndex: playerIndex, points, type: 'score' });
        onUpdate(newGame); setShowPlayerSelect(null);
      };

      const addFoul = (teamKey, playerIndex, foulType) => {
        const newGame = JSON.parse(JSON.stringify(game));
        const team = teamKey === 'A' ? newGame.teamA : newGame.teamB;
        if (!team.players[playerIndex].fouls) team.players[playerIndex].fouls = ['', '', '', '', ''];
        const foulCount = getPlayerFoulCount(team.players[playerIndex]);
        if (foulCount < 5) {
          team.players[playerIndex].fouls[foulCount] = foulType;
          if (!team.teamFouls) team.teamFouls = [0, 0, 0, 0];
          team.teamFouls[game.currentQuarter - 1] = Math.min((team.teamFouls[game.currentQuarter - 1] || 0) + 1, 10);
          newGame.runningScore.push({ id: Date.now(), quarter: game.currentQuarter, scoringTeam: teamKey, scoringPlayerIndex: playerIndex, foulType, type: 'foul' });
          if (getPlayerFoulCount(team.players[playerIndex]) >= 5) {
            if (!newGame.onCourt) newGame.onCourt = { A: [], B: [] };
            newGame.onCourt[teamKey] = (newGame.onCourt[teamKey] || []).filter(i => i !== playerIndex);
          }
          onUpdate(newGame);
        }
        setShowPlayerSelect(null);
      };

      const undoLast = () => {
        if (game.runningScore.length === 0) return;
        const newGame = JSON.parse(JSON.stringify(game));
        newGame.runningScore.pop();
        const recalculated = recalculateFromHistory(newGame);
        recalculated.currentQuarter = newGame.currentQuarter;
        onUpdate(recalculated); setShowUndoMenu(false);
      };

      const changeQuarter = (q) => onUpdate({ ...game, currentQuarter: q });

      const team = selectedTeam === 'A' ? game.teamA : game.teamB;
      const activePlayers = team.players.map((p, idx) => ({ ...p, originalIndex: idx })).filter(p => p.name);
      const onCourtIndexes = (game.onCourt && game.onCourt[selectedTeam]) ? game.onCourt[selectedTeam] : [];
      const onCourtPlayers = activePlayers.filter(p => onCourtIndexes.includes(p.originalIndex));
      const teamAScore = getTeamScore(game.teamA);
      const teamBScore = getTeamScore(game.teamB);
      const startersSetForTeam = isStartersSet(selectedTeam);

      return (
        <div className="min-h-screen bg-gray-100 pb-28 no-print">
          <div className="bg-blue-800 text-white p-3 sticky top-0 z-10">
            <div className="flex justify-between items-center mb-2">
              <button onClick={onBack} className="text-white text-sm">← 戻る</button>
              <span className="font-bold text-lg">Q{game.currentQuarter}</span>
              <div className="flex gap-1">
                <button onClick={onPrintScoresheet} className="bg-green-600 px-2 py-1 rounded text-xs">📄</button>
                <button onClick={onEditHistory} className="bg-purple-600 px-2 py-1 rounded text-xs">📝</button>
                <button onClick={() => setShowUndoMenu(true)} className="bg-gray-600 px-2 py-1 rounded text-xs">↩️</button>
                <button onClick={() => { if (confirm('試合を終了しますか？')) { onFinish({ ...game, endTime: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }), winner: teamAScore > teamBScore ? game.teamA.name : teamBScore > teamAScore ? game.teamB.name : '引分' }); } }} className="bg-red-600 px-2 py-1 rounded text-xs">終了</button>
              </div>
            </div>
            <div className="flex justify-center items-center gap-4">
              <div className={`text-center flex-1 p-2 rounded cursor-pointer ${selectedTeam === 'A' ? 'bg-blue-700' : ''}`} onClick={() => setSelectedTeam('A')}><div className="text-xs truncate">{game.teamA.name}</div><div className="text-3xl font-bold">{teamAScore}</div><div className="text-xs">TF: {(game.teamA.teamFouls || [])[game.currentQuarter - 1] || 0}</div></div>
              <div className="text-2xl font-bold">-</div>
              <div className={`text-center flex-1 p-2 rounded cursor-pointer ${selectedTeam === 'B' ? 'bg-red-700' : ''}`} onClick={() => setSelectedTeam('B')}><div className="text-xs truncate">{game.teamB.name}</div><div className="text-3xl font-bold">{teamBScore}</div><div className="text-xs">TF: {(game.teamB.teamFouls || [])[game.currentQuarter - 1] || 0}</div></div>
            </div>
            <div className="flex justify-center gap-1 mt-2 text-xs">
              {[1, 2, 3, 4].map(q => (<button key={q} onClick={() => changeQuarter(q)} className={`text-center px-3 py-1 rounded ${game.currentQuarter === q ? 'bg-yellow-500 text-black' : 'bg-blue-900'}`}><div className="font-bold">Q{q}</div><div>{getQuarterScore('A', q)}-{getQuarterScore('B', q)}</div></button>))}
            </div>
          </div>

          <div className="flex bg-white shadow">
            <button onClick={() => setSelectedTeam('A')} className={`flex-1 py-3 font-semibold border-b-4 ${selectedTeam === 'A' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}`}>{game.teamA.name}</button>
            <button onClick={() => setSelectedTeam('B')} className={`flex-1 py-3 font-semibold border-b-4 ${selectedTeam === 'B' ? 'border-red-600 text-red-600' : 'border-transparent text-gray-500'}`}>{game.teamB.name}</button>
          </div>

          <div className="p-2 bg-green-50">
            <div className="flex justify-between items-center mb-2">
              <h3 className="font-bold text-green-800 text-sm">🏃 出場中 ({onCourtPlayers.length}/5)</h3>
              <div className="flex gap-2">
                {!startersSetForTeam ? (<button onClick={() => { setTempStarters([]); setShowStarterSelect(true); }} className="bg-green-600 text-white px-3 py-1 rounded text-sm font-bold">🏁 スタート</button>) : (<button onClick={() => setShowSubstitution(true)} className="bg-orange-500 text-white px-3 py-1 rounded text-sm">🔄 交代</button>)}
              </div>
            </div>
            {!startersSetForTeam ? (<p className="text-sm text-gray-500 text-center py-2">「スタート」ボタンでQ{game.currentQuarter}のスタートメンバー5人を選択</p>) : onCourtPlayers.length === 0 ? (<p className="text-sm text-gray-500 text-center py-2">出場選手がいません</p>) : (<div className="flex flex-wrap gap-2">{onCourtPlayers.map((player) => (<div key={player.id} className={`bg-white rounded px-2 py-1 shadow text-xs ${getPlayerFoulCount(player) >= 4 ? 'border-2 border-yellow-500' : ''}`}><span className="font-bold text-blue-600">#{player.number}</span> {player.name}<span className="ml-1 text-gray-500">({getPlayerTotalPoints(player)}点/PF{getPlayerFoulCount(player)})</span></div>))}</div>)}
          </div>

          <div className="p-2">
            <table className="w-full bg-white rounded-lg shadow text-xs"><thead><tr className="bg-gray-100"><th className="p-1 w-8">No</th><th className="p-1 text-left">氏名</th><th className="p-1">得点</th><th className="p-1">ファウル</th><th className="p-1 w-14">出場Q</th></tr></thead>
              <tbody>
                {activePlayers.length === 0 ? (<tr><td colSpan="5" className="p-4 text-center text-gray-500">選手が登録されていません</td></tr>) : activePlayers.map((player) => {
                  const isOnCourt = onCourtIndexes.includes(player.originalIndex);
                  const qp = player.quarterPoints || [0,0,0,0];
                  const fouls = player.fouls || ['', '', '', '', ''];
                  const foulCount = getPlayerFoulCount(player);
                  const quarters = player.quarters || [{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false },{ played: false, isStarter: false }];
                  return (<tr key={player.id} className={`border-b ${isOnCourt ? 'bg-green-50' : ''} ${foulCount >= 5 ? 'bg-red-100' : ''}`}><td className="p-1 text-center font-bold">{player.number || '-'}</td><td className="p-1 truncate max-w-[60px]">{isOnCourt && <span className="text-green-600">●</span>}{player.name}</td><td className="p-1 text-center"><div className="flex items-center justify-center gap-1"><span className="font-bold text-blue-600 text-base">{getPlayerTotalPoints(player)}</span><span className="text-gray-500 text-xs">({qp[0]}|{qp[1]}|{qp[2]}|{qp[3]})</span></div></td><td className="p-1"><div className="flex gap-0.5 justify-center">{fouls.map((f, i) => (<div key={i} className={`foul-box ${f ? 'bg-yellow-100' : ''} ${f && foulCount >= 5 ? 'bg-red-200' : ''}`}>{f}</div>))}</div></td><td className="p-1"><div className="flex gap-0.5 justify-center">{[0, 1, 2, 3].map(q => { const qInfo = quarters[q] || { played: false, isStarter: false }; let bgColor = 'bg-gray-200 text-gray-400'; if (qInfo.played) bgColor = qInfo.isStarter ? 'bg-green-500 text-white' : 'bg-orange-500 text-white'; return (<div key={q} className={`w-4 h-4 rounded text-[10px] flex items-center justify-center font-bold ${bgColor}`}>{q + 1}</div>); })}</div></td></tr>);
                })}
              </tbody>
            </table>
            <div className="mt-2 text-xs text-gray-500 flex gap-4 justify-center"><span><span className="inline-block w-3 h-3 bg-green-500 rounded mr-1"></span>スタート</span><span><span className="inline-block w-3 h-3 bg-orange-500 rounded mr-1"></span>交代出場</span></div>
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg p-3">
            <div className="flex gap-3 max-w-lg mx-auto">
              <button onClick={() => { if (!startersSetForTeam) { alert('先に「スタート」ボタンでスタートメンバーを選択してください'); return; } if (onCourtPlayers.length === 0) { alert('出場選手がいません'); return; } setShowPlayerSelect('score'); }} className={`flex-1 py-4 rounded-xl text-white font-bold text-lg shadow-lg active:scale-95 transition ${selectedTeam === 'A' ? 'bg-blue-600' : 'bg-red-600'}`}>🏀 得点</button>
              <button onClick={() => { if (!startersSetForTeam) { alert('先に「スタート」ボタンでスタートメンバーを選択してください'); return; } if (onCourtPlayers.length === 0) { alert('出場選手がいません'); return; } setShowPlayerSelect('foul'); }} className="flex-1 py-4 rounded-xl bg-yellow-500 text-white font-bold text-lg shadow-lg active:scale-95 transition">⚠️ ファウル</button>
            </div>
          </div>

          {showStarterSelect && (<div className="fixed inset-0 bg-black bg-opacity-50 flex items-end z-20" onClick={() => setShowStarterSelect(false)}><div className="bg-white w-full rounded-t-2xl p-4 max-h-[80vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}><div className="flex justify-between items-center mb-4"><h3 className="text-lg font-bold">🏁 Q{game.currentQuarter} スタートメンバー ({tempStarters.length}/5)</h3><button onClick={() => setShowStarterSelect(false)} className="text-3xl text-gray-400">×</button></div><p className="text-sm text-gray-600 mb-4">スタートメンバー5人を選択してください</p><div className="grid grid-cols-2 gap-2">{activePlayers.map((player) => { const isSelected = tempStarters.includes(player.originalIndex); const foulCount = getPlayerFoulCount(player); const isFouledOut = foulCount >= 5; return (<button key={player.id} onClick={() => { if (isFouledOut) return; if (isSelected) setTempStarters(tempStarters.filter(i => i !== player.originalIndex)); else if (tempStarters.length < 5) setTempStarters([...tempStarters, player.originalIndex]); }} disabled={isFouledOut} className={`p-3 rounded-lg text-left ${isFouledOut ? 'bg-red-100 text-gray-400' : isSelected ? 'bg-green-500 text-white' : 'bg-gray-100 active:bg-gray-200'}`}><div className="font-bold">#{player.number} {player.name}</div><div className="text-xs mt-1">{getPlayerTotalPoints(player)}点 / PF:{foulCount}{isFouledOut && ' (退場)'}</div></button>); })}</div><button onClick={() => { if (tempStarters.length !== 5) { alert('5人選択してください'); return; } setStarters(selectedTeam, tempStarters); }} disabled={tempStarters.length !== 5} className={`w-full mt-4 py-3 rounded-lg font-semibold ${tempStarters.length === 5 ? 'bg-green-600 text-white' : 'bg-gray-300 text-gray-500'}`}>スタートメンバー確定</button></div></div>)}

          {showSubstitution && (<SubstitutionModal team={team} activePlayers={activePlayers} onCourtIndexes={onCourtIndexes} onSubstitute={(playerOut, playerIn) => makeSubstitution(selectedTeam, playerOut, playerIn)} onClose={() => setShowSubstitution(false)} />)}

          {showPlayerSelect && (<div className="fixed inset-0 bg-black bg-opacity-50 flex items-end z-20" onClick={() => setShowPlayerSelect(null)}><div className="bg-white w-full rounded-t-2xl p-4 max-h-[80vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}><div className="flex justify-between items-center mb-4"><h3 className="text-lg font-bold">{showPlayerSelect === 'score' ? '🏀 得点した選手' : '⚠️ ファウルした選手'}</h3><button onClick={() => setShowPlayerSelect(null)} className="text-3xl text-gray-400">×</button></div><div className="grid grid-cols-1 gap-2">{onCourtPlayers.sort((a, b) => a.originalIndex - b.originalIndex).map((player) => { const foulCount = getPlayerFoulCount(player); return (<div key={player.id} className="border rounded-lg p-3 bg-gray-50"><div className="font-bold text-sm mb-2"><span className="text-blue-600">#{player.number}</span> {player.name}<span className="ml-2 text-gray-500 font-normal">({getPlayerTotalPoints(player)}点 / PF:{foulCount})</span></div>{showPlayerSelect === 'score' ? (<div className="flex gap-2"><button onClick={() => addScore(selectedTeam, player.originalIndex, 1)} className="flex-1 bg-gray-300 py-3 rounded-lg font-bold text-lg active:bg-gray-400">+1</button><button onClick={() => addScore(selectedTeam, player.originalIndex, 2)} className="flex-1 bg-blue-500 text-white py-3 rounded-lg font-bold text-lg active:bg-blue-600">+2</button></div>) : (<div className="flex gap-2">{['P', 'P1', 'P2'].map(foulType => (<button key={foulType} onClick={() => addFoul(selectedTeam, player.originalIndex, foulType)} disabled={foulCount >= 5} className={`flex-1 py-3 rounded-lg font-bold ${foulCount >= 5 ? 'bg-gray-300 text-gray-500' : 'bg-yellow-500 text-white active:bg-yellow-600'}`}>{foulType}</button>))}</div>)}</div>); })}</div></div></div>)}

          {showUndoMenu && (<div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-20" onClick={() => setShowUndoMenu(false)}><div className="bg-white rounded-xl p-6 mx-4 max-w-sm w-full" onClick={(e) => e.stopPropagation()}><h3 className="text-lg font-bold mb-4">直前の操作を取り消し</h3>{game.runningScore.length > 0 ? (<><p className="text-sm text-gray-600 mb-4">最後の操作を取り消しますか？</p><div className="flex gap-3"><button onClick={() => setShowUndoMenu(false)} className="flex-1 py-3 rounded-lg bg-gray-200 font-semibold">キャンセル</button><button onClick={undoLast} className="flex-1 py-3 rounded-lg bg-red-600 text-white font-semibold">取り消す</button></div></>) : (<><p className="text-sm text-gray-500 mb-4">取り消せる操作がありません</p><button onClick={() => setShowUndoMenu(false)} className="w-full py-3 rounded-lg bg-gray-200 font-semibold">閉じる</button></>)}</div></div>)}
        </div>
      );
    }

    function SubstitutionModal({ team, activePlayers, onCourtIndexes, onSubstitute, onClose }) {
      const [playerOut, setPlayerOut] = useState(null);
      const [playerIn, setPlayerIn] = useState(null);
      const onCourtPlayers = activePlayers.filter(p => onCourtIndexes.includes(p.originalIndex));
      const benchPlayers = activePlayers.filter(p => !onCourtIndexes.includes(p.originalIndex) && getPlayerFoulCount(p) < 5);
      return (<div className="fixed inset-0 bg-black bg-opacity-50 flex items-end z-20" onClick={onClose}><div className="bg-white w-full rounded-t-2xl p-4 max-h-[85vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}><div className="flex justify-between items-center mb-4"><h3 className="text-lg font-bold">🔄 選手交代</h3><button onClick={onClose} className="text-3xl text-gray-400">×</button></div><div className="mb-4"><h4 className="font-semibold text-red-600 mb-2">❌ 交代で抜ける選手</h4><div className="grid grid-cols-2 gap-2">{onCourtPlayers.map((player) => (<button key={player.id} onClick={() => setPlayerOut(player.originalIndex)} className={`p-2 rounded-lg text-left text-sm ${playerOut === player.originalIndex ? 'bg-red-500 text-white' : 'bg-gray-100 active:bg-gray-200'}`}><span className="font-bold">#{player.number}</span> {player.name}</button>))}</div></div><div className="mb-4"><h4 className="font-semibold text-green-600 mb-2">✅ 交代で入る選手</h4>{benchPlayers.length === 0 ? (<p className="text-sm text-gray-500">交代可能な選手がいません</p>) : (<div className="grid grid-cols-2 gap-2">{benchPlayers.map((player) => (<button key={player.id} onClick={() => setPlayerIn(player.originalIndex)} className={`p-2 rounded-lg text-left text-sm ${playerIn === player.originalIndex ? 'bg-green-500 text-white' : 'bg-gray-100 active:bg-gray-200'}`}><span className="font-bold">#{player.number}</span> {player.name}<div className="text-xs">PF:{getPlayerFoulCount(player)}</div></button>))}</div>)}</div>{playerOut !== null && playerIn !== null && (<div className="bg-blue-50 p-3 rounded-lg mb-4 text-center"><span className="text-red-600 font-bold">#{team.players[playerOut]?.number} {team.players[playerOut]?.name}</span><span className="mx-2">→</span><span className="text-green-600 font-bold">#{team.players[playerIn]?.number} {team.players[playerIn]?.name}</span></div>)}<button onClick={() => { if (playerOut !== null && playerIn !== null) onSubstitute(playerOut, playerIn); }} disabled={playerOut === null || playerIn === null} className={`w-full py-3 rounded-lg font-semibold ${playerOut !== null && playerIn !== null ? 'bg-orange-500 text-white' : 'bg-gray-300 text-gray-500'}`}>交代を確定</button></div></div>);
    }

    function HistoryEditView({ game, onUpdate, onBack }) {
      const [editingAction, setEditingAction] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [insertIndex, setInsertIndex] = useState(null);

      const getPlayerName = (teamKey, playerIndex) => { const team = teamKey === 'A' ? game.teamA : game.teamB; const player = team.players[playerIndex]; return player ? `#${player.number} ${player.name}` : '不明'; };
      const getTeamName = (teamKey) => teamKey === 'A' ? game.teamA.name : game.teamB.name;
      const deleteAction = (index) => { if (!confirm('この記録を削除しますか？')) return; const newGame = JSON.parse(JSON.stringify(game)); newGame.runningScore.splice(index, 1); const recalculated = recalculateFromHistory(newGame); recalculated.currentQuarter = newGame.currentQuarter; onUpdate(recalculated); };
      const updateAction = (index, updatedAction) => { const newGame = JSON.parse(JSON.stringify(game)); newGame.runningScore[index] = { ...newGame.runningScore[index], ...updatedAction }; const recalculated = recalculateFromHistory(newGame); recalculated.currentQuarter = newGame.currentQuarter; onUpdate(recalculated); setEditingAction(null); };
      const insertAction = (index, newAction) => { const newGame = JSON.parse(JSON.stringify(game)); newGame.runningScore.splice(index, 0, { ...newAction, id: Date.now() }); const recalculated = recalculateFromHistory(newGame); recalculated.currentQuarter = newGame.currentQuarter; onUpdate(recalculated); setShowAddModal(false); setInsertIndex(null); };
      const getActionIcon = (type) => { switch(type) { case 'score': return '🏀'; case 'foul': return '⚠️'; case 'starter': return '🏁'; case 'substitution': return '🔄'; default: return '📝'; } };
      const getActionDescription = (action) => { switch(action.type) { case 'score': return `${getPlayerName(action.scoringTeam, action.scoringPlayerIndex)} +${action.points}点`; case 'foul': return `${getPlayerName(action.scoringTeam, action.scoringPlayerIndex)} ${action.foulType}`; case 'starter': return `スタート: ${(action.playerIndexes || []).map(i => getPlayerName(action.scoringTeam, i)).join(', ')}`; case 'substitution': return `${getPlayerName(action.scoringTeam, action.playerOut)} → ${getPlayerName(action.scoringTeam, action.playerIn)}`; default: return '不明'; } };

      return (<div className="min-h-screen bg-gray-100 pb-20 no-print"><div className="bg-purple-800 text-white p-4 sticky top-0 z-10"><div className="flex items-center justify-between"><button onClick={onBack} className="text-white">← 戻る</button><h2 className="font-bold">📝 記録履歴</h2><button onClick={() => { setInsertIndex(game.runningScore.length); setShowAddModal(true); }} className="bg-green-500 px-3 py-1 rounded text-sm">+ 追加</button></div></div><div className="p-2">{game.runningScore.length === 0 ? (<p className="text-center text-gray-500 py-8">記録がありません</p>) : (<div className="space-y-1">{game.runningScore.map((action, index) => (<div key={action.id || index}><button onClick={() => { setInsertIndex(index); setShowAddModal(true); }} className="w-full py-1 text-xs text-purple-600 hover:bg-purple-50 border-dashed border border-purple-200 rounded">↑ 挿入</button><div className={`bg-white rounded-lg p-2 shadow flex items-center gap-2 ${action.type === 'score' ? 'border-l-4 border-blue-500' : action.type === 'foul' ? 'border-l-4 border-yellow-500' : action.type === 'starter' ? 'border-l-4 border-green-500' : 'border-l-4 border-orange-500'}`}><div className="text-xl">{getActionIcon(action.type)}</div><div className="flex-1 min-w-0"><div className="flex items-center gap-1 flex-wrap"><span className={`text-xs px-1.5 py-0.5 rounded ${action.scoringTeam === 'A' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800'}`}>{getTeamName(action.scoringTeam)}</span><span className="text-xs bg-gray-100 px-1.5 py-0.5 rounded">Q{action.quarter}</span></div><div className="text-sm truncate mt-0.5">{getActionDescription(action)}</div></div><div className="flex gap-1 shrink-0"><button onClick={() => setEditingAction({ index, action: JSON.parse(JSON.stringify(action)) })} className="text-blue-600 text-xs px-2 py-1 bg-blue-50 rounded">編集</button><button onClick={() => deleteAction(index)} className="text-red-600 text-xs px-2 py-1 bg-red-50 rounded">削除</button></div></div></div>))}</div>)}</div>{editingAction && <ActionEditModal action={editingAction.action} game={game} onSave={(updated) => updateAction(editingAction.index, updated)} onCancel={() => setEditingAction(null)} />}{showAddModal && <ActionAddModal game={game} onSave={(newAction) => insertAction(insertIndex, newAction)} onCancel={() => { setShowAddModal(false); setInsertIndex(null); }} />}</div>);
    }

    function ActionEditModal({ action, game, onSave, onCancel }) {
      const [formData, setFormData] = useState(JSON.parse(JSON.stringify(action)));
      const team = formData.scoringTeam === 'A' ? game.teamA : game.teamB;
      const activePlayers = team.players.map((p, idx) => ({ ...p, originalIndex: idx })).filter(p => p.name);
      useEffect(() => { const newTeam = formData.scoringTeam === 'A' ? game.teamA : game.teamB; const newActivePlayers = newTeam.players.map((p, idx) => ({ ...p, originalIndex: idx })).filter(p => p.name); if ((formData.type === 'score' || formData.type === 'foul') && !newActivePlayers.find(p => p.originalIndex === formData.scoringPlayerIndex)) setFormData(prev => ({ ...prev, scoringPlayerIndex: newActivePlayers[0]?.originalIndex || 0 })); if (formData.type === 'substitution') { if (!newActivePlayers.find(p => p.originalIndex === formData.playerOut)) setFormData(prev => ({ ...prev, playerOut: newActivePlayers[0]?.originalIndex || 0 })); if (!newActivePlayers.find(p => p.originalIndex === formData.playerIn)) setFormData(prev => ({ ...prev, playerIn: newActivePlayers[1]?.originalIndex || 0 })); } }, [formData.scoringTeam]);
      const toggleStarterPlayer = (idx) => { const current = formData.playerIndexes || []; if (current.includes(idx)) setFormData({ ...formData, playerIndexes: current.filter(i => i !== idx) }); else if (current.length < 5) setFormData({ ...formData, playerIndexes: [...current, idx] }); };
      const canSave = () => { if (formData.type === 'starter') return (formData.playerIndexes || []).length === 5; if (formData.type === 'substitution') return formData.playerOut !== formData.playerIn; return true; };
      return (<div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-30" onClick={onCancel}><div className="bg-white rounded-xl p-4 mx-4 max-w-md w-full max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}><h3 className="text-lg font-bold mb-4">{formData.type === 'score' && '🏀 得点の編集'}{formData.type === 'foul' && '⚠️ ファウルの編集'}{formData.type === 'starter' && '🏁 スタートメンバーの編集'}{formData.type === 'substitution' && '🔄 交代の編集'}</h3><div className="space-y-4"><div><label className="block text-sm font-medium mb-1">クォーター</label><select value={formData.quarter} onChange={e => setFormData({ ...formData, quarter: parseInt(e.target.value) })} className="w-full border rounded p-2">{[1, 2, 3, 4].map(q => (<option key={q} value={q}>Q{q}</option>))}</select></div><div><label className="block text-sm font-medium mb-1">チーム</label><select value={formData.scoringTeam} onChange={e => setFormData({ ...formData, scoringTeam: e.target.value })} className="w-full border rounded p-2"><option value="A">{game.teamA.name}</option><option value="B">{game.teamB.name}</option></select></div>{(formData.type === 'score' || formData.type === 'foul') && (<div><label className="block text-sm font-medium mb-1">選手</label><select value={formData.scoringPlayerIndex} onChange={e => setFormData({ ...formData, scoringPlayerIndex: parseInt(e.target.value) })} className="w-full border rounded p-2">{activePlayers.map(p => (<option key={p.originalIndex} value={p.originalIndex}>#{p.number} {p.name}</option>))}</select></div>)}{formData.type === 'score' && (<div><label className="block text-sm font-medium mb-1">得点</label><div className="flex gap-2"><button onClick={() => setFormData({ ...formData, points: 1 })} className={`flex-1 py-3 rounded font-bold ${formData.points === 1 ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>+1</button><button onClick={() => setFormData({ ...formData, points: 2 })} className={`flex-1 py-3 rounded font-bold ${formData.points === 2 ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>+2</button></div></div>)}{formData.type === 'foul' && (<div><label className="block text-sm font-medium mb-1">ファウル種別</label><div className="flex gap-2">{['P', 'P1', 'P2'].map(ft => (<button key={ft} onClick={() => setFormData({ ...formData, foulType: ft })} className={`flex-1 py-3 rounded font-bold ${formData.foulType === ft ? 'bg-yellow-500 text-white' : 'bg-gray-200'}`}>{ft}</button>))}</div></div>)}{formData.type === 'starter' && (<div><label className="block text-sm font-medium mb-1">スタートメンバー ({(formData.playerIndexes || []).length}/5)</label><div className="grid grid-cols-2 gap-1 max-h-48 overflow-y-auto border rounded p-2">{activePlayers.map(p => { const isSelected = (formData.playerIndexes || []).includes(p.originalIndex); return (<button key={p.originalIndex} onClick={() => toggleStarterPlayer(p.originalIndex)} className={`p-2 rounded text-xs text-left ${isSelected ? 'bg-green-500 text-white' : 'bg-gray-100'}`}>#{p.number} {p.name}</button>); })}</div></div>)}{formData.type === 'substitution' && (<><div><label className="block text-sm font-medium mb-1 text-red-600">❌ 抜ける選手</label><select value={formData.playerOut} onChange={e => setFormData({ ...formData, playerOut: parseInt(e.target.value) })} className="w-full border rounded p-2">{activePlayers.map(p => (<option key={p.originalIndex} value={p.originalIndex}>#{p.number} {p.name}</option>))}</select></div><div><label className="block text-sm font-medium mb-1 text-green-600">✅ 入る選手</label><select value={formData.playerIn} onChange={e => setFormData({ ...formData, playerIn: parseInt(e.target.value) })} className="w-full border rounded p-2">{activePlayers.map(p => (<option key={p.originalIndex} value={p.originalIndex}>#{p.number} {p.name}</option>))}</select></div>{formData.playerOut === formData.playerIn && (<p className="text-red-500 text-sm">※ 抜ける選手と入る選手は異なる必要があります</p>)}</>)}</div><div className="flex gap-3 mt-6"><button onClick={onCancel} className="flex-1 py-3 bg-gray-200 rounded-lg font-semibold">キャンセル</button><button onClick={() => onSave(formData)} disabled={!canSave()} className={`flex-1 py-3 rounded-lg font-semibold ${canSave() ? 'bg-blue-600 text-white' : 'bg-gray-300 text-gray-500'}`}>保存</button></div></div></div>);
    }

    function ActionAddModal({ game, onSave, onCancel }) {
      const [formData, setFormData] = useState({ type: 'score', quarter: game.currentQuarter, scoringTeam: 'A', scoringPlayerIndex: 0, points: 2, foulType: 'P', playerOut: 0, playerIn: 1, playerIndexes: [] });
      const team = formData.scoringTeam === 'A' ? game.teamA : game.teamB;
      const activePlayers = team.players.map((p, idx) => ({ ...p, originalIndex: idx })).filter(p => p.name);
      useEffect(() => { if (activePlayers.length > 0) { const updates = {}; if (!activePlayers.find(p => p.originalIndex === formData.scoringPlayerIndex)) updates.scoringPlayerIndex = activePlayers[0]?.originalIndex || 0; if (!activePlayers.find(p => p.originalIndex === formData.playerOut)) updates.playerOut = activePlayers[0]?.originalIndex || 0; if (!activePlayers.find(p => p.originalIndex === formData.playerIn)) updates.playerIn = activePlayers[1]?.originalIndex || activePlayers[0]?.originalIndex || 0; if (Object.keys(updates).length > 0) setFormData(prev => ({ ...prev, ...updates })); } }, [formData.scoringTeam]);
      const toggleStarterPlayer = (idx) => { const current = formData.playerIndexes || []; if (current.includes(idx)) setFormData({ ...formData, playerIndexes: current.filter(i => i !== idx) }); else if (current.length < 5) setFormData({ ...formData, playerIndexes: [...current, idx] }); };
      const canSave = () => { if (formData.type === 'starter') return (formData.playerIndexes || []).length === 5; if (formData.type === 'substitution') return formData.playerOut !== formData.playerIn; return true; };
      return (<div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-30" onClick={onCancel}><div className="bg-white rounded-xl p-4 mx-4 max-w-md w-full max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}><h3 className="text-lg font-bold mb-4">記録の追加</h3><div className="space-y-4"><div><label className="block text-sm font-medium mb-1">種類</label><div className="grid grid-cols-2 gap-2"><button onClick={() => setFormData({ ...formData, type: 'score' })} className={`py-2 rounded text-sm ${formData.type === 'score' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>🏀 得点</button><button onClick={() => setFormData({ ...formData, type: 'foul' })} className={`py-2 rounded text-sm ${formData.type === 'foul' ? 'bg-yellow-500 text-white' : 'bg-gray-200'}`}>⚠️ ファウル</button><button onClick={() => setFormData({ ...formData, type: 'starter', playerIndexes: [] })} className={`py-2 rounded text-sm ${formData.type === 'starter' ? 'bg-green-600 text-white' : 'bg-gray-200'}`}>🏁 スタート</button><button onClick={() => setFormData({ ...formData, type: 'substitution' })} className={`py-2 rounded text-sm ${formData.type === 'substitution' ? 'bg-orange-500 text-white' : 'bg-gray-200'}`}>🔄 交代</button></div></div><div><label className="block text-sm font-medium mb-1">クォーター</label><select value={formData.quarter} onChange={e => setFormData({ ...formData, quarter: parseInt(e.target.value) })} className="w-full border rounded p-2">{[1, 2, 3, 4].map(q => (<option key={q} value={q}>Q{q}</option>))}</select></div><div><label className="block text-sm font-medium mb-1">チーム</label><select value={formData.scoringTeam} onChange={e => setFormData({ ...formData, scoringTeam: e.target.value })} className="w-full border rounded p-2"><option value="A">{game.teamA.name}</option><option value="B">{game.teamB.name}</option></select></div>{(formData.type === 'score' || formData.type === 'foul') && (<div><label className="block text-sm font-medium mb-1">選手</label><select value={formData.scoringPlayerIndex} onChange={e => setFormData({ ...formData, scoringPlayerIndex: parseInt(e.target.value) })} className="w-full border rounded p-2">{activePlayers.map(p => (<option key={p.originalIndex} value={p.originalIndex}>#{p.number} {p.name}</option>))}</select></div>)}{formData.type === 'score' && (<div><label className="block text-sm font-medium mb-1">得点</label><div className="flex gap-2"><button onClick={() => setFormData({ ...formData, points: 1 })} className={`flex-1 py-3 rounded font-bold ${formData.points === 1 ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>+1</button><button onClick={() => setFormData({ ...formData, points: 2 })} className={`flex-1 py-3 rounded font-bold ${formData.points === 2 ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>+2</button></div></div>)}{formData.type === 'foul' && (<div><label className="block text-sm font-medium mb-1">ファウル種別</label><div className="flex gap-2">{['P', 'P1', 'P2'].map(ft => (<button key={ft} onClick={() => setFormData({ ...formData, foulType: ft })} className={`flex-1 py-3 rounded font-bold ${formData.foulType === ft ? 'bg-yellow-500 text-white' : 'bg-gray-200'}`}>{ft}</button>))}</div></div>)}{formData.type === 'starter' && (<div><label className="block text-sm font-medium mb-1">スタートメンバー ({(formData.playerIndexes || []).length}/5)</label><div className="grid grid-cols-2 gap-1 max-h-48 overflow-y-auto border rounded p-2">{activePlayers.map(p => { const isSelected = (formData.playerIndexes || []).includes(p.originalIndex); return (<button key={p.originalIndex} onClick={() => toggleStarterPlayer(p.originalIndex)} className={`p-2 rounded text-xs text-left ${isSelected ? 'bg-green-500 text-white' : 'bg-gray-100'}`}>#{p.number} {p.name}</button>); })}</div></div>)}{formData.type === 'substitution' && (<><div><label className="block text-sm font-medium mb-1 text-red-600">❌ 抜ける選手</label><select value={formData.playerOut} onChange={e => setFormData({ ...formData, playerOut: parseInt(e.target.value) })} className="w-full border rounded p-2">{activePlayers.map(p => (<option key={p.originalIndex} value={p.originalIndex}>#{p.number} {p.name}</option>))}</select></div><div><label className="block text-sm font-medium mb-1 text-green-600">✅ 入る選手</label><select value={formData.playerIn} onChange={e => setFormData({ ...formData, playerIn: parseInt(e.target.value) })} className="w-full border rounded p-2">{activePlayers.map(p => (<option key={p.originalIndex} value={p.originalIndex}>#{p.number} {p.name}</option>))}</select></div>{formData.playerOut === formData.playerIn && (<p className="text-red-500 text-sm">※ 抜ける選手と入る選手は異なる必要があります</p>)}</>)}</div><div className="flex gap-3 mt-6"><button onClick={onCancel} className="flex-1 py-3 bg-gray-200 rounded-lg font-semibold">キャンセル</button><button onClick={() => onSave(formData)} disabled={!canSave()} className={`flex-1 py-3 rounded-lg font-semibold ${canSave() ? 'bg-green-600 text-white' : 'bg-gray-300 text-gray-500'}`}>追加</button></div></div></div>);
    }

    // スコアシート印刷プレビュー画面（HTML版）
    function PrintScoresheetView({ game, onBack }) {
      const teamAScore = game.teamA.players.reduce((s, p) => s + getPlayerTotalPoints(p), 0);
      const teamBScore = game.teamB.players.reduce((s, p) => s + getPlayerTotalPoints(p), 0);

      // ランニングスコアを計算
      const calculateRunningScores = () => {
        let scoreA = 0, scoreB = 0;
        const scoresA = [], scoresB = [];
        game.runningScore.filter(a => a.type === 'score').forEach(action => {
          if (action.scoringTeam === 'A') { scoreA += action.points; scoresA.push(scoreA); }
          else { scoreB += action.points; scoresB.push(scoreB); }
        });
        return { scoresA, scoresB };
      };

      const { scoresA, scoresB } = calculateRunningScores();

      const getQuarterScore = (team, q) => team.players.reduce((sum, p) => sum + ((p.quarterPoints || [0,0,0,0])[q - 1] || 0), 0);

      const formatDate = (dateStr) => {
        if (!dateStr) return { year: '', month: '', day: '' };
        const [year, month, day] = dateStr.split('-');
        return { year, month, day };
      };

      const { year, month, day } = formatDate(game.date);
      const [hour, minute] = (game.time || ':').split(':');

      const renderTeamSection = (team, teamLabel, teamColor) => {
        const activePlayers = team.players.filter(p => p.name);
        return (
          <div className="mb-4">
            <div className="flex items-center gap-4 mb-1">
              <span className="font-bold">チーム{teamLabel}:</span>
              <span className="text-lg font-bold" style={{color: teamColor}}>{team.name}</span>
              {teamLabel === 'A' && <span className="text-xs border px-1">（白）</span>}
            </div>
            <table className="scoresheet-table w-full">
              <thead>
                <tr className="bg-gray-100">
                  <th className="w-8">No.</th>
                  <th className="w-12">ライセンス</th>
                  <th className="w-24">選手氏名</th>
                  <th className="w-20">出場時限</th>
                  <th colSpan="5" className="w-24">ファウル</th>
                  <th className="w-10">得点</th>
                </tr>
              </thead>
              <tbody>
                {activePlayers.slice(0, 15).map((player, i) => {
                  const quarters = player.quarters || [{},{},{},{}];
                  const fouls = player.fouls || ['','','','',''];
                  return (
                    <tr key={i}>
                      <td className="text-center font-bold">{player.number}</td>
                      <td className="text-center">{player.licenseNo}</td>
                      <td>{player.name}</td>
                      <td className="text-center">
                        {[0,1,2,3].map(q => {
                          const qInfo = quarters[q] || {};
                          return (
                            <span key={q} className={`q-circle ${qInfo.played ? (qInfo.isStarter ? 'starter' : 'sub') : ''}`}>
                              {q+1}
                            </span>
                          );
                        })}
                      </td>
                      {fouls.map((f, fi) => (<td key={fi} className="text-center w-5">{f}</td>))}
                      <td className="text-center font-bold">{getPlayerTotalPoints(player)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div className="flex gap-4 mt-1 text-xs">
              <span>コーチ: {team.coach}</span>
              <span>A.コーチ: {team.assistantCoach}</span>
            </div>
            <div className="flex gap-2 mt-1 text-xs">
              <span>チームファウル:</span>
              {[1,2,3,4].map(q => (
                <span key={q} className="border px-1">Q{q}: {(team.teamFouls || [])[q-1] || 0}</span>
              ))}
            </div>
          </div>
        );
      };

      return (
        <div>
          {/* 画面操作ボタン（印刷時非表示） */}
          <div className="no-print p-4 bg-gray-100 flex gap-4 items-center">
            <button onClick={onBack} className="text-blue-600">← 戻る</button>
            <button onClick={() => window.print()} className="bg-blue-600 text-white px-4 py-2 rounded">🖨️ 印刷 / PDF保存</button>
            <span className="text-sm text-gray-500">※ブラウザの印刷機能でPDF保存可能</span>
          </div>

          {/* スコアシート本体 */}
          <div className="p-4 max-w-4xl mx-auto bg-white" style={{fontSize: '10px'}}>
            <div className="text-center mb-4">
              <h1 className="text-lg font-bold">MINI-BASKETBALL OFFICIAL SCORESHEET</h1>
            </div>

            {/* ヘッダー情報 */}
            <div className="grid grid-cols-2 gap-4 mb-4 text-xs">
              <div>
                <div className="flex gap-2 items-center">
                  <span>大会名:</span>
                  <span className="border-b flex-1 px-1">{game.tournamentName}</span>
                </div>
              </div>
              <div className="flex gap-2">
                <span>日付:</span>
                <span className="border-b w-12 text-center">{year}</span>年
                <span className="border-b w-8 text-center">{month}</span>月
                <span className="border-b w-8 text-center">{day}</span>日
                <span className="ml-2">時間:</span>
                <span className="border-b w-8 text-center">{hour}</span>:
                <span className="border-b w-8 text-center">{minute}</span>
              </div>
              <div className="flex gap-2 items-center">
                <span>会場:</span>
                <span className="border-b flex-1 px-1">{game.venue}</span>
              </div>
              <div className="flex gap-2 items-center">
                <span>Game No.:</span>
                <span className="border-b w-16 text-center">{game.gameNo}</span>
              </div>
            </div>

            {/* スコア */}
            <div className="flex justify-center items-center gap-8 mb-4 py-2 bg-gray-100 rounded">
              <div className="text-center">
                <div className="text-xs">チームA</div>
                <div className="text-2xl font-bold text-blue-600">{game.teamA.name}</div>
              </div>
              <div className="text-4xl font-bold">{teamAScore} - {teamBScore}</div>
              <div className="text-center">
                <div className="text-xs">チームB</div>
                <div className="text-2xl font-bold text-red-600">{game.teamB.name}</div>
              </div>
            </div>

            {/* クォーター別スコア */}
            <div className="flex justify-center gap-4 mb-4 text-xs">
              <table className="scoresheet-table">
                <thead><tr><th></th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>合計</th></tr></thead>
                <tbody>
                  <tr><td className="font-bold text-blue-600">{game.teamA.name}</td><td>{getQuarterScore(game.teamA, 1)}</td><td>{getQuarterScore(game.teamA, 2)}</td><td>{getQuarterScore(game.teamA, 3)}</td><td>{getQuarterScore(game.teamA, 4)}</td><td className="font-bold">{teamAScore}</td></tr>
                  <tr><td className="font-bold text-red-600">{game.teamB.name}</td><td>{getQuarterScore(game.teamB, 1)}</td><td>{getQuarterScore(game.teamB, 2)}</td><td>{getQuarterScore(game.teamB, 3)}</td><td>{getQuarterScore(game.teamB, 4)}</td><td className="font-bold">{teamBScore}</td></tr>
                </tbody>
              </table>
            </div>

            {/* チームA */}
            {renderTeamSection(game.teamA, 'A', '#2563eb')}

            {/* チームB */}
            {renderTeamSection(game.teamB, 'B', '#dc2626')}

            {/* ランニングスコア */}
            <div className="mt-4">
              <h3 className="font-bold mb-2">ランニングスコア</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <table className="scoresheet-table w-full">
                    <thead><tr><th colSpan="20" className="bg-blue-100">{game.teamA.name}</th></tr></thead>
                    <tbody>
                      {[0, 20, 40, 60].map(start => (
                        <tr key={start}>
                          {Array.from({length: 20}, (_, i) => start + i + 1).map(n => (
                            <td key={n} className={`running-score-cell ${scoresA.includes(n) ? 'scored' : ''}`}>{n}</td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div>
                  <table className="scoresheet-table w-full">
                    <thead><tr><th colSpan="20" className="bg-red-100">{game.teamB.name}</th></tr></thead>
                    <tbody>
                      {[0, 20, 40, 60].map(start => (
                        <tr key={start}>
                          {Array.from({length: 20}, (_, i) => start + i + 1).map(n => (
                            <td key={n} className={`running-score-cell ${scoresB.includes(n) ? 'scored' : ''}`}>{n}</td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            {/* フッター */}
            <div className="mt-4 pt-2 border-t text-xs">
              <div className="flex gap-8">
                <span>勝利チーム: <span className="font-bold">{game.winner || (teamAScore > teamBScore ? game.teamA.name : teamBScore > teamAScore ? game.teamB.name : '引分')}</span></span>
                <span>試合終了時間: {game.endTime}</span>
              </div>
              <div className="text-right text-gray-400 mt-2">
                ※このスコアシートはアプリから出力されました
              </div>
            </div>
          </div>
        </div>
      );
    }

    function GamesListView({ games, onBack, onSelectGame, onDeleteGame }) {
      return (<div className="p-4 max-w-lg mx-auto no-print"><div className="flex items-center mb-4"><button onClick={onBack} className="text-blue-600 mr-4 text-lg">← 戻る</button><h2 className="text-xl font-bold">試合履歴</h2></div>{games.length === 0 ? (<p className="text-gray-500 text-center py-8">まだ試合履歴がありません</p>) : (<div className="space-y-3">{[...games].reverse().map((game, i) => { const teamAScore = game.teamA.players.reduce((s, p) => s + getPlayerTotalPoints(p), 0); const teamBScore = game.teamB.players.reduce((s, p) => s + getPlayerTotalPoints(p), 0); return (<div key={game.id || i} className="bg-white rounded-lg p-4 shadow"><div className="flex justify-between items-start"><div className="text-sm text-gray-500">{game.date} {game.tournamentName}</div><button onClick={() => { if (confirm('この試合を削除しますか？')) onDeleteGame(game.id); }} className="text-red-400 text-xs">削除</button></div><div className="flex justify-between items-center mt-2 cursor-pointer" onClick={() => onSelectGame(game)}><span className="font-semibold flex-1 truncate">{game.teamA.name}</span><span className="text-2xl font-bold mx-4">{teamAScore} - {teamBScore}</span><span className="font-semibold flex-1 truncate text-right">{game.teamB.name}</span></div><div className="text-xs text-gray-400 mt-2 text-center">タップして詳細を見る</div></div>); })}</div>)}</div>);
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
