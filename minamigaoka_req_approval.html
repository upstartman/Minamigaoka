<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>南ヶ丘MBC 申請管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B35;
      --primary-dark: #E55A2B;
      --primary-light: #FF8F66;
      --secondary: #004E89;
      --secondary-light: #1A6BB0;
      --accent: #FFD166;
      --success: #06D6A0;
      --success-dark: #05B88A;
      --warning: #FFD166;
      --danger: #EF476F;
      --bg-main: #FFF8F5;
      --bg-card: #FFFFFF;
      --text-primary: #2D3436;
      --text-secondary: #636E72;
      --text-muted: #B2BEC3;
      --border: #E8E8E8;
      --shadow: 0 4px 20px rgba(255, 107, 53, 0.15);
      --shadow-lg: 0 8px 40px rgba(255, 107, 53, 0.2);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      padding: 20px 16px 24px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .header::after {
      content: '🏀';
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 32px;
      opacity: 0.3;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .header-title {
      font-size: 22px;
      font-weight: 800;
      color: white;
      letter-spacing: 0.5px;
    }

    .header-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
      font-weight: 500;
    }

    /* Tab Navigation */
    .tab-nav {
      display: flex;
      background: var(--bg-card);
      margin: -12px 16px 16px;
      border-radius: var(--radius);
      padding: 6px;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 10;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 8px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
    }

    .tab-btn .badge {
      background: var(--danger);
      color: white;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
      min-width: 20px;
    }

    .tab-btn.active .badge {
      background: white;
      color: var(--primary);
    }

    /* Content Area */
    .tab-content {
      display: none;
      padding: 0 16px;
      animation: fadeIn 0.3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Application Cards */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 15px;
      font-weight: 500;
    }

    .application-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 0;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .application-card:active {
      transform: scale(0.98);
    }

    .card-header {
      padding: 16px;
      background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-light) 100%);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card-header.approved {
      background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
    }

    .applicant-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .apply-date {
      font-size: 12px;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
    }

    .card-body {
      padding: 16px;
    }

    .info-section {
      margin-bottom: 16px;
    }

    .info-section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .info-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .info-value.email {
      font-size: 12px;
      color: var(--secondary);
      word-break: break-all;
    }

    .insurance-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--success);
      color: white;
    }

    .insurance-tag.no {
      background: var(--text-muted);
    }

    /* Approve Button */
    .approve-section {
      padding: 0 16px 16px;
    }

    .approve-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(6, 214, 160, 0.3);
    }

    .approve-btn:active {
      transform: scale(0.98);
    }

    .approve-btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    .approve-btn.loading {
      pointer-events: none;
    }

    .approve-btn.loading::after {
      content: '';
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Refresh Button */
    .refresh-fab {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .refresh-fab:active {
      transform: scale(0.9);
    }

    .refresh-fab.loading {
      animation: rotate 1s linear infinite;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--text-primary);
      color: white;
      padding: 14px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 1000;
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      background: var(--success);
    }

    .toast.error {
      background: var(--danger);
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 248, 245, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .loading-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    .loading-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* History Tab specific */
    .history-filter {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-chip {
      padding: 10px 16px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 20px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-chip.active {
      background: var(--secondary);
      border-color: var(--secondary);
      color: white;
    }

    .approved-date {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Footer safe area for iOS */
    .safe-area-bottom {
      height: env(safe-area-inset-bottom, 20px);
    }

    /* Confirmation Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.show .modal-content {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .modal-message {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn.cancel {
      background: var(--bg-main);
      color: var(--text-secondary);
    }

    .modal-btn.confirm {
      background: var(--success);
      color: white;
    }

    .modal-btn:active {
      transform: scale(0.98);
    }

    /* Highlight name */
    .highlight-name {
      color: var(--primary);
      font-weight: 800;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-title">南ヶ丘MBC</div>
    <div class="header-subtitle">入部申請管理システム</div>
  </header>

  <!-- Tab Navigation -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="pending" onclick="switchTab('pending')">
      📋 未処理
      <span class="badge" id="pendingCount">0</span>
    </button>
    <button class="tab-btn" data-tab="history" onclick="switchTab('history')">
      📁 受理済み
    </button>
  </nav>

  <!-- Pending Tab -->
  <div class="tab-content active" id="tab-pending">
    <div id="pendingList"></div>
  </div>

  <!-- History Tab -->
  <div class="tab-content" id="tab-history">
    <div id="historyList"></div>
  </div>

  <!-- Refresh FAB -->
  <button class="refresh-fab" id="refreshBtn" onclick="loadApplications()">
    🔄
  </button>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">読み込み中...</div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Confirmation Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
      <div class="modal-icon">✅</div>
      <div class="modal-title">入部を受理しますか？</div>
      <div class="modal-message" id="modalMessage"></div>
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeModal()">キャンセル</button>
        <button class="modal-btn confirm" id="modalConfirmBtn">受理する</button>
      </div>
    </div>
  </div>

  <div class="safe-area-bottom"></div>

  <script>
    // ★★★ GAS Web App URL（ここに実際のURLを設定） ★★★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz3Ac2Rt8NgzrAGW6zUivwfmtwhr2ULocQ5cWF8wxIhl-88-mRi18jo4h1lgq4t_CwO_A/exec";

    // State
    let allApplications = [];
    let pendingApplications = [];
    let approvedApplications = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadApplications();
    });

    // Tab Switching
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabId);
      });
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.toggle('active', content.id === `tab-${tabId}`);
      });
    }

    // Load Applications
    async function loadApplications() {
      if (!GAS_URL || GAS_URL.includes('YOUR_DEPLOYMENT_ID')) {
        renderEmptyState('pending', '⚙️', 'GAS URLを設定してください');
        renderEmptyState('history', '⚙️', 'GAS URLを設定してください');
        return;
      }

      showLoading(true);
      document.getElementById('refreshBtn').classList.add('loading');

      try {
        // 全申請データを取得
        const response = await fetch(`${GAS_URL}?action=getAllApplications`);
        const data = await response.json();

        if (data.success) {
          allApplications = data.applications || [];
          pendingApplications = allApplications.filter(app => app.status !== '受理済み');
          approvedApplications = allApplications.filter(app => app.status === '受理済み');
          
          renderPendingList();
          renderHistoryList();
          updateBadge();
        } else {
          // getAllApplicationsがない場合はgetPendingApplicationsを使用
          await loadPendingOnly();
        }
      } catch (error) {
        console.error('Error:', error);
        // フォールバック: getPendingApplicationsを試す
        try {
          await loadPendingOnly();
        } catch (e) {
          showToast('読み込みエラー: ' + error.message, 'error');
          renderEmptyState('pending', '❌', 'データの読み込みに失敗しました');
          renderEmptyState('history', '❌', 'データの読み込みに失敗しました');
        }
      } finally {
        showLoading(false);
        document.getElementById('refreshBtn').classList.remove('loading');
      }
    }

    // Fallback: Load Pending Only
    async function loadPendingOnly() {
      const response = await fetch(`${GAS_URL}?action=getPendingApplications`);
      const data = await response.json();
      
      if (data.success) {
        pendingApplications = data.applications || [];
        approvedApplications = [];
        renderPendingList();
        renderEmptyState('history', '📝', 'GASを更新すると履歴が表示されます');
        updateBadge();
      } else {
        throw new Error(data.error || 'データの取得に失敗しました');
      }
    }

    // Update Badge
    function updateBadge() {
      const badge = document.getElementById('pendingCount');
      badge.textContent = pendingApplications.length;
      badge.style.display = pendingApplications.length > 0 ? 'inline' : 'none';
    }

    // Render Pending List
    function renderPendingList() {
      const container = document.getElementById('pendingList');
      
      if (pendingApplications.length === 0) {
        renderEmptyState('pending', '🎉', '未処理の申請はありません');
        return;
      }

      container.innerHTML = pendingApplications.map(app => createApplicationCard(app, false)).join('');
    }

    // Render History List
    function renderHistoryList() {
      const container = document.getElementById('historyList');
      
      if (approvedApplications.length === 0) {
        renderEmptyState('history', '📭', '受理済みの申請はありません');
        return;
      }

      container.innerHTML = approvedApplications.map(app => createApplicationCard(app, true)).join('');
    }

    // Create Application Card HTML
    function createApplicationCard(app, isApproved) {
      const children = [];
      if (app.child1Name) {
        children.push({ name: app.child1Name, grade: app.child1Grade });
      }
      if (app.child2Name) {
        children.push({ name: app.child2Name, grade: app.child2Grade });
      }

      const parents = [];
      if (app.parent1Name) {
        parents.push({ name: app.parent1Name, age: app.parent1Age, insurance: app.insurance1 });
      }
      if (app.parent2Name) {
        parents.push({ name: app.parent2Name, age: app.parent2Age, insurance: app.insurance2 });
      }

      const childrenHtml = children.map((child, i) => `
        <div class="info-row">
          <span class="info-label">お子様${i + 1}</span>
          <span class="info-value">${escapeHtml(child.name)}（${escapeHtml(child.grade)}）</span>
        </div>
      `).join('');

      const parentsHtml = parents.map((parent, i) => `
        <div class="info-row">
          <span class="info-label">保護者${i + 1}</span>
          <span class="info-value">${escapeHtml(parent.name)}（${parent.age}歳）</span>
        </div>
        ${parent.insurance ? `
        <div class="info-row">
          <span class="info-label">スポーツ保険</span>
          <span class="insurance-tag ${parent.insurance === '加入する' ? '' : 'no'}">${escapeHtml(parent.insurance)}</span>
        </div>
        ` : ''}
      `).join('');

      const approveBtn = isApproved ? '' : `
        <div class="approve-section">
          <button class="approve-btn" onclick="confirmApprove(${app.row}, '${escapeHtml(children.map(c => c.name).join('・'))}', '${escapeHtml(app.parent1Name)}')">
            ✓ 入部を受理する
          </button>
        </div>
      `;

      const statusBadge = isApproved 
        ? `<span class="status-badge">✓ 受理済</span>`
        : `<span class="status-badge">📋 審査中</span>`;

      const approvedDateHtml = isApproved && app.approvedDate ? `
        <div class="approved-date">
          <span>📅</span>
          <span>受理日: ${escapeHtml(app.approvedDate)}</span>
        </div>
      ` : '';

      return `
        <div class="application-card">
          <div class="card-header ${isApproved ? 'approved' : ''}">
            <div>
              <div class="applicant-name">${escapeHtml(children.map(c => c.name).join('・'))}</div>
              <div class="apply-date">
                <span>📝</span>
                <span>${formatDate(app.timestamp)}</span>
              </div>
              ${approvedDateHtml}
            </div>
            ${statusBadge}
          </div>
          <div class="card-body">
            <div class="info-section">
              <div class="section-title">👦 お子様情報</div>
              ${childrenHtml}
            </div>
            <div class="info-section">
              <div class="section-title">👤 保護者情報</div>
              ${parentsHtml}
            </div>
            <div class="info-section">
              <div class="section-title">📧 連絡先</div>
              <div class="info-row">
                <span class="info-value email">${escapeHtml(app.email)}</span>
              </div>
            </div>
          </div>
          ${approveBtn}
        </div>
      `;
    }

    // Render Empty State
    function renderEmptyState(tab, icon, message) {
      const containerId = tab === 'pending' ? 'pendingList' : 'historyList';
      document.getElementById(containerId).innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">${icon}</div>
          <div class="empty-state-text">${message}</div>
        </div>
      `;
    }

    // Confirm Approve Modal
    let pendingApprovalRow = null;

    function confirmApprove(row, childName, parentName) {
      pendingApprovalRow = row;
      document.getElementById('modalMessage').innerHTML = `
        <span class="highlight-name">${escapeHtml(childName)}</span> さんの入部申請を受理します。<br>
        保護者（${escapeHtml(parentName)}様）に受理メールが送信されます。
      `;
      document.getElementById('confirmModal').classList.add('show');
      document.getElementById('modalConfirmBtn').onclick = () => approveApplication(row);
    }

    function closeModal() {
      document.getElementById('confirmModal').classList.remove('show');
      pendingApprovalRow = null;
    }

    // Approve Application
    async function approveApplication(row) {
      closeModal();
      
      showLoading(true);

      try {
        const response = await fetch(`${GAS_URL}?action=approveApplication&row=${row}`);
        const data = await response.json();

        if (data.success) {
          showToast('🎉 入部を受理しました！', 'success');
          await loadApplications();
        } else {
          throw new Error(data.error || '受理処理に失敗しました');
        }
      } catch (error) {
        console.error('Error:', error);
        showToast('エラー: ' + error.message, 'error');
      } finally {
        showLoading(false);
      }
    }

    // Utilities
    function showLoading(show) {
      document.getElementById('loadingOverlay').classList.toggle('show', show);
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function formatDate(dateString) {
      if (!dateString) return '';
      try {
        const date = new Date(dateString);
        return date.toLocaleDateString('ja-JP', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch {
        return dateString;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
