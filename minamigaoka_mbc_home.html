<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南ヶ丘MBC - ミニバスケットボールクラブ</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange-bright: #FF6B35;
            --orange-dark: #E55A2B;
            --navy: #1A2744;
            --cream: #FFF8F0;
            --gold: #FFB347;
            --court-wood: #DEB887;
            --line-white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Basketball Court Background */
        .court-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(135deg, #DEB887 0%, #D2A679 50%, #C4956A 100%);
            z-index: -2;
        }

        .court-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 8px solid var(--line-white);
            border-radius: 50%;
        }

        .half-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 8px;
            height: 100%;
            background: var(--line-white);
            transform: translateX(-50%);
        }

        /* Header */
        .header {
            text-align: center;
            padding: 2rem 1rem 1rem;
            position: relative;
            perspective: 1100px;
        }

        .logo-container {
            display: inline-block;
            position: relative;
            transform-style: preserve-3d;
            animation: logoSpin 11s cubic-bezier(0.65, 0, 0.35, 1) 3.5s infinite;
        }

        /* Idle most of the cycle, then a fast horizontal 4-turn spin near the end */
        @keyframes logoSpin {
            0%, 90%  { transform: rotateY(0deg); }
            100%     { transform: rotateY(1440deg); }
        }

        /* Logo: smooth entry that flows directly into the 3D idle motion */
        .club-logo {
            max-width: 280px;
            width: 85%;
            height: auto;
            transform-style: preserve-3d;
            opacity: 0;
            animation:
                logoEntry 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                logoTilt  6s   ease-in-out 2.2s infinite,
                logoGlow  2.8s ease-in-out 2.2s infinite,
                logoPulse 2.8s ease-in-out 2.2s infinite;
            will-change: transform, filter;
        }

        /* Entry ends exactly at the rest pose of logoTilt (0% / 100%) for a seamless handoff */
        @keyframes logoEntry {
            0%   { opacity: 0; transform: scale(0.2)  rotateZ(-220deg); }
            55%  { opacity: 1; transform: scale(1.08) rotateZ(12deg); }
            80%  {              transform: scale(1.01) rotateZ(2deg)  rotateY(-6deg)  rotateX(2deg); }
            100% { opacity: 1; transform: scale(1)    rotateZ(-2deg) rotateY(-14deg) rotateX(4deg); }
        }

        @keyframes logoTilt {
            0%   { transform: scale(1) translateY(0)    rotateZ(-2deg) rotateY(-14deg) rotateX(4deg); }
            25%  { transform: scale(1) translateY(-8px) rotateZ(0deg)  rotateY(0deg)   rotateX(-2deg); }
            50%  { transform: scale(1) translateY(-12px) rotateZ(2deg) rotateY(14deg)  rotateX(4deg); }
            75%  { transform: scale(1) translateY(-8px) rotateZ(0deg)  rotateY(0deg)   rotateX(-2deg); }
            100% { transform: scale(1) translateY(0)    rotateZ(-2deg) rotateY(-14deg) rotateX(4deg); }
        }

        @keyframes logoGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 6px 14px rgba(0,0,0,0.18))
                    drop-shadow(0 0 8px rgba(255,107,53,0.35));
            }
            50% {
                filter:
                    drop-shadow(0 14px 28px rgba(0,0,0,0.22))
                    drop-shadow(0 0 22px rgba(255,140,80,0.85))
                    drop-shadow(0 0 40px rgba(255,179,71,0.55));
            }
        }

        @keyframes logoPulse {
            0%, 100% { scale: 1; }
            50%      { scale: 1.04; }
        }

        /* Shine sweep across the logo */
        .logo-container::after {
            content: '';
            position: absolute;
            inset: 6%;
            border-radius: 18px;
            background: linear-gradient(115deg,
                transparent 35%,
                rgba(255,255,255,0.55) 48%,
                rgba(255,255,255,0.85) 50%,
                rgba(255,255,255,0.55) 52%,
                transparent 65%);
            mix-blend-mode: screen;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-120%) skewX(-18deg);
            animation: logoShine 5.5s ease-in-out 2.8s infinite;
        }

        @keyframes logoShine {
            0%, 100% { transform: translateX(-120%) skewX(-18deg); opacity: 0; }
            45%      { opacity: 0; }
            55%      { opacity: 0.9; }
            85%      { transform: translateX(120%)  skewX(-18deg); opacity: 0; }
        }

        .logo-container:hover .club-logo {
            animation-play-state: paused;
            scale: 1.08;
            transition: scale 0.3s ease;
        }

        .club-name {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            font-weight: 700;
            color: var(--navy);
            margin-top: 1rem;
            text-shadow: 
                2px 2px 0 var(--orange-bright),
                4px 4px 0 rgba(0,0,0,0.1);
            letter-spacing: 0.05em;
        }

        /* Main Content */
        .main-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem 1.5rem 3rem;
        }

        .section-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
            width: 100%;
        }

/* App Cards */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .app-card {
            background: white;
            border-radius: 18px;
            padding: 1.2rem;
            text-decoration: none;
            color: var(--navy);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 8px 30px rgba(0,0,0,0.1),
                0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
        }

        .app-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--orange-bright);
            box-shadow: 
                0 15px 50px rgba(255, 107, 53, 0.25),
                0 8px 15px rgba(0,0,0,0.1);
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--orange-bright), var(--gold));
        }

        .app-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 0.8rem;
            position: relative;
        }

        .app-card:nth-child(1) .app-icon {
            background: linear-gradient(135deg, #4ECDC4, #6EE7DE);
            box-shadow: 0 6px 15px rgba(78, 205, 196, 0.3);
        }

        .app-card:nth-child(2) .app-icon {
            background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.3);
        }

        .app-card:nth-child(3) .app-icon {
            background: linear-gradient(135deg, #74B9FF, #A3D8FF);
            box-shadow: 0 6px 15px rgba(116, 185, 255, 0.3);
        }

        .app-card:nth-child(4) .app-icon {
            background: linear-gradient(135deg, #FFB347, #FFD280);
            box-shadow: 0 6px 15px rgba(255, 179, 71, 0.3);
        }

        .app-card:nth-child(5) .app-icon {
            background: linear-gradient(135deg, #A78BFA, #C4B5FD);
            box-shadow: 0 6px 15px rgba(167, 139, 250, 0.3);
        }

        .app-card:nth-child(6) .app-icon {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            box-shadow: 0 6px 15px rgba(255, 107, 53, 0.3);
        }

        .app-card:nth-child(7) .app-icon {
            background: linear-gradient(135deg, #00D9A5, #4FFFB0);
            box-shadow: 0 6px 15px rgba(0, 217, 165, 0.3);
        }

        .app-card:nth-child(8) .app-icon {
            background: linear-gradient(135deg, #FF4757, #FF6B81);
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.3);
        }

        .app-card:nth-child(9) .app-icon {
            background: linear-gradient(135deg, #5B8DEF, #7BA3F3);
            box-shadow: 0 6px 15px rgba(91, 141, 239, 0.3);
        }

        .app-name {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
            color: var(--navy);
        }

        .app-arrow {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            width: 32px;
            height: 32px;
            background: var(--cream);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .app-card:hover .app-arrow {
            background: var(--orange-bright);
            color: white;
            transform: translateX(4px);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--navy);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* Floating Basketballs (SVG inside) */
        .floating-ball {
            position: fixed;
            width: 64px;
            height: 64px;
            z-index: -1;
            opacity: 0.7;
            filter: drop-shadow(0 10px 14px rgba(0,0,0,0.25));
            animation: ballBounce 4s cubic-bezier(0.5,0,0.5,1) infinite;
            pointer-events: none;
        }

        .floating-ball svg {
            width: 100%;
            height: 100%;
            display: block;
            animation: ballSpin 5s linear infinite;
            transform-origin: 50% 50%;
        }

        /* All balls land around the "クラブアプリ" section title line */
        .floating-ball:nth-child(1) { top: 62%; left: 7%;  animation-delay: 0s; }
        .floating-ball:nth-child(1) svg { animation-delay: 0s; }

        .floating-ball:nth-child(2) { top: 44%; right: 10%; width: 46px; height: 46px; opacity: 0.6; animation-delay: -1.2s; }
        .floating-ball:nth-child(2) svg { animation-delay: -1.5s; animation-duration: 7s; animation-direction: reverse; }

        .floating-ball:nth-child(3) { top: 46%; left: 18%; width: 54px; height: 54px; opacity: 0.65; animation-delay: -2.4s; }
        .floating-ball:nth-child(3) svg { animation-delay: -3s; animation-duration: 6s; }

        @keyframes ballSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @keyframes ballBounce {
            0%   { transform: translateY(0)      scaleY(0.9)  scaleX(1.08); animation-timing-function: cubic-bezier(0.2, 0, 0.2, 1); }
            6%   { transform: translateY(-60px)  scaleY(1.05) scaleX(0.96); }
            45%  { transform: translateY(-220px) scaleY(1.08) scaleX(0.95); animation-timing-function: cubic-bezier(0.5, 0, 0.7, 1); }
            55%  { transform: translateY(-220px) scaleY(1.08) scaleX(0.95); animation-timing-function: cubic-bezier(0.3, 0, 0.8, 1); }
            94%  { transform: translateY(-60px)  scaleY(1.05) scaleX(0.96); }
            100% { transform: translateY(0)      scaleY(0.9)  scaleX(1.08); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header {
                padding: 1.5rem 1rem 0.5rem;
            }

            .club-logo {
                max-width: 220px;
            }

            .club-name {
                font-size: 1.6rem;
            }

.app-card {
                padding: 1rem;
            }

            .app-icon {
                width: 45px;
                height: 45px;
                font-size: 1.3rem;
            }

            .app-name {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="court-bg"></div>
    <div class="court-lines">
        <div class="center-circle"></div>
        <div class="half-line"></div>
    </div>
    
    <!-- Reusable basketball SVG symbol -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <radialGradient id="bballGrad" cx="35%" cy="30%" r="78%">
                <stop offset="0%"  stop-color="#FFE0BD"/>
                <stop offset="18%" stop-color="#FF9A52"/>
                <stop offset="60%" stop-color="#E55A2B"/>
                <stop offset="100%" stop-color="#7A2E0E"/>
            </radialGradient>
            <clipPath id="bballClip">
                <circle cx="50" cy="50" r="47.5"/>
            </clipPath>
            <symbol id="basketball" viewBox="0 0 100 100">
                <!-- Ball body -->
                <circle cx="50" cy="50" r="48" fill="url(#bballGrad)" stroke="#3a1a08" stroke-width="0.8"/>
                <!-- Seams clipped inside the ball circle -->
                <g clip-path="url(#bballClip)" fill="none" stroke="#2a1206" stroke-width="1.6" stroke-linecap="round">
                    <path d="M50 2 V98"/>
                    <path d="M3 50 Q50 64 97 50"/>
                    <path d="M16 12 Q40 50 16 88"/>
                    <path d="M84 12 Q60 50 84 88"/>
                </g>
                <!-- Specular highlight -->
                <ellipse cx="34" cy="26" rx="11" ry="6" fill="rgba(255,255,255,0.45)"/>
                <ellipse cx="30" cy="22" rx="4"  ry="2" fill="rgba(255,255,255,0.7)"/>
            </symbol>
        </defs>
    </svg>

    <div class="floating-ball"><svg><use href="#basketball"/></svg></div>
    <div class="floating-ball"><svg><use href="#basketball"/></svg></div>
    <div class="floating-ball"><svg><use href="#basketball"/></svg></div>

    <header class="header">

            <img src="logo.png" alt="南ヶ丘MBC" class="club-logo">
        </div>
        <h1 class="club-name">南ヶ丘MBC</h1>
    </header>

    <main class="main-content">
        <h2 class="section-title">クラブアプリ</h2>
        
        <div class="app-grid">
            <a href="https://upstartman.github.io/minamigaoka/minamigaoka_schedule.html" class="app-card">

            <a href="https://upstartman.github.io/minamigaoka/minamigaoka_gamerecord_2026.html" class="app-card">

                <div class="app-arrow">→</div>
            </a>

            <a href="https://upstartman.github.io/minamigaoka/minami-gym-guide.html" class="app-card">
                <div class="app-icon">🗺️</div>

                <div class="app-arrow">→</div>
            </a>

            <a href="https://youtube.com/playlist?list=PLpQLKhKt0bVLoiSRVxhRAupqsGNU4oTEK&si=ECAMsIb0jwLp05Xx" class="app-card" target="_blank">
                <div class="app-icon">🎬</div>
                <h3 class="app-name">試合動画（大会試合）</h3>
                <div class="app-arrow">→</div>
            </a>

            <a href="https://youtube.com/playlist?list=PLpQLKhKt0bVI2MNyjdWR_uOUzE9y9MecZ&si=clx78zRrUsrbDOpo" class="app-card" target="_blank">
                <div class="app-icon">🎥</div>
                <h3 class="app-name">試合動画（練習試合）</h3>
                <div class="app-arrow">→</div>
            </a>

            <a href="https://upstartman.github.io/minamigaoka/minamigaoka_bento_firebase.html" class="app-card">
                <div class="app-icon">🍱</div>

            </a>

            <a href="https://upstartman.github.io/minamigaoka/minamigaoka_meibo.html" class="app-card">
                <div class="app-icon">📒</div>

            </a>

            <a href="https://upstartman.github.io/minamigaoka/mbc_expense_app.html" class="app-card">

            </a>

            <a href="https://upstartman.github.io/minamigaoka/minibasket-scoresheet.html" class="app-card">
                <div class="app-icon">📋</div>
                <h3 class="app-name">スコアシート</h3>
                <div class="app-arrow">→</div>
            </a>

            <a href="https://upstartman.github.io/minamigaoka/shiori_app.html" class="app-card">
                <div class="app-icon">📖</div>

            </a>

            <a href="https://upstartman.github.io/minamigaoka/webrtc-live-stream.html" class="app-card">

            <a href="https://upstartman.github.io/minamigaoka/jitsi-launcher.html" class="app-card">

                <div class="app-arrow">→</div>
            </a>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 南ヶ丘MBC</p>
    </footer>
</body>
</html>
