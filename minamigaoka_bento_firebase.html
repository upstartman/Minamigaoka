<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南ヶ丘注文集計アプリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Color tokens (Deep Sky Blue background × バスケットボールアクセント) */
            --bg: #00BFFF;          /* ディープスカイブルー */
            --bg-soft: #38bdf8;     /* グラデ用 */
            --surface: #ffffff;
            --surface-2: #f0f9ff;   /* 淡いブルーの副サーフェス */
            --surface-3: #e0f2fe;   /* やや濃い淡ブルー */
            --border: #e2e8f0;      /* クールニュートラルなボーダー */
            --border-strong: #cbd5e1;

            --text: #0f172a;        /* 深いネイビー（読みやすさ重視） */
            --text-muted: #475569;
            --text-subtle: #94a3b8;

            /* メイン: ネイビー（青背景に映えるダークブルー） */
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --primary-soft: #dbeafe;
            --primary-soft-border: #bfdbfe;

            /* 成功: エメラルド */
            --success: #059669;
            --success-hover: #047857;
            --success-soft: #d1fae5;
            --success-soft-border: #a7f3d0;

            /* 危険: ヴィヴィッドレッド */
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --danger-soft: #fee2e2;
            --danger-soft-border: #fecaca;

            /* 警告: アンバー（緊急時） */
            --warning: #d97706;
            --warning-soft: #fef3c7;
            --warning-soft-border: #fde68a;

            /* 支払い対象: ヴィヴィッドパープル（集金済の緑と明確に区別） */
            --info: #7c3aed;
            --info-soft: #ede9fe;
            --info-soft-border: #ddd6fe;

            /* バスケットボールオレンジ（ヘッダー・モードトグル用、青の補色） */
            --basketball: #f97316;
            --basketball-deep: #ea580c;
            --basketball-soft: #ffedd5;
            --basketball-soft-border: #fed7aa;

            /* サブアクセント: ユーザー別ローテーション（はっきりした6色、青背景でも識別） */
            --accent-1: #ea580c; /* オレンジ */
            --accent-2: #facc15; /* イエロー */
            --accent-3: #16a34a; /* 緑 */
            --accent-4: #9333ea; /* 紫 */
            --accent-5: #db2777; /* マゼンタ */
            --accent-6: #0d9488; /* ティール */

            /* Radius */
            --r-sm: 6px;
            --r: 10px;
            --r-lg: 14px;

            /* Shadow（ブルー背景に映えるよう少し強め＆青みを帯びた影） */
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow: 0 4px 14px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.06);

            /* Type */
            --font-sans: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-sans);
            font-feature-settings: "palt" 1;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            padding: 14px 12px;
            line-height: 1.55;
            letter-spacing: 0.01em;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .header {
            background: #ffffff;
            padding: 14px 16px;
            margin-bottom: 16px;
            text-align: center;
            border: 1px solid var(--basketball-soft-border);
            border-radius: var(--r);
            box-shadow: var(--shadow-sm);
        }

        .header h1 {
            color: var(--text);
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .mode-selector {
            display: inline-flex;
            gap: 4px;
            padding: 3px;
            background: var(--surface-2);
            border: 1px solid var(--basketball-soft-border);
            border-radius: var(--r);
        }

        .mode-btn {
            padding: 7px 16px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .mode-btn:hover {
            color: var(--basketball-deep);
            background: var(--basketball-soft);
        }

        .mode-btn.active {
            background: var(--basketball);
            color: #fff;
            box-shadow: 0 2px 4px rgba(249,115,22,0.35);
        }
        .mode-btn.active:hover {
            background: var(--basketball-deep);
            color: #fff;
        }

        .content {
            box-shadow: var(--shadow);
        }

        .content {
            background: var(--surface);
            padding: 16px 14px;
            border-radius: var(--r);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        h2 {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 14px;
            color: var(--text);
        }

        h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text);
            font-weight: 500;
            font-size: 0.85rem;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group input[type="datetime-local"],
        .form-group input[type="number"],
        .form-group input[type="password"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            background: var(--surface);
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-subtle);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .menu-items {
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 14px;
            margin-bottom: 12px;
            background: var(--surface-2);
        }

        .menu-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .menu-item:last-child {
            margin-bottom: 0;
        }

        .menu-item input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            font-family: inherit;
            font-size: 0.9rem;
            background: var(--surface);
            color: var(--text);
        }

        .menu-item input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .menu-item button {
            padding: 6px 12px;
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger-soft-border);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: background 0.15s;
        }
        .menu-item button:hover {
            background: var(--danger-soft);
        }

        .btn {
            padding: 8px 14px;
            background: var(--primary);
            color: #fff;
            border: 1px solid var(--primary);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.4;
            transition: background 0.15s, border-color 0.15s, transform 0.05s;
        }

        .btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .btn:active { transform: translateY(1px); }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border-strong);
        }
        .btn-secondary:hover {
            background: var(--surface-2);
            border-color: var(--text-subtle);
        }

        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger-hover);
            border-color: var(--danger-hover);
        }

        .btn-success {
            background: var(--success);
            border-color: var(--success);
        }
        .btn-success:hover {
            background: #15803d;
            border-color: #15803d;
        }

        .order-list {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        .order-card {
            position: relative;
            border: 1px solid var(--border);
            border-left: 3px solid var(--success);
            border-radius: var(--r-sm);
            padding: 12px 12px 12px 14px;
            background: var(--surface);
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.05s;
            cursor: pointer;
        }

        .order-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-sm);
            background: var(--surface-2);
        }
        .order-card:active { transform: translateY(1px); }

        /* 締切済カードはトーンを落とす */
        .order-card.is-closed {
            border-left-color: var(--text-subtle);
            background: var(--surface-2);
        }
        .order-card.is-closed:hover {
            background: var(--surface-3);
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .order-date {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .status-badge {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .status-open {
            background: var(--success-soft);
            color: #406527;
            border-color: var(--success-soft-border);
        }

        .status-closed {
            background: var(--surface-3);
            color: var(--text-subtle);
            border-color: var(--border-strong);
        }

        /* 集金済 / 支払済 = 完了は緑で統一（4状態を直感的に） */
        .user-order.paid {
            background: var(--success-soft);
            border: 1px solid var(--success-soft-border);
            border-left: 3px solid var(--success);
        }

        .user-order.paid h4 {
            background: var(--success);
        }

        .user-order.paid h4::after {
            content: ' ✓ 集金済';
            color: white;
            font-size: 0.78rem;
            margin-left: 8px;
            opacity: 0.95;
        }

        /* 支払い対象（負の金額）= 未済はニュートラル背景、識別は名前バッジ色で */
        .user-order.payment-target {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--info);
        }

        .user-order.payment-target h4 {
            background: var(--info);
        }

        /* 支払い済（payment-target.paid）= 完了なので緑に上書き */
        .user-order.payment-target.paid {
            background: var(--success-soft);
            border: 1px solid var(--success-soft-border);
            border-left: 3px solid var(--success);
        }

        .user-order.payment-target.paid h4 {
            background: var(--success);
        }

        .user-order.payment-target.paid h4::after {
            content: ' ✓ 支払済';
        }

        .btn-paid {
            background: var(--success);
            border-color: var(--success);
            font-size: 0.8rem;
            padding: 6px 12px;
            margin-left: 8px;
        }
        .btn-paid:hover {
            background: #15803d;
            border-color: #15803d;
        }

        .btn-unpaid {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border-strong);
            font-size: 0.8rem;
            padding: 6px 12px;
            margin-left: 8px;
        }
        .btn-unpaid:hover {
            background: var(--surface-2);
            border-color: var(--text-subtle);
        }

        .user-order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .user-order-header h4 {
            margin: 0;
        }

        .order-card-body {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .order-card-summary {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            padding: 8px 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }
        .order-card-summary span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .order-form-container {
            margin-top: 16px;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.95rem;
        }

        .order-table th,
        .order-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .order-table th {
            background: var(--surface-2);
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .order-table input[type="number"] {
            width: 80px;
            padding: 6px 8px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            font-family: inherit;
            font-size: 0.9rem;
        }
        .order-table input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .buttons-container {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-subtle);
            font-size: 0.95rem;
        }

        .success {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid var(--success-soft-border);
            padding: 12px 14px;
            border-radius: var(--r-sm);
            margin: 12px 0;
            font-size: 0.9rem;
        }

        .error {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid var(--danger-soft-border);
            padding: 12px 14px;
            border-radius: var(--r-sm);
            margin: 12px 0;
            font-size: 0.9rem;
        }

        .summary-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .summary-section h3 {
            margin-bottom: 12px;
        }

        .user-order-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        /* 既定（集金未済）: 背景はニュートラルで控えめに、識別は名前バッジ色で */
        .user-order {
            background: var(--surface);
            padding: 12px 14px;
            border-radius: var(--r-sm);
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--warning);
        }

        .user-order h4 {
            margin-bottom: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 5px 12px;
            background: var(--warning);
            color: #fff;
            border-radius: var(--r-sm);
            display: inline-block;
            letter-spacing: 0.01em;
        }

        .user-order ul {
            list-style: none;
            padding-left: 0;
        }

        .user-order li {
            padding: 4px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 18px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.875rem;
            transition: color 0.15s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .admin-actions {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }

        .admin-actions button {
            font-size: 0.85rem;
            padding: 6px 12px;
        }

        /* 注文詳細サマリー */
        .order-summary-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: var(--surface-2);
            border: 1px solid var(--basketball-soft-border);
            border-radius: var(--r-sm);
            padding: 12px 14px;
            margin: 10px 0 14px;
        }
        .order-summary-header .stat {
            min-width: 56px;
        }
        .order-summary-header .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        /* 数値ごとにはっきりした色分け */
        .order-summary-header .stat:nth-of-type(1) .stat-value { color: var(--success); }       /* 注文人数 = 緑 */
        .order-summary-header .stat:nth-of-type(2) .stat-value { color: var(--basketball-deep); } /* 合計数量 = オレンジ */
        .order-summary-header .stat:nth-of-type(3) .stat-value { color: var(--primary); }       /* 合計金額 = ネイビー */

        .order-summary-header .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.02em;
            font-weight: 500;
        }
        .order-summary-header .stat-divider {
            width: 1px;
            height: 36px;
            background: var(--basketball-soft-border);
        }
        .order-summary-header .stat-status {
            margin-left: auto;
        }

        /* 再オープンフォーム */
        .reopen-card {
            border: 1px solid var(--success-soft-border);
            background: var(--success-soft);
            border-radius: var(--r);
            padding: 16px 18px;
            margin: 12px 0;
        }
        .reopen-card h3 {
            margin: 0 0 6px;
            color: var(--text);
        }
        .reopen-card .reopen-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* 締切バッジ用 共通サポート（インラインのfallback） */
        .deadline-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 8px;
        }
        .deadline-pill.urgent {
            background: var(--warning-soft);
            color: var(--warning);
            border-color: var(--warning-soft-border);
        }
        .deadline-pill.soon {
            background: #fff7ed;
            color: #c2410c;
            border-color: #fed7aa;
        }
        .deadline-pill.normal {
            background: var(--success-soft);
            color: var(--success);
            border-color: var(--success-soft-border);
        }
        .deadline-pill.closed {
            background: var(--surface-2);
            color: var(--text-subtle);
            border-color: var(--border);
        }
        .deadline-pill .deadline-remain {
            font-weight: 400;
            opacity: 0.85;
            font-size: 0.78rem;
        }

        .deadline-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-muted);
            border-radius: var(--r);
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 500;
            margin: 10px 0 14px;
        }
        .deadline-banner.urgent {
            background: var(--warning-soft);
            color: var(--warning);
            border-color: var(--warning-soft-border);
        }
        .deadline-banner.soon {
            background: #fff7ed;
            color: #c2410c;
            border-color: #fed7aa;
        }
        .deadline-banner.normal {
            background: var(--success-soft);
            color: var(--success);
            border-color: var(--success-soft-border);
        }
        .deadline-banner.closed {
            background: var(--surface-2);
            color: var(--text-subtle);
            border-color: var(--border);
        }
        .deadline-banner .deadline-remain {
            font-weight: 400;
            opacity: 0.85;
            font-size: 0.85rem;
        }

        /* 集金サマリー */
        .payment-summary {
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: var(--r-sm);
            margin-bottom: 14px;
            font-size: 0.9rem;
        }
        .payment-summary p {
            margin: 4px 0;
            color: var(--text-muted);
        }
        .payment-summary p strong { color: var(--text); font-weight: 500; }

        /* メンバー選択モーダル */
        .modal-overlay {

    <script type="module">
        // Import the functions you need from the SDKs you need

        // Your web app's Firebase configuration
        const firebaseConfig = {

            authDomain: "minamigaoka-bento.firebaseapp.com",
            projectId: "minamigaoka-bento",
            storageBucket: "minamigaoka-bento.firebasestorage.app",

        // 名簿アプリ Firebase 接続（集金画面のメンバー選択用）
        const meiboFirebaseConfig = {
            apiKey: "AIzaSyACgA83z7xBWICIFLUK1_AwDFL9_EXRJW8",
            authDomain: "minamigaoka-meibo.firebaseapp.com",
            projectId: "minamigaoka-meibo",
            storageBucket: "minamigaoka-meibo.firebasestorage.app",

        };
        const meiboApp = initializeApp(meiboFirebaseConfig, 'meiboApp');

        let currentMode = 'user';

        let meiboMembersCache = null; // 名簿メンバーキャッシュ
        let memberSelectionState = []; // モーダルでの選択状態

        // UUID生成
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // 日付をそのまま返す
        function formatDate(dateString) {
            return dateString || '';
        }

        // ======================================
        // 締切日時 ヘルパー
        // ======================================

        // Date → "YYYY-MM-DDTHH:mm" (datetime-local 入力用、ローカルタイム)
        function formatLocalDateTime(d) {
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // 注文日の前日17時を "YYYY-MM-DDTHH:mm" で返す（注文ページ用プリセット）
        function defaultDeadlineFromOrderDate(orderDateStr) {
            if (!orderDateStr) return '';
            const parts = orderDateStr.split('-');
            if (parts.length !== 3) return '';
            const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            d.setDate(d.getDate() - 1);
            d.setHours(17, 0, 0, 0);
            return formatLocalDateTime(d);
        }

        // 当日17時を "YYYY-MM-DDTHH:mm" で返す（集金ページ用プリセット）
        function defaultDeadlineFromCollectionDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return '';
            const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            d.setHours(17, 0, 0, 0);
            return formatLocalDateTime(d);
        }

        // Firestore Timestamp → "YYYY-MM-DDTHH:mm"
        function deadlineToInputValue(deadline) {
            if (!deadline) return '';
            const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
            return formatLocalDateTime(d);
        }

        // "YYYY-MM-DDTHH:mm" → Firestore Timestamp (空なら null)
        function inputValueToDeadline(s) {
            if (!s) return null;
            const d = new Date(s);
            if (isNaN(d.getTime())) return null;
            return Timestamp.fromDate(d);
        }

        // 締切日時が過去かどうか
        function isDeadlinePassed(deadline) {
            if (!deadline) return false;
            const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
            return d.getTime() <= Date.now();
        }

        // 実効ステータス: 手動 closed か締切超過なら closed
        function effectiveStatus(orderPage) {
            if (orderPage.status === 'closed') return 'closed';
            if (isDeadlinePassed(orderPage.deadline)) return 'closed';
            return 'open';
        }

        // 締切表示用 "2026-05-01 17:00"
        function formatDeadlineText(deadline) {
            if (!deadline) return '';
            const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // 残り時間テキスト
        function remainingTimeText(deadline) {
            if (!deadline) return '';
            const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
            const diffMs = d.getTime() - Date.now();
            if (diffMs <= 0) return '締切を過ぎています';
            const totalMin = Math.floor(diffMs / 60000);
            const days = Math.floor(totalMin / (60 * 24));
            const hours = Math.floor((totalMin % (60 * 24)) / 60);
            const mins = totalMin % 60;
            if (days > 0) return `締切まで残り ${days}日 ${hours}時間`;
            if (hours > 0) return `締切まで残り ${hours}時間 ${mins}分`;
            return `締切まで残り ${mins}分`;
        }

        // 入力中の文字列値からヒント表示
        function deadlineHintHtml(deadlineStr) {
            if (!deadlineStr) return '<span style="color:var(--text-subtle);">未設定の場合は締切なし（無期限）になります</span>';
            const d = new Date(deadlineStr);
            if (isNaN(d.getTime())) return '';
            const diffMs = d.getTime() - Date.now();
            if (diffMs <= 0) return '<span style="color:var(--danger);">⚠ 過去の日時です。このまま登録すると即座に締切扱いになります</span>';
            return `<span style="color:var(--success);">${remainingTimeText({ toDate: () => d })}</span>`;
        }

        // 緊急度クラス決定
        function deadlineUrgencyClass(deadline, eff) {
            if (!deadline) return '';
            if (eff !== 'open') return 'closed';
            const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
            const diffMs = d.getTime() - Date.now();
            const oneHour = 60 * 60 * 1000;
            if (diffMs <= 2 * oneHour) return 'urgent';
            if (diffMs <= 24 * oneHour) return 'soon';
            return 'normal';
        }

        // 締切バッジHTML（一覧カード用）
        function deadlineBadgeHtml(deadline, eff) {
            if (!deadline) return '';
            const cls = deadlineUrgencyClass(deadline, eff);
            const dateText = formatDeadlineText(deadline);
            const icon = cls === 'urgent' ? '🔥' : cls === 'soon' ? '⏰' : '⏱';
            const remain = eff === 'open' ? `<span class="deadline-remain">（${remainingTimeText(deadline)}）</span>` : '';
            return `<div class="deadline-pill ${cls}">${icon} 締切: ${dateText}${remain}</div>`;
        }

        // 締切バナーHTML（詳細画面用、より大きく）
        function deadlineBadgeLargeHtml(deadline, eff) {
            if (!deadline) return '';
            const cls = deadlineUrgencyClass(deadline, eff);
            const dateText = formatDeadlineText(deadline);
            const icon = cls === 'urgent' ? '🔥' : cls === 'soon' ? '⏰' : '⏱';
            const remain = eff === 'open'
                ? `<span class="deadline-remain">（${remainingTimeText(deadline)}）</span>`
                : `<span class="deadline-remain">（締切済）</span>`;
            return `<div class="deadline-banner ${cls}">${icon} 締切: ${dateText}${remain}</div>`;
        }

        // 締切自動更新（best-effort: closed への書き戻し）
        function autoCloseIfPast(orderId, data) {
            if (data.status === 'open' && isDeadlinePassed(data.deadline)) {
                updateDoc(doc(db, 'orderPages', orderId), { status: 'closed' }).catch(() => {});

            // セクションの表示切り替え
            document.getElementById('userMode').classList.remove('active');

                document.getElementById('userMode').classList.add('active');
                showOrderList();

                document.getElementById('adminMode').classList.add('active');
                showOrderManagement();
            } else if (mode === 'collection') {
                if (collectionRoot) collectionRoot.classList.add('active');
                showCollectionList();
            }
        };

        // 学年計算（age → 学年文字列）
        function ageToGrade(age) {
            if (age == null) return '';
            const a = Number(age);
            if (isNaN(a)) return '';
            // 部員＝小学生想定: 6歳=小1 ... 12歳=小6
            if (a >= 6 && a <= 12) return `小${a - 5}`;
            if (a >= 13 && a <= 15) return `中${a - 12}`;
            if (a >= 16 && a <= 18) return `高${a - 15}`;
            if (a >= 0 && a <= 5) return '未就学';
            return '';
        }

        // 集金ページを家族単位に集約（targets / familyEntries の両方に対応）
        function aggregateCollectionByFamily(page) {
            // 清算インポート由来: familyEntries をそのまま使う
            if (page.source === 'expense-import' && Array.isArray(page.familyEntries) && page.familyEntries.length > 0) {
                return page.familyEntries.map(fe => ({
                    familyId: fe.familyId,
                    familyName: fe.familyName,
                    members: (fe.members || []).map(m => ({
                        name: m.name,
                        amount: m.amount
                    })),
                    totalAmount: fe.totalAmount != null
                        ? fe.totalAmount
                        : (fe.members || []).reduce((s, m) => s + (m.amount || 0), 0)
                }));
            }
            // 手動作成: targets を familyId でグルーピング、各家族の合計 = メンバー数 × menus価格合計
            const itemTotal = (page.menus || []).reduce((s, m) => s + (Number(m.price) || 0), 0);
            const grouped = {};
            (page.targets || []).forEach(t => {
                const fid = t.familyId || 'unknown';
                if (!grouped[fid]) {
                    grouped[fid] = {
                        familyId: fid,
                        familyName: t.familyName || '',
                        members: [],
                        totalAmount: 0
                    };
                }
                grouped[fid].members.push({ name: t.name, amount: itemTotal });
                grouped[fid].totalAmount += itemTotal;
            });
            return Object.values(grouped);
        }

        // 注文送信
        async function submitOrderAPI(params) {
            try {
                const orderId = params.orderId;
                const userName = params.userName;
                const orderItems = params.orderItems;

                // 注文ページの状態確認
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                
                if (!orderPageDoc.exists()) {
                    return { success: false, message: 'Order page not found' };
                }

                const orderPageData = orderPageDoc.data();
                if (orderPageData.status === 'closed') {
                    return { success: false, message: 'この注文は締め切られているため変更できません' };
                }
                if (isDeadlinePassed(orderPageData.deadline)) {
                    updateDoc(doc(db, 'orderPages', orderId), { status: 'closed' }).catch(() => {});
                    return { success: false, message: '締切日時を過ぎているため注文できません' };
                }

                // 既存の注文を削除
                const existingOrdersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId),
                    where('userName', '==', userName)
                );
                const existingOrdersSnapshot = await getDocs(existingOrdersQuery);
                
                const deletePromises = [];
                existingOrdersSnapshot.forEach((docSnap) => {
                    deletePromises.push(deleteDoc(doc(db, 'orders', docSnap.id)));
                });
                await Promise.all(deletePromises);

                // 新しい注文を追加
                const addPromises = [];
                for (let item of orderItems) {
                    if (item.quantity > 0) {
                        addPromises.push(addDoc(collection(db, 'orders'), {
                            orderId: orderId,
                            orderDate: orderPageData.orderDate,
                            menuName: item.menuName,
                            price: item.price,
                            userName: userName,
                            quantity: item.quantity,
                            timestamp: Timestamp.now()
                        }));
                    }
                }
                await Promise.all(addPromises);

                return { success: true, message: 'Order submitted successfully' };
            } catch (error) {
                console.error('submitOrder error:', error);
                return { success: false, message: error.toString() };
            }
        }

            try {
                const orderId = params.orderId;

                // 注文ページを取得
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                
                if (!orderPageDoc.exists()) {
                    return { success: false, message: 'Order page not found' };
                }

                const orderPageData = orderPageDoc.data();
                autoCloseIfPast(orderId, orderPageData);
                const orderPage = {
                    orderId: orderId,
                    orderDate: orderPageData.orderDate,
                    shopName: orderPageData.shopName || '',
                    memo: orderPageData.memo || '',
                    deadline: orderPageData.deadline || null,
                    menus: orderPageData.menus || [],
                    status: orderPageData.status,
                    paidUsers: orderPageData.paidUsers || []
                };

                // 注文データを取得
                const ordersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId)
                );
                const ordersSnapshot = await getDocs(ordersQuery);

                const menuSummary = {};
                const userOrders = {};
                let totalAmount = 0;

                // 項目ごとの集計初期化
                for (let menu of orderPage.menus) {
                    menuSummary[menu.name] = {
                        menuName: menu.name,
                        price: menu.price,
                        totalQuantity: 0,
                        totalAmount: 0
                    };
                }

                // 注文データを集計
                ordersSnapshot.forEach((doc) => {
                    const data = doc.data();
                    const menuName = data.menuName;
                    const price = data.price;
                    const userName = data.userName;
                    const quantity = data.quantity;

                    // 項目別集計
                    if (menuSummary[menuName]) {
                        menuSummary[menuName].totalQuantity += quantity;
                        menuSummary[menuName].totalAmount += price * quantity;
                    }

                    // ユーザー別集計
                    if (!userOrders[userName]) {
                        userOrders[userName] = [];
                    }
                    userOrders[userName].push({
                        menuName: menuName,
                        price: price,
                        quantity: quantity,
                        amount: price * quantity
                    });

                    totalAmount += price * quantity;
                });

                return { 
                    success: true, 
                    message: 'Order summary retrieved',
                    data: {
                        orderPage: orderPage,
                        menuSummary: Object.values(menuSummary),
                        userOrders: userOrders,
                        totalAmount: totalAmount

                    container.innerHTML = '<p>現在注文可能な内容はありません。</p>';

                // サマリー用の計算を先に行う

                let html = `
                    <h2>${formattedDate}${shopInfo}の注文詳細</h2>
                    <div class="order-summary-header">
                        <div class="stat">
                            <div class="stat-value">${totalUsers}</div>
                            <div class="stat-label">注文人数</div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat">
                            <div class="stat-value">${totalQuantity}</div>
                            <div class="stat-label">合計数量</div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat">
                            <div class="stat-value">¥${totalAmount.toLocaleString()}</div>
                            <div class="stat-label">合計金額</div>
                        </div>
                        <div class="stat-status">
                            <span class="status-badge ${effectiveStatus(orderPage) === 'open' ? 'status-open' : 'status-closed'}">${effectiveStatus(orderPage) === 'open' ? '受付中' : '締切済'}</span>
                        </div>
                    </div>
                `;

                if (orderPage.deadline) {
                    html += deadlineBadgeLargeHtml(orderPage.deadline, effectiveStatus(orderPage));

                if (effectiveStatus(orderPage) === 'open') {

                } else {
                    html += `
                        <div id="reopenSection">
                            <button class="btn btn-success" onclick="showReopenForm()">締切を取り消す（受付中に戻す）</button>
                        </div>
                    `;
                }
                
                // 項目別集計
                html += `
                    <div class="summary-section">
                        <h3>項目別集計</h3>
                        <table class="order-table">
                            <thead>
                                <tr>
                                    <th>項目</th>
                                    <th>単価</th>
                                    <th>数量</th>
                                    <th>小計</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                menuSummary.forEach(menu => {
                    const priceDisplay = menu.price < 0 
                        ? `<span style="color: #17a2b8;">-¥${Math.abs(menu.price).toLocaleString()}</span>`
                        : `¥${menu.price.toLocaleString()}`;
                    const totalDisplay = menu.totalAmount < 0 
                        ? `<span style="color: #17a2b8;">-¥${Math.abs(menu.totalAmount).toLocaleString()}</span>`
                        : `¥${menu.totalAmount.toLocaleString()}`;
                    html += `
                        <tr>

                            <td>${menu.totalQuantity}</td>
                            <td>${totalDisplay}</td>
                        </tr>
                    `;

                html += `
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th colspan="2">合計</th>
                                    <th>${totalQuantity}</th>
                                    <th>¥${totalAmount.toLocaleString()}</th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;
                
                // ユーザー別注文
                const paidUsers = orderPage.paidUsers || [];
                const paidCount = Object.keys(userOrders).filter(u => paidUsers.includes(u)).length;
                
                // 未集金・未支払の合計金額を計算
                let unpaidCollectAmount = 0;  // 未集金額（正の金額）
                let unpaidPaymentAmount = 0;  // 未支払額（負の金額）
                for (let userName in userOrders) {
                    if (!paidUsers.includes(userName)) {
                        let userTotal = 0;
                        userOrders[userName].forEach(order => {
                            userTotal += order.amount;
                        });
                        if (userTotal > 0) {
                            unpaidCollectAmount += userTotal;
                        } else {
                            unpaidPaymentAmount += Math.abs(userTotal);
                        }
                    }
                }
                
                let paymentSummaryHtml = `<p><strong>完了状況:</strong> ${paidCount} / ${totalUsers} 人</p>`;
                if (unpaidCollectAmount > 0) {
                    paymentSummaryHtml += `<p><strong>未集金額:</strong> <span style="color: var(--danger);">¥${unpaidCollectAmount.toLocaleString()}</span></p>`;
                }
                if (unpaidPaymentAmount > 0) {
                    paymentSummaryHtml += `<p><strong>未支払額:</strong> <span style="color: var(--info);">¥${unpaidPaymentAmount.toLocaleString()}</span></p>`;
                }
                if (unpaidCollectAmount === 0 && unpaidPaymentAmount === 0 && totalUsers > 0) {
                    paymentSummaryHtml += `<p style="color: var(--success);"><strong>✅ 全員完了！</strong></p>`;

                html += `

                for (let userName in userOrders) {
                    const orders = userOrders[userName];
                    let userTotal = 0;
                    orders.forEach(order => userTotal += order.amount);
                    
                    const isPaid = paidUsers.includes(userName);
                    const escapedUserName = userName.replace(/'/g, "\\'");
                    const isPayment = userTotal < 0; // 負の金額=支払い対象
                    
                    // 支払い対象者用のスタイル
                    let cardClass = isPaid ? 'paid' : '';
                    if (isPayment) cardClass += ' payment-target';
                    
                    // ボタンラベルを集金/支払いで切り替え
                    const paidLabel = isPayment ? '支払済みにする' : '集金済みにする';
                    const unpaidLabel = isPayment ? '未支払に戻す' : '未集金に戻す';
                    
                    html += `
                        <div class="user-order ${cardClass}">
                            <div class="user-order-header">
                                <h4>${userName}${isPayment ? ' <span class="payment-tag">支払</span>' : ''}</h4>
                                ${isPaid 
                                    ? `<button class="btn btn-unpaid" onclick="togglePaymentStatus('${escapedUserName}', false)">${unpaidLabel}</button>`
                                    : `<button class="btn btn-paid" onclick="togglePaymentStatus('${escapedUserName}', true)">${paidLabel}</button>`
                                }
                            </div>
                            <ul>
                    `;
                    
                    orders.forEach(order => {
                        const amountDisplay = order.amount < 0 
                            ? `<span style="color: var(--info);">-¥${Math.abs(order.amount).toLocaleString()}</span>`
                            : `¥${order.amount.toLocaleString()}`;
                        html += `<li>${order.menuName} × ${order.quantity} = ${amountDisplay}</li>`;

                        ? `<span style="color: var(--info);">-¥${Math.abs(userTotal).toLocaleString()}</span>（支払い）`
                        : `¥${userTotal.toLocaleString()}`;
                    
                    html += `

                    `;

            // デフォルト値: 現在時刻 + 1時間

            if (deadlineStr) {
                const d = new Date(deadlineStr);

                    alert('締切日時が過去です。未来の日時を指定するか、空欄（無期限）にしてください。');
                    return;

                select.innerHTML = '<option value="">-- 新規作成 --</option>';

                    const shopInfo = order.shopName ? ` - ${order.shopName}` : '';

                    <summary style="cursor:pointer; font-size:0.85rem; color:var(--text-muted);">⏰ 締切日時を変更</summary>
                    <div class="form-group" style="margin-top:8px;">
                        <input type="datetime-local" id="detailDeadlineEdit" value="${deadlineToInputValue(page.deadline)}">
                        <div class="buttons-container" style="margin-top:6px;">
                            <button class="btn" onclick="saveDetailDeadline()">保存</button>
                            <button class="btn btn-secondary" onclick="clearDetailDeadline()">締切なし</button>
                        </div>
                    </div>
                </details>
            `;

            if (eff === 'open') {
                html += '<button class="btn btn-success" onclick="completeCollection()">✓ 集金を完了する</button>';
            } else {
                html += `
                    <div id="reopenSection">
                        <button class="btn btn-secondary" onclick="reopenCollection()">完了を取り消す（受付中に戻す）</button>
                    </div>
                `;
            }

            // 項目別
            if (page.source === 'manual' && page.menus && page.menus.length > 0) {
                html += `<div class="summary-section"><h3>項目（一律で全員に適用）</h3><ul style="list-style:none; padding:0;">`;
                page.menus.forEach(m => {
                    html += `<li style="padding:4px 0; color:var(--text-muted); font-size:0.9rem;">・${escapeHtml(m.name)}: ¥${Number(m.price).toLocaleString()}</li>`;
                });
                html += `</ul></div>`;
            }

            // 家族別集金状況
            html += `<div class="user-order-section"><h3>家族別集金状況</h3>`;
            const paidFamilies = page.paidFamilies || [];
            if (totalPayment > 0) {
                html += `<div class="payment-summary"><p>💰 集金合計: <strong>¥${totalCollect.toLocaleString()}</strong> ／ 💸 支払合計: <strong style="color:var(--info);">¥${totalPayment.toLocaleString()}</strong></p></div>`;
            }

            families.forEach(fam => {
                const isPaid = paidFamilies.includes(fam.familyId);
                const isPayment = fam.totalAmount < 0;
                let cardClass = isPaid ? 'paid' : '';
                if (isPayment) cardClass += ' payment-target';
                const escFid = String(fam.familyId).replace(/'/g, "\\'");
                const escFname = String(fam.familyName || '').replace(/'/g, "\\'");
                const actionLabel = isPaid
                    ? (isPayment ? '未支払に戻す' : '未集金に戻す')
                    : (isPayment ? '支払済みにする' : '集金済みにする');
                const actionClass = isPaid ? 'btn-unpaid' : 'btn-paid';
                const memberLines = fam.members.map(m => {
                    const amt = m.amount < 0
                        ? `<span style="color:var(--info);">-¥${Math.abs(m.amount).toLocaleString()}</span>`
                        : `¥${Number(m.amount).toLocaleString()}`;
                    return `<li>${escapeHtml(m.name)}: ${amt}</li>`;
                }).join('');
                const totalLine = fam.totalAmount < 0
                    ? `<span style="color:var(--info);">-¥${Math.abs(fam.totalAmount).toLocaleString()}</span>（支払い）`
                    : `¥${fam.totalAmount.toLocaleString()}`;

                html += `
                    <div class="user-order ${cardClass}">
                        <div class="user-order-header">
                            <h4>${escapeHtml(fam.familyName)}家${isPayment ? ' <span class="payment-tag">支払</span>' : ''}</h4>
                            <button class="btn ${actionClass}" onclick="toggleCollectionPaidFamily('${escFid}', ${!isPaid}, '${escFname}', ${fam.totalAmount}, ${isPayment})">${actionLabel}</button>
                        </div>
                        <ul>${memberLines}</ul>
                        <p style="margin-top:6px;"><strong>小計: ${totalLine}</strong></p>
                    </div>
                `;
            });
            html += `</div>`;

            container.innerHTML = html;
        };

        window.completeCollection = async function() {
            if (!confirm('この集金を完了しますか? 完了するとステータスが「完了」に変わります。')) return;
            const r = await setCollectionStatusAPI(currentCollectionId, 'closed');
            if (r.success) {
                showCollectionDetail(currentCollectionId);
            } else {
                alert(`エラー: ${r.message}`);
            }
        };

        window.reopenCollection = async function() {
            if (!confirm('完了を取り消して受付中に戻しますか?')) return;
            // 締切が過去のままだと再度自動完了するため、null（締切なし）にして再開
            const r = await setCollectionStatusAPI(currentCollectionId, 'open', null);
            if (r.success) {
                showCollectionDetail(currentCollectionId);
            } else {
                alert(`エラー: ${r.message}`);
            }
        };

        window.saveDetailDeadline = async function() {
            const v = document.getElementById('detailDeadlineEdit').value;
            const r = await updateCollectionDeadlineAPI(currentCollectionId, inputValueToDeadline(v));
            if (r.success) {
                showCollectionDetail(currentCollectionId);
            } else {
                alert(`エラー: ${r.message}`);
            }
        };

        window.clearDetailDeadline = async function() {
            const r = await updateCollectionDeadlineAPI(currentCollectionId, null);
            if (r.success) {
                showCollectionDetail(currentCollectionId);
            } else {
                alert(`エラー: ${r.message}`);
            }
        };

        window.toggleCollectionPaidFamily = async function(familyId, isPaid, familyName, totalAmount, isPayment) {
            // 表示用テキスト
            const famLabel = familyName ? `${familyName}家` : 'この家族';
            const amtText = totalAmount != null
                ? (Number(totalAmount) < 0
                    ? `¥${Math.abs(Number(totalAmount)).toLocaleString()}（支払い）`
                    : `¥${Number(totalAmount).toLocaleString()}`)
                : '';
            let msg;
            if (isPaid) {
                if (isPayment) {
                    msg = `${famLabel} を「支払い済み」にしますか？\n金額: ${amtText}`;
                } else {
                    msg = `${famLabel} から ${amtText} を集金済みにしますか？`;
                }
            } else {
                msg = `${famLabel} を未済の状態に戻しますか？`;
            }
            if (!confirm(msg)) return;
            const r = await toggleCollectionPaidFamilyAPI(currentCollectionId, familyId, isPaid);
            if (r.success) {
                showCollectionDetail(currentCollectionId);
            } else {
                alert(`エラー: ${r.message}`);
            }
        };

        // ======================================
        // メンバー選択モーダル
        // ======================================

        let modalMembers = [];
        let modalSelected = new Set(); // key: familyId#memberIndex
        let modalFilter = '';

        function memberKey(m) {
            return `${m.familyId}#${m.memberIndex}`;
        }

        window.openMemberSelection = async function() {
            const modal = document.getElementById('memberSelectionModal');
            modal.style.display = 'flex';
            document.getElementById('memberListBody').innerHTML = '<div class="loading">名簿を読み込み中...</div>';
            document.getElementById('memberSearchInput').value = '';
            modalFilter = '';

            const members = await loadMeiboMembers();
            modalMembers = members;
            modalSelected = new Set(memberSelectionState.map(m => memberKey(m)));
            renderMemberList();
            updateModalCount();
        };

        window.closeMemberSelection = function() {
            document.getElementById('memberSelectionModal').style.display = 'none';
        };

        window.filterMemberList = function() {
            modalFilter = document.getElementById('memberSearchInput').value.trim().toLowerCase();
            renderMemberList();
        };

        function renderMemberList() {
            const body = document.getElementById('memberListBody');
            if (modalMembers.length === 0) {
                body.innerHTML = '<p style="padding:20px; text-align:center; color:var(--text-subtle);">名簿データがありません。</p>';
                return;
            }

            // フィルタ
            const filtered = modalFilter
                ? modalMembers.filter(m =>
                    (m.name || '').toLowerCase().includes(modalFilter) ||
                    (m.kana || '').toLowerCase().includes(modalFilter) ||
                    (m.familyName || '').toLowerCase().includes(modalFilter) ||
                    (m.fullName || '').toLowerCase().includes(modalFilter)
                )
                : modalMembers;

            // グルーピング: 部員(学年降順) → 保護者・コーチ
            const groups = {};
            filtered.forEach(m => {
                let key;
                if (m.type === 'member') {
                    key = m.grade || 'その他';
                } else if (m.role === 'coach') {
                    key = 'コーチ';
                } else {
                    key = '保護者';
                }
                if (!groups[key]) groups[key] = [];
                groups[key].push(m);
            });

            // 表示順
            const memberOrder = ['小6','小5','小4','小3','小2','小1','未就学','中3','中2','中1','その他'];
            const orderedKeys = [];
            memberOrder.forEach(k => { if (groups[k]) orderedKeys.push(k); });
            ['コーチ','保護者'].forEach(k => { if (groups[k]) orderedKeys.push(k); });
            // それ以外
            Object.keys(groups).forEach(k => { if (!orderedKeys.includes(k)) orderedKeys.push(k); });

            let html = '';
            orderedKeys.forEach(key => {
                html += `<div class="member-group-head">${escapeHtml(key)}（${groups[key].length}名）</div>`;
                groups[key].forEach(m => {
                    const k = memberKey(m);
                    const checked = modalSelected.has(k) ? 'checked' : '';
                    const tag = m.type === 'member' ? (m.grade || '') : (m.role === 'coach' ? 'コーチ' : '保護者');
                    html += `
                        <label class="member-row">
                            <input type="checkbox" data-key="${k}" ${checked} onchange="onMemberCheckboxChange(this)">
                            <span class="member-row-name">${escapeHtml(m.familyName)} ${escapeHtml(m.name)}${m.kana ? ` <span style="color:var(--text-subtle); font-size:0.8em;">(${escapeHtml(m.kana)})</span>` : ''}</span>
                            <span class="member-row-tag">${escapeHtml(tag)}</span>
                        </label>
                    `;
                });
            });
            body.innerHTML = html;
        }

        window.onMemberCheckboxChange = function(el) {
            const k = el.dataset.key;
            if (el.checked) modalSelected.add(k);
            else modalSelected.delete(k);
            updateModalCount();
        };

        window.memberSelectAll = function(select) {
            // 現在表示中の項目に対して
            const checkboxes = document.querySelectorAll('#memberListBody input[type="checkbox"]');
            checkboxes.forEach(cb => {
                const k = cb.dataset.key;
                if (select) modalSelected.add(k);
                else modalSelected.delete(k);
                cb.checked = select;
            });
            updateModalCount();
        };

        window.memberSelectMembersOnly = function() {
            modalMembers.forEach(m => {
                if (m.type === 'member') {
                    modalSelected.add(memberKey(m));
                }
            });
            renderMemberList();
            updateModalCount();
        };

        function updateModalCount() {
            document.getElementById('memberSelectionCount').textContent = `${modalSelected.size}名選択中`;
        }

        window.confirmMemberSelection = function() {
            memberSelectionState = modalMembers
                .filter(m => modalSelected.has(memberKey(m)))
                .map(m => ({
                    familyId: m.familyId,
                    familyName: m.familyName,
                    memberIndex: m.memberIndex,
                    name: m.name,
                    type: m.type,
                    role: m.role,
                    grade: m.grade,
                    fullName: `${m.familyName} ${m.name}`.trim()
                }));
            renderSelectedMembers();
            closeMemberSelection();
        };

        // 初期化
        window.onload = function() {
            loadOrderList();
        };
    </script>
</body>
</html>
