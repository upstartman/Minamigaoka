<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南ヶ丘注文集計アプリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Color tokens (Deep Sky Blue background × バスケットボールアクセント) */
            --bg: #00BFFF;          /* ディープスカイブルー */
            --bg-soft: #38bdf8;     /* グラデ用 */
            --surface: #ffffff;
            --surface-2: #f0f9ff;   /* 淡いブルーの副サーフェス */
            --surface-3: #e0f2fe;   /* やや濃い淡ブルー */
            --border: #e2e8f0;      /* クールニュートラルなボーダー */
            --border-strong: #cbd5e1;

            --text: #0f172a;        /* 深いネイビー（読みやすさ重視） */
            --text-muted: #475569;
            --text-subtle: #94a3b8;

            /* メイン: ネイビー（青背景に映えるダークブルー） */
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --primary-soft: #dbeafe;
            --primary-soft-border: #bfdbfe;

            /* 成功: エメラルド */
            --success: #059669;
            --success-hover: #047857;
            --success-soft: #d1fae5;
            --success-soft-border: #a7f3d0;

            /* 危険: ヴィヴィッドレッド */
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --danger-soft: #fee2e2;
            --danger-soft-border: #fecaca;

            /* 警告: アンバー（緊急時） */
            --warning: #d97706;
            --warning-soft: #fef3c7;
            --warning-soft-border: #fde68a;

            /* 支払い対象: ヴィヴィッドパープル（集金済の緑と明確に区別） */
            --info: #7c3aed;
            --info-soft: #ede9fe;
            --info-soft-border: #ddd6fe;

            /* バスケットボールオレンジ（ヘッダー・モードトグル用、青の補色） */
            --basketball: #f97316;
            --basketball-deep: #ea580c;
            --basketball-soft: #ffedd5;
            --basketball-soft-border: #fed7aa;

            /* サブアクセント: ユーザー別ローテーション（はっきりした6色、青背景でも識別） */
            --accent-1: #ea580c; /* オレンジ */
            --accent-2: #facc15; /* イエロー */
            --accent-3: #16a34a; /* 緑 */
            --accent-4: #9333ea; /* 紫 */
            --accent-5: #db2777; /* マゼンタ */
            --accent-6: #0d9488; /* ティール */

            /* Radius */
            --r-sm: 6px;
            --r: 10px;
            --r-lg: 14px;

            /* Shadow（ブルー背景に映えるよう少し強め＆青みを帯びた影） */
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow: 0 4px 14px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.06);

            /* Type */
            --font-sans: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-sans);
            font-feature-settings: "palt" 1;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            padding: 14px 12px;
            line-height: 1.55;
            letter-spacing: 0.01em;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .header {
            background: #ffffff;
            padding: 14px 16px;
            margin-bottom: 16px;
            text-align: center;
            border: 1px solid var(--basketball-soft-border);
            border-radius: var(--r);
            box-shadow: var(--shadow-sm);
        }

        .header h1 {
            color: var(--text);
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .mode-selector {
            display: inline-flex;
            gap: 4px;
            padding: 3px;
            background: var(--surface-2);
            border: 1px solid var(--basketball-soft-border);
            border-radius: var(--r);
        }

        .mode-btn {
            padding: 7px 16px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .mode-btn:hover {
            color: var(--basketball-deep);
            background: var(--basketball-soft);
        }

        .mode-btn.active {
            background: var(--basketball);
            color: #fff;
            box-shadow: 0 2px 4px rgba(249,115,22,0.35);
        }
        .mode-btn.active:hover {
            background: var(--basketball-deep);
            color: #fff;
        }

        .content {
            box-shadow: var(--shadow);
        }

        .content {
            background: var(--surface);
            padding: 16px 14px;
            border-radius: var(--r);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        h2 {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 14px;
            color: var(--text);
        }

        h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text);
            font-weight: 500;
            font-size: 0.85rem;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group input[type="datetime-local"],
        .form-group input[type="number"],
        .form-group input[type="password"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            background: var(--surface);
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-subtle);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .menu-items {
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 14px;
            margin-bottom: 12px;
            background: var(--surface-2);
        }

        .menu-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .menu-item:last-child {
            margin-bottom: 0;
        }

        .menu-item input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            font-family: inherit;
            font-size: 0.9rem;
            background: var(--surface);
            color: var(--text);
        }

        .menu-item input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .menu-item button {
            padding: 6px 12px;
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger-soft-border);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: background 0.15s;
        }
        .menu-item button:hover {
            background: var(--danger-soft);
        }

        .btn {
            padding: 8px 14px;
            background: var(--primary);
            color: #fff;
            border: 1px solid var(--primary);
            border-radius: var(--r-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.4;
            transition: background 0.15s, border-color 0.15s, transform 0.05s;
        }

        .btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .btn:active { transform: translateY(1px); }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border-strong);
        }
        .btn-secondary:hover {
            background: var(--surface-2);
            border-color: var(--text-subtle);
        }

        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger-hover);
            border-color: var(--danger-hover);
        }

        .btn-success {
            background: var(--success);
            border-color: var(--success);
        }
        .btn-success:hover {
            background: #15803d;
            border-color: #15803d;
        }

        .order-list {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        .order-card {
            position: relative;
            border: 1px solid var(--border);
            border-left: 3px solid var(--success);
            border-radius: var(--r-sm);
            padding: 12px 12px 12px 14px;
            background: var(--surface);
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.05s;
            cursor: pointer;
        }

        .order-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-sm);
            background: var(--surface-2);
        }
        .order-card:active { transform: translateY(1px); }

        /* 締切済カードはトーンを落とす */
        .order-card.is-closed {
            border-left-color: var(--text-subtle);
            background: var(--surface-2);
        }
        .order-card.is-closed:hover {
            background: var(--surface-3);
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .order-date {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .status-badge {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .status-open {
            background: var(--success-soft);
            color: #406527;
            border-color: var(--success-soft-border);
        }

        .status-closed {
            background: var(--surface-3);
            color: var(--text-subtle);
            border-color: var(--border-strong);
        }

        /* 集金済 / 支払済 = 完了は緑で統一（4状態を直感的に） */
        .user-order.paid {
            background: var(--success-soft);
            border: 1px solid var(--success-soft-border);
            border-left: 3px solid var(--success);
        }

        .user-order.paid h4 {
            background: var(--success);
        }

        .user-order.paid h4::after {
            content: ' ✓ 集金済';
            color: white;
            font-size: 0.78rem;
            margin-left: 8px;
            opacity: 0.95;
        }

        /* 支払い対象（負の金額）= 未済はニュートラル背景、識別は名前バッジ色で */
        .user-order.payment-target {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--info);
        }

        .user-order.payment-target h4 {
            background: var(--info);
        }

        /* 支払い済（payment-target.paid）= 完了なので緑に上書き */
        .user-order.payment-target.paid {
            background: var(--success-soft);
            border: 1px solid var(--success-soft-border);
            border-left: 3px solid var(--success);
        }

        .user-order.payment-target.paid h4 {
            background: var(--success);
        }

        .user-order.payment-target.paid h4::after {
            content: ' ✓ 支払済';
        }

        .btn-paid {
            background: var(--success);
            border-color: var(--success);
            font-size: 0.8rem;
            padding: 6px 12px;
            margin-left: 8px;
        }
        .btn-paid:hover {
            background: #15803d;
            border-color: #15803d;
        }

        .btn-unpaid {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border-strong);
            font-size: 0.8rem;
            padding: 6px 12px;
            margin-left: 8px;
        }
        .btn-unpaid:hover {
            background: var(--surface-2);
            border-color: var(--text-subtle);
        }

        .user-order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .user-order-header h4 {
            margin: 0;
        }

        .order-card-body {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .order-card-summary {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            padding: 8px 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }
        .order-card-summary span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .order-form-container {
            margin-top: 16px;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.95rem;
        }

        .order-table th,
        .order-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .order-table th {
            background: var(--surface-2);
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .order-table input[type="number"] {
            width: 80px;
            padding: 6px 8px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            font-family: inherit;
            font-size: 0.9rem;
        }
        .order-table input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .buttons-container {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-subtle);
            font-size: 0.95rem;
        }

        .success {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid var(--success-soft-border);
            padding: 12px 14px;
            border-radius: var(--r-sm);
            margin: 12px 0;
            font-size: 0.9rem;
        }

        .error {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid var(--danger-soft-border);
            padding: 12px 14px;
            border-radius: var(--r-sm);
            margin: 12px 0;
            font-size: 0.9rem;
        }

        .summary-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .summary-section h3 {
            margin-bottom: 12px;
        }

        .user-order-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        /* 既定（集金未済）: 背景はニュートラルで控えめに、識別は名前バッジ色で */
        .user-order {
            background: var(--surface);
            padding: 12px 14px;
            border-radius: var(--r-sm);
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--warning);
        }

        .user-order h4 {
            margin-bottom: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 5px 12px;
            background: var(--warning);
            color: #fff;
            border-radius: var(--r-sm);
            display: inline-block;
            letter-spacing: 0.01em;
        }

        .user-order ul {
            list-style: none;
            padding-left: 0;
        }

        .user-order li {
            padding: 4px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 18px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.875rem;
            transition: color 0.15s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .admin-actions {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }

        .admin-actions button {
            font-size: 0.85rem;
            padding: 6px 12px;
        }

        /* 注文詳細サマリー */
        .order-summary-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: var(--surface-2);
            border: 1px solid var(--basketball-soft-border);
            border-radius: var(--r-sm);
            padding: 12px 14px;
            margin: 10px 0 14px;
        }
        .order-summary-header .stat {
            min-width: 56px;
        }
        .order-summary-header .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        /* 数値ごとにはっきりした色分け */
        .order-summary-header .stat:nth-of-type(1) .stat-value { color: var(--success); }       /* 注文人数 = 緑 */
        .order-summary-header .stat:nth-of-type(2) .stat-value { color: var(--basketball-deep); } /* 合計数量 = オレンジ */
        .order-summary-header .stat:nth-of-type(3) .stat-value { color: var(--primary); }       /* 合計金額 = ネイビー */

        .order-summary-header .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.02em;
            font-weight: 500;
        }
        .order-summary-header .stat-divider {
            width: 1px;
            height: 36px;
            background: var(--basketball-soft-border);
        }
        .order-summary-header .stat-status {
            margin-left: auto;
        }

        /* 再オープンフォーム */
        .reopen-card {
            border: 1px solid var(--success-soft-border);
            background: var(--success-soft);
            border-radius: var(--r);
            padding: 16px 18px;
            margin: 12px 0;
        }
        .reopen-card h3 {
            margin: 0 0 6px;
            color: var(--text);
        }
        .reopen-card .reopen-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* 締切バッジ用 共通サポート（インラインのfallback） */
        .deadline-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 8px;
        }
        .deadline-pill.urgent {
            background: var(--warning-soft);
            color: var(--warning);
            border-color: var(--warning-soft-border);
        }
        .deadline-pill.soon {
            background: #fff7ed;
            color: #c2410c;
            border-color: #fed7aa;
        }
        .deadline-pill.normal {
            background: var(--success-soft);
            color: var(--success);
            border-color: var(--success-soft-border);
        }
        .deadline-pill.closed {
            background: var(--surface-2);
            color: var(--text-subtle);
            border-color: var(--border);
        }
        .deadline-pill .deadline-remain {
            font-weight: 400;
            opacity: 0.85;
            font-size: 0.78rem;
        }

        .deadline-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-muted);
            border-radius: var(--r);
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 500;
            margin: 10px 0 14px;
        }
        .deadline-banner.urgent {
            background: var(--warning-soft);
            color: var(--warning);
            border-color: var(--warning-soft-border);
        }
        .deadline-banner.soon {
            background: #fff7ed;
            color: #c2410c;
            border-color: #fed7aa;
        }
        .deadline-banner.normal {
            background: var(--success-soft);
            color: var(--success);
            border-color: var(--success-soft-border);
        }
        .deadline-banner.closed {
            background: var(--surface-2);
            color: var(--text-subtle);
            border-color: var(--border);
        }
        .deadline-banner .deadline-remain {
            font-weight: 400;
            opacity: 0.85;
            font-size: 0.85rem;
        }

        /* 集金サマリー */
        .payment-summary {
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: var(--r-sm);
            margin-bottom: 14px;
            font-size: 0.9rem;
        }
        .payment-summary p {
            margin: 4px 0;
            color: var(--text-muted);
        }
        .payment-summary p strong { color: var(--text); font-weight: 500; }

        /* 支払対象バッジ（目立たせる） */

                <button class="mode-btn" onclick="switchMode('admin')">管理画面</button>
            </div>
        </div>

        <div class="content">
            <!-- 利用者モード -->
            <div id="userMode" class="section active">
                <div id="orderListSection" class="section active">
                    <h2>注文内容を選択</h2>
                    <div id="orderList" class="order-list">
                        <div class="loading">読み込み中...</div>
                    </div>
                </div>

                <div id="orderFormSection" class="section">
                    <a href="#" class="back-link" onclick="showOrderList(); return false;">← 注文内容選択に戻る</a>
                    <div id="orderFormContent"></div>
                </div>
            </div>

            <!-- 管理者モード -->
            <div id="adminMode" class="section">
                <div id="orderManagementSection" class="section active">
                    <h2>注文管理</h2>
                    <div class="create-button-container" style="margin-bottom: 20px;">
                        <button class="btn btn-success" onclick="showCreateOrderPage()">＋ 新規注文ページ作成</button>
                    </div>
                    <div id="adminOrderList"></div>
                </div>

                <div id="createOrderSection" class="section">
                    <a href="#" class="back-link" onclick="showOrderManagement(); return false;">← 注文管理に戻る</a>
                    <h2>新規注文ページ作成</h2>
                    <div class="form-group">
                        <label>過去の注文からコピーする場合は以下から選択</label>
                        <select id="copyFromOrder" onchange="loadMenusFromOrder()">
                            <option value="">-- 新規作成 --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>日付</label>
                        <input type="date" id="newOrderDate" onchange="onNewOrderDateChange()">
                    </div>
                    <div class="form-group">
                        <label>注文内容</label>
                        <input type="text" id="newShopName" placeholder="例: お弁当（ほっともっと）">
                    </div>
                    <div class="form-group">
                        <label>注文締め切り日時（任意）</label>
                        <input type="datetime-local" id="newDeadline" oninput="updateNewDeadlineHint()">
                        <div id="newDeadlineHint" style="font-size: 0.85em; margin-top: 6px;"></div>

                        <label>メモ（任意）</label>

                    <div class="form-group">
                        <label>項目</label>

                            <div class="menu-item">

                <div id="orderDetailSection" class="section">
                    <a href="#" class="back-link" onclick="showOrderManagement(); return false;">← 注文管理に戻る</a>
                    <div id="orderDetailContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            addDoc, 
            getDoc, 
            getDocs, 
            updateDoc, 
            deleteDoc, 
            query, 
            where, 
            orderBy,
            Timestamp 
        } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyACgA83z7xBWICIFLUK1_AwDFL9_EXRJW8",
            authDomain: "minamigaoka-bento.firebaseapp.com",
            projectId: "minamigaoka-bento",
            storageBucket: "minamigaoka-bento.firebasestorage.app",
            messagingSenderId: "160499455872",
            appId: "1:160499455872:web:7ac0b1f07770cc6d121365"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentMode = 'user';
        let currentOrderId = null;

        // UUID生成
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // 日付をそのまま返す
        function formatDate(dateString) {
            return dateString || '';
        }

        // ======================================
        // 締切日時 ヘルパー
        // ======================================

        // Date → "YYYY-MM-DDTHH:mm" (datetime-local 入力用、ローカルタイム)
        function formatLocalDateTime(d) {
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // 注文日の前日17時を "YYYY-MM-DDTHH:mm" で返す（プリセット用）
        function defaultDeadlineFromOrderDate(orderDateStr) {
            if (!orderDateStr) return '';
            const parts = orderDateStr.split('-');
            if (parts.length !== 3) return '';
            const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            d.setDate(d.getDate() - 1);
            d.setHours(17, 0, 0, 0);
            return formatLocalDateTime(d);
        }

        // Firestore Timestamp → "YYYY-MM-DDTHH:mm"
        function deadlineToInputValue(deadline) {
            if (!deadline) return '';
            const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
            return formatLocalDateTime(d);
        }

        // "YYYY-MM-DDTHH:mm" → Firestore Timestamp (空なら null)
        function inputValueToDeadline(s) {
            if (!s) return null;
            const d = new Date(s);
            if (isNaN(d.getTime())) return null;
            return Timestamp.fromDate(d);
        }

        // 締切日時が過去かどうか
        function isDeadlinePassed(deadline) {
            if (!deadline) return false;
            const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
            return d.getTime() <= Date.now();
        }

        // 実効ステータス: 手動 closed か締切超過なら closed
        function effectiveStatus(orderPage) {
            if (orderPage.status === 'closed') return 'closed';
            if (isDeadlinePassed(orderPage.deadline)) return 'closed';
            return 'open';
        }

        // 締切表示用 "2026-05-01 17:00"
        function formatDeadlineText(deadline) {
            if (!deadline) return '';
            const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // 残り時間テキスト
        function remainingTimeText(deadline) {
            if (!deadline) return '';
            const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
            const diffMs = d.getTime() - Date.now();
            if (diffMs <= 0) return '締切を過ぎています';
            const totalMin = Math.floor(diffMs / 60000);
            const days = Math.floor(totalMin / (60 * 24));
            const hours = Math.floor((totalMin % (60 * 24)) / 60);
            const mins = totalMin % 60;
            if (days > 0) return `締切まで残り ${days}日 ${hours}時間`;
            if (hours > 0) return `締切まで残り ${hours}時間 ${mins}分`;
            return `締切まで残り ${mins}分`;
        }

        // 入力中の文字列値からヒント表示
        function deadlineHintHtml(deadlineStr) {
            if (!deadlineStr) return '<span style="color:var(--text-subtle);">未設定の場合は締切なし（無期限）になります</span>';
            const d = new Date(deadlineStr);
            if (isNaN(d.getTime())) return '';
            const diffMs = d.getTime() - Date.now();
            if (diffMs <= 0) return '<span style="color:var(--danger);">⚠ 過去の日時です。このまま登録すると即座に締切扱いになります</span>';
            return `<span style="color:var(--success);">${remainingTimeText({ toDate: () => d })}</span>`;
        }

        // 緊急度クラス決定
        function deadlineUrgencyClass(deadline, eff) {
            if (!deadline) return '';
            if (eff !== 'open') return 'closed';
            const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
            const diffMs = d.getTime() - Date.now();
            const oneHour = 60 * 60 * 1000;
            if (diffMs <= 2 * oneHour) return 'urgent';
            if (diffMs <= 24 * oneHour) return 'soon';
            return 'normal';
        }

        // 締切バッジHTML（一覧カード用）
        function deadlineBadgeHtml(deadline, eff) {
            if (!deadline) return '';
            const cls = deadlineUrgencyClass(deadline, eff);
            const dateText = formatDeadlineText(deadline);
            const icon = cls === 'urgent' ? '🔥' : cls === 'soon' ? '⏰' : '⏱';
            const remain = eff === 'open' ? `<span class="deadline-remain">（${remainingTimeText(deadline)}）</span>` : '';
            return `<div class="deadline-pill ${cls}">${icon} 締切: ${dateText}${remain}</div>`;
        }

        // 締切バナーHTML（詳細画面用、より大きく）
        function deadlineBadgeLargeHtml(deadline, eff) {
            if (!deadline) return '';
            const cls = deadlineUrgencyClass(deadline, eff);
            const dateText = formatDeadlineText(deadline);
            const icon = cls === 'urgent' ? '🔥' : cls === 'soon' ? '⏰' : '⏱';
            const remain = eff === 'open'
                ? `<span class="deadline-remain">（${remainingTimeText(deadline)}）</span>`
                : `<span class="deadline-remain">（締切済）</span>`;
            return `<div class="deadline-banner ${cls}">${icon} 締切: ${dateText}${remain}</div>`;
        }

        // 締切自動更新（best-effort: closed への書き戻し）
        function autoCloseIfPast(orderId, data) {
            if (data.status === 'open' && isDeadlinePassed(data.deadline)) {
                updateDoc(doc(db, 'orderPages', orderId), { status: 'closed' }).catch(() => {});
                data.status = 'closed';
            }
        }

        // モード切り替え
        window.switchMode = function(mode) {
            currentMode = mode;
            
            // ボタンのアクティブ状態を更新
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // セクションの表示切り替え
            document.getElementById('userMode').classList.remove('active');
            document.getElementById('adminMode').classList.remove('active');

            if (mode === 'user') {
                document.getElementById('userMode').classList.add('active');
                showOrderList();
            } else {
                document.getElementById('adminMode').classList.add('active');
                showOrderManagement();
            }
        };

        // ======================================
        // Firebase Firestore API 関数
        // ======================================

        // 注文ページ一覧取得
        async function getOrderPages() {
            try {
                const querySnapshot = await getDocs(collection(db, 'orderPages'));
                const orderPages = [];
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    autoCloseIfPast(docSnap.id, data);
                    orderPages.push({
                        orderId: docSnap.id,
                        orderDate: data.orderDate,
                        shopName: data.shopName || '',
                        memo: data.memo || '',
                        deadline: data.deadline || null,
                        menus: data.menus || [],
                        status: data.status,
                        createdAt: data.createdAt
                    });
                });

                // 作成日時の新しい順にソート
                orderPages.sort((a, b) => {
                    const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt);
                    const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
                    return dateB - dateA;
                });

                return { success: true, data: orderPages };
            } catch (error) {
                console.error('getOrderPages error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文ページ作成
        async function createOrderPageAPI(params) {
            try {
                const docRef = await addDoc(collection(db, 'orderPages'), {
                    orderDate: params.orderDate,
                    shopName: params.shopName || '',
                    memo: params.memo || '',
                    deadline: params.deadline || null,
                    menus: params.menus,
                    status: 'open',
                    createdAt: Timestamp.now()
                });

                return { 
                    success: true, 
                    message: 'Order page created successfully',
                    data: { orderId: docRef.id, orderDate: params.orderDate }
                };
            } catch (error) {
                console.error('createOrderPage error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文詳細取得
        async function getOrderDetail(params) {
            try {
                const orderId = params.orderId;
                
                // 注文ページを取得
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                
                if (!orderPageDoc.exists()) {
                    return { success: false, message: 'Order page not found' };
                }

                const orderPageData = orderPageDoc.data();
                autoCloseIfPast(orderId, orderPageData);
                const orderPage = {
                    orderId: orderId,
                    orderDate: orderPageData.orderDate,
                    shopName: orderPageData.shopName || '',
                    memo: orderPageData.memo || '',
                    deadline: orderPageData.deadline || null,
                    menus: orderPageData.menus || [],
                    status: orderPageData.status,
                    createdAt: orderPageData.createdAt
                };

                // この注文ページの注文データを取得
                const ordersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId)
                );
                const ordersSnapshot = await getDocs(ordersQuery);
                const orders = [];

                ordersSnapshot.forEach((doc) => {
                    const data = doc.data();
                    orders.push({
                        id: doc.id,
                        orderId: data.orderId,
                        orderDate: data.orderDate,
                        menuName: data.menuName,
                        price: data.price,
                        userName: data.userName,
                        quantity: data.quantity,
                        timestamp: data.timestamp
                    });
                });

                return { 
                    success: true, 
                    message: 'Order detail retrieved',
                    data: { orderPage, orders }
                };
            } catch (error) {
                console.error('getOrderDetail error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文送信
        async function submitOrderAPI(params) {
            try {
                const orderId = params.orderId;
                const userName = params.userName;
                const orderItems = params.orderItems;

                // 注文ページの状態確認
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                
                if (!orderPageDoc.exists()) {
                    return { success: false, message: 'Order page not found' };
                }

                const orderPageData = orderPageDoc.data();
                if (orderPageData.status === 'closed') {
                    return { success: false, message: 'この注文は締め切られているため変更できません' };
                }
                if (isDeadlinePassed(orderPageData.deadline)) {
                    updateDoc(doc(db, 'orderPages', orderId), { status: 'closed' }).catch(() => {});
                    return { success: false, message: '締切日時を過ぎているため注文できません' };
                }

                // 既存の注文を削除
                const existingOrdersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId),
                    where('userName', '==', userName)
                );
                const existingOrdersSnapshot = await getDocs(existingOrdersQuery);
                
                const deletePromises = [];
                existingOrdersSnapshot.forEach((docSnap) => {
                    deletePromises.push(deleteDoc(doc(db, 'orders', docSnap.id)));
                });
                await Promise.all(deletePromises);

                // 新しい注文を追加
                const addPromises = [];
                for (let item of orderItems) {
                    if (item.quantity > 0) {
                        addPromises.push(addDoc(collection(db, 'orders'), {
                            orderId: orderId,
                            orderDate: orderPageData.orderDate,
                            menuName: item.menuName,
                            price: item.price,
                            userName: userName,
                            quantity: item.quantity,
                            timestamp: Timestamp.now()
                        }));
                    }
                }
                await Promise.all(addPromises);

                return { success: true, message: 'Order submitted successfully' };
            } catch (error) {
                console.error('submitOrder error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文者一覧取得
        async function getUserList(params) {
            try {
                const orderId = params.orderId;
                
                const ordersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId)
                );
                const ordersSnapshot = await getDocs(ordersQuery);
                
                const userSet = new Set();
                ordersSnapshot.forEach((doc) => {
                    const data = doc.data();
                    userSet.add(data.userName);
                });

                const users = Array.from(userSet).sort();
                return { success: true, data: users };
            } catch (error) {
                console.error('getUserList error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文締切
        async function closeOrderAPI(params) {
            try {
                const orderId = params.orderId;
                await updateDoc(doc(db, 'orderPages', orderId), {
                    status: 'closed'
                });
                return { success: true, message: 'Order closed successfully' };
            } catch (error) {
                console.error('closeOrder error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文再開（新しい締切日時で）
        async function reopenOrderAPI(params) {
            try {
                const orderId = params.orderId;
                const updateData = { status: 'open' };
                if (Object.prototype.hasOwnProperty.call(params, 'deadline')) {
                    updateData.deadline = params.deadline; // null = 締切なし
                }
                await updateDoc(doc(db, 'orderPages', orderId), updateData);
                return { success: true, message: 'Order reopened successfully' };
            } catch (error) {
                console.error('reopenOrder error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 集金状態を切り替え
        async function togglePaymentStatusAPI(params) {
            try {
                const orderId = params.orderId;
                const userName = params.userName;
                const isPaid = params.isPaid;

                // 現在の注文ページを取得
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                
                if (!orderPageDoc.exists()) {
                    return { success: false, message: 'Order page not found' };
                }

                const orderPageData = orderPageDoc.data();
                let paidUsers = orderPageData.paidUsers || [];

                if (isPaid) {
                    // 集金済みにする
                    if (!paidUsers.includes(userName)) {
                        paidUsers.push(userName);
                    }
                } else {
                    // 未集金に戻す
                    paidUsers = paidUsers.filter(u => u !== userName);
                }

                await updateDoc(doc(db, 'orderPages', orderId), {
                    paidUsers: paidUsers
                });

                return { success: true, message: isPaid ? 'Payment recorded' : 'Payment cancelled' };
            } catch (error) {
                console.error('togglePaymentStatus error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文集計取得
        async function getOrderSummary(params) {
            try {
                const orderId = params.orderId;

                // 注文ページを取得
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                
                if (!orderPageDoc.exists()) {
                    return { success: false, message: 'Order page not found' };
                }

                const orderPageData = orderPageDoc.data();
                autoCloseIfPast(orderId, orderPageData);
                const orderPage = {
                    orderId: orderId,
                    orderDate: orderPageData.orderDate,
                    shopName: orderPageData.shopName || '',
                    memo: orderPageData.memo || '',
                    deadline: orderPageData.deadline || null,
                    menus: orderPageData.menus || [],
                    status: orderPageData.status,
                    paidUsers: orderPageData.paidUsers || []
                };

                // 注文データを取得
                const ordersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId)
                );
                const ordersSnapshot = await getDocs(ordersQuery);

                const menuSummary = {};
                const userOrders = {};
                let totalAmount = 0;

                // 項目ごとの集計初期化
                for (let menu of orderPage.menus) {
                    menuSummary[menu.name] = {
                        menuName: menu.name,
                        price: menu.price,
                        totalQuantity: 0,
                        totalAmount: 0
                    };
                }

                // 注文データを集計
                ordersSnapshot.forEach((doc) => {
                    const data = doc.data();
                    const menuName = data.menuName;
                    const price = data.price;
                    const userName = data.userName;
                    const quantity = data.quantity;

                    // 項目別集計
                    if (menuSummary[menuName]) {
                        menuSummary[menuName].totalQuantity += quantity;
                        menuSummary[menuName].totalAmount += price * quantity;
                    }

                    // ユーザー別集計
                    if (!userOrders[userName]) {
                        userOrders[userName] = [];
                    }
                    userOrders[userName].push({
                        menuName: menuName,
                        price: price,
                        quantity: quantity,
                        amount: price * quantity
                    });

                    totalAmount += price * quantity;
                });

                return { 
                    success: true, 
                    message: 'Order summary retrieved',
                    data: {
                        orderPage: orderPage,
                        menuSummary: Object.values(menuSummary),
                        userOrders: userOrders,
                        totalAmount: totalAmount
                    }
                };
            } catch (error) {
                console.error('getOrderSummary error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文ページ削除
        async function deleteOrderPageAPI(params) {
            try {
                const orderId = params.orderId;

                // 関連する注文データを削除
                const ordersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId)
                );
                const ordersSnapshot = await getDocs(ordersQuery);

                const deletePromises = [];
                ordersSnapshot.forEach((docSnap) => {
                    deletePromises.push(deleteDoc(doc(db, 'orders', docSnap.id)));
                });
                await Promise.all(deletePromises);

                // 注文ページを削除
                await deleteDoc(doc(db, 'orderPages', orderId));

                return { success: true, message: 'Order page and related orders deleted successfully' };
            } catch (error) {
                console.error('deleteOrderPage error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // ユーザー注文削除
        async function deleteUserOrderAPI(params) {
            try {
                const orderId = params.orderId;
                const userName = params.userName;

                // 該当ユーザーの注文データを削除
                const ordersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId),
                    where('userName', '==', userName)
                );
                const ordersSnapshot = await getDocs(ordersQuery);

                const deletePromises = [];
                ordersSnapshot.forEach((docSnap) => {
                    deletePromises.push(deleteDoc(doc(db, 'orders', docSnap.id)));
                });
                await Promise.all(deletePromises);

                // paidUsersからも削除
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                if (orderPageDoc.exists()) {
                    const orderPageData = orderPageDoc.data();
                    let paidUsers = orderPageData.paidUsers || [];
                    paidUsers = paidUsers.filter(u => u !== userName);
                    await updateDoc(doc(db, 'orderPages', orderId), {
                        paidUsers: paidUsers
                    });
                }

                return { success: true, message: 'User order deleted successfully' };
            } catch (error) {
                console.error('deleteUserOrder error:', error);
                return { success: false, message: error.toString() };
            }
        }

                    orderDate: params.orderDate,
                    shopName: params.shopName || '',
                    memo: params.memo || '',

                return { success: true, message: 'Order page updated successfully' };

                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;
                
                // ユーザー別注文
                const paidUsers = orderPage.paidUsers || [];
                const paidCount = Object.keys(userOrders).filter(u => paidUsers.includes(u)).length;
                
                // 未集金・未支払の合計金額を計算
                let unpaidCollectAmount = 0;  // 未集金額（正の金額）
                let unpaidPaymentAmount = 0;  // 未支払額（負の金額）
                for (let userName in userOrders) {
                    if (!paidUsers.includes(userName)) {
                        let userTotal = 0;
                        userOrders[userName].forEach(order => {
                            userTotal += order.amount;
                        });
                        if (userTotal > 0) {
                            unpaidCollectAmount += userTotal;
                        } else {
                            unpaidPaymentAmount += Math.abs(userTotal);
                        }
                    }
                }
                
                let paymentSummaryHtml = `<p><strong>完了状況:</strong> ${paidCount} / ${totalUsers} 人</p>`;
                if (unpaidCollectAmount > 0) {
                    paymentSummaryHtml += `<p><strong>未集金額:</strong> <span style="color: var(--danger);">¥${unpaidCollectAmount.toLocaleString()}</span></p>`;
                }
                if (unpaidPaymentAmount > 0) {
                    paymentSummaryHtml += `<p><strong>未支払額:</strong> <span style="color: var(--info);">¥${unpaidPaymentAmount.toLocaleString()}</span></p>`;
                }
                if (unpaidCollectAmount === 0 && unpaidPaymentAmount === 0 && totalUsers > 0) {
                    paymentSummaryHtml += `<p style="color: var(--success);"><strong>✅ 全員完了！</strong></p>`;
                }

                html += `
                    <div class="user-order-section">
                        <h3>ユーザー別注文</h3>
                        <div class="payment-summary">
                            ${paymentSummaryHtml}
                        </div>
                `;
                
                for (let userName in userOrders) {
                    const orders = userOrders[userName];
                    let userTotal = 0;
                    orders.forEach(order => userTotal += order.amount);
                    
                    const isPaid = paidUsers.includes(userName);
                    const escapedUserName = userName.replace(/'/g, "\\'");
                    const isPayment = userTotal < 0; // 負の金額=支払い対象
                    
                    // 支払い対象者用のスタイル
                    let cardClass = isPaid ? 'paid' : '';
                    if (isPayment) cardClass += ' payment-target';
                    
                    // ボタンラベルを集金/支払いで切り替え
                    const paidLabel = isPayment ? '支払済みにする' : '集金済みにする';
                    const unpaidLabel = isPayment ? '未支払に戻す' : '未集金に戻す';
                    
                    html += `
                        <div class="user-order ${cardClass}">
                            <div class="user-order-header">
                                <h4>${userName}${isPayment ? ' <span class="payment-tag">支払</span>' : ''}</h4>
                                ${isPaid 
                                    ? `<button class="btn btn-unpaid" onclick="togglePaymentStatus('${escapedUserName}', false)">${unpaidLabel}</button>`
                                    : `<button class="btn btn-paid" onclick="togglePaymentStatus('${escapedUserName}', true)">${paidLabel}</button>`
                                }
                            </div>
                            <ul>
                    `;
                    
                    orders.forEach(order => {
                        const amountDisplay = order.amount < 0 
                            ? `<span style="color: var(--info);">-¥${Math.abs(order.amount).toLocaleString()}</span>`
                            : `¥${order.amount.toLocaleString()}`;
                        html += `<li>${order.menuName} × ${order.quantity} = ${amountDisplay}</li>`;
                    });
                    
                    const totalDisplay = userTotal < 0
                        ? `<span style="color: var(--info);">-¥${Math.abs(userTotal).toLocaleString()}</span>（支払い）`
                        : `¥${userTotal.toLocaleString()}`;
                    
                    html += `
                            </ul>
                            <p><strong>小計: ${totalDisplay}</strong></p>
                        </div>
                    `;
                }
                
                html += '</div>';
                
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="error">${result.message}</div>`;
            }
        };

        // 注文締切
        window.closeOrder = async function() {
            if (!confirm('この注文を締め切りますか?締め切ると利用者は注文を変更できなくなります。')) {
                return;
            }
            
            const result = await closeOrderAPI({ orderId: currentOrderId });
            
            if (result.success) {
                alert('注文を締め切りました');
                showOrderDetail(currentOrderId);
            } else {
                alert(`エラー: ${result.message}`);
            }
        };

        // 締切を取り消す → 新しい締切日時の入力フォームを表示
        window.showReopenForm = function() {
            const section = document.getElementById('reopenSection');
            if (!section) return;
            // デフォルト値: 現在時刻 + 1時間
            const def = new Date(Date.now() + 60 * 60 * 1000);
            def.setSeconds(0, 0);
            const defStr = formatLocalDateTime(def);
            section.innerHTML = `
                <div class="reopen-card">
                    <h3>締切を取り消して受付中に戻します</h3>
                    <p class="reopen-desc">新しい締め切り日時を設定してください。空欄にすると締切なし（無期限）になります。</p>
                    <div class="form-group">
                        <label>新しい注文締め切り日時</label>
                        <input type="datetime-local" id="reopenDeadline" value="${defStr}" oninput="updateReopenDeadlineHint()">
                        <div id="reopenDeadlineHint" style="font-size: 0.85em; margin-top: 6px;"></div>
                    </div>
                    <div class="buttons-container">
                        <button class="btn btn-success" onclick="confirmReopen()">受付再開</button>
                        <button class="btn btn-secondary" onclick="cancelReopen()">キャンセル</button>
                    </div>
                </div>
            `;
            updateReopenDeadlineHint();
        };

        window.updateReopenDeadlineHint = function() {
            const v = document.getElementById('reopenDeadline').value;
            document.getElementById('reopenDeadlineHint').innerHTML = deadlineHintHtml(v);
        };

        window.cancelReopen = function() {
            showOrderDetail(currentOrderId);
        };

        window.confirmReopen = async function() {
            const deadlineStr = document.getElementById('reopenDeadline').value;
            // 過去日時のままの再開は意味がないため拒否
            if (deadlineStr) {
                const d = new Date(deadlineStr);
                if (!isNaN(d.getTime()) && d.getTime() <= Date.now()) {
                    alert('締切日時が過去です。未来の日時を指定するか、空欄（無期限）にしてください。');
                    return;
                }
            } else {
                if (!confirm('締切なし（無期限）で受付を再開しますか?')) return;
            }

            const result = await reopenOrderAPI({
                orderId: currentOrderId,
                deadline: inputValueToDeadline(deadlineStr)
            });

            if (result.success) {
                alert('受付中に戻しました');
                showOrderDetail(currentOrderId);
            } else {
                alert(`エラー: ${result.message}`);
            }
        };

        // 集金状態を切り替え
        window.togglePaymentStatus = async function(userName, isPaid) {
            // 確認ダイアログを表示
            const actionText = isPaid ? '集金済み' : '未集金';
            const confirmMessage = `${userName}さんを「${actionText}」に変更しますか？`;
            
            if (!confirm(confirmMessage)) {
                return;
            }
            
            const result = await togglePaymentStatusAPI({
                orderId: currentOrderId,
                userName: userName,
                isPaid: isPaid
            });
            
            if (result.success) {
                // 画面を再読み込み
                showOrderDetail(currentOrderId);
            } else {
                alert(`エラー: ${result.message}`);
            }
        };

        // コピー元候補リストを読み込む
        async function loadCopyOrderList() {
            const select = document.getElementById('copyFromOrder');
            
            const result = await getOrderPages();
            
            if (result.success && result.data.length > 0) {
                select.innerHTML = '<option value="">-- 新規作成 --</option>';
                
                const sortedData = result.data.sort((a, b) => {
                    return b.orderDate.localeCompare(a.orderDate);
                });
                
                sortedData.forEach(order => {
                    const option = document.createElement('option');
                    option.value = order.orderId;
                    const formattedDate = formatDate(order.orderDate);
                    const shopInfo = order.shopName ? ` - ${order.shopName}` : '';
                    option.textContent = `${formattedDate}${shopInfo} - ${order.menus.map(m => m.name).join(', ')}`;
                    option.dataset.menus = JSON.stringify(order.menus);
                    option.dataset.shopName = order.shopName || '';
                    select.appendChild(option);
                });
            }
        }

        // 選択した注文ページから項目を読み込む
        window.loadMenusFromOrder = function() {
            const select = document.getElementById('copyFromOrder');
            const selectedOption = select.options[select.selectedIndex];
            
            if (!selectedOption.value) {
                document.getElementById('newShopName').value = '';
                document.getElementById('menuItems').innerHTML = `
                    <div class="menu-item">
                        <input type="text" placeholder="項目名" class="menu-name">
                        <input type="number" placeholder="価格" class="menu-price" min="0">
                    </div>
                `;
                return;
            }
            
            const menus = JSON.parse(selectedOption.dataset.menus);
            const shopName = selectedOption.dataset.shopName || '';
            
            document.getElementById('newShopName').value = shopName;
            
            const container = document.getElementById('menuItems');
            container.innerHTML = '';
            
            menus.forEach(menu => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.innerHTML = `
                    <input type="text" placeholder="項目名" class="menu-name" value="${menu.name}">
                    <input type="number" placeholder="価格" class="menu-price" min="0" value="${menu.price}">
                    <button onclick="this.parentElement.remove()">削除</button>
                `;
                container.appendChild(menuItem);
            });
        };

        // 注文ページ削除
        window.deleteOrderPage = async function(orderId) {
            if (!confirm('この注文ページを削除しますか?\n関連する注文データもすべて削除されます。\nこの操作は取り消せません。')) {
                return;
            }
            
            const result = await deleteOrderPageAPI({ orderId: orderId });
            
            if (result.success) {
                alert('注文ページを削除しました');
                loadAdminOrderList();
            } else {
                alert(`エラー: ${result.message}`);
            }
        };

        // 注文ページ編集画面を表示
        window.showEditOrderPage = async function(orderId) {
            currentOrderId = orderId;
            
            document.getElementById('orderManagementSection').classList.remove('active');
            document.getElementById('orderDetailSection').classList.add('active');
            
            const container = document.getElementById('orderDetailContent');
            container.innerHTML = '<div class="loading">読み込み中...</div>';
            
            const result = await getOrderDetail({ orderId: orderId });
            
            if (result.success) {
                const orderPage = result.data.orderPage;
                const formattedDate = formatDate(orderPage.orderDate);
                
                let html = `
                    <h2>注文ページ編集</h2>
                    <div class="form-group">
                        <label>日付</label>
                        <input type="date" id="editOrderDate" value="${formattedDate}">
                    </div>
                    <div class="form-group">
                        <label>注文内容</label>
                        <input type="text" id="editShopName" value="${orderPage.shopName || ''}" placeholder="例: お弁当（ほっともっと）">
                    </div>
                    <div class="form-group">
                        <label>注文締め切り日時（任意）</label>
                        <input type="datetime-local" id="editDeadline" value="${deadlineToInputValue(orderPage.deadline)}" oninput="updateEditDeadlineHint()">
                        <div id="editDeadlineHint" style="font-size: 0.85em; margin-top: 6px;"></div>
                    </div>
                    <div class="form-group">
                        <label>メモ（任意）</label>
                        <textarea id="editMemo" placeholder="例： 集金締め切りは4/2(木)までです。" rows="3" style="resize: vertical;">${orderPage.memo || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>項目</label>
                        <div class="menu-items" id="editMenuItems">
                `;
                
                orderPage.menus.forEach(menu => {
                    html += `
                        <div class="menu-item">
                            <input type="text" placeholder="項目名" class="menu-name" value="${menu.name}">
                            <input type="number" placeholder="価格" class="menu-price" min="0" value="${menu.price}">
                            <button onclick="this.parentElement.remove()">削除</button>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                        <button class="btn btn-secondary" onclick="addEditMenuItem()">+ 項目追加</button>
                    </div>
                    <div class="buttons-container">
                        <button class="btn" onclick="saveEditOrderPage()">保存</button>
                        <button class="btn btn-secondary" onclick="showOrderManagement()">キャンセル</button>
                    </div>
                    <div id="editOrderMessage"></div>
                `;
                
                container.innerHTML = html;
                updateEditDeadlineHint();
            } else {
                container.innerHTML = `<div class="error">${result.message}</div>`;
            }
        };

        // 編集画面で項目を追加
        window.addEditMenuItem = function() {
            const container = document.getElementById('editMenuItems');
            const menuItem = document.createElement('div');
            menuItem.className = 'menu-item';
            menuItem.innerHTML = `
                <input type="text" placeholder="項目名" class="menu-name">
                <input type="number" placeholder="価格" class="menu-price" min="0">
                <button onclick="this.parentElement.remove()">削除</button>
            `;
            container.appendChild(menuItem);
        };

        // 注文ページの編集を保存
        window.saveEditOrderPage = async function() {
            const messageEl = document.getElementById('editOrderMessage');
            const orderDate = document.getElementById('editOrderDate').value;
            const shopName = document.getElementById('editShopName').value.trim();
            const memo = document.getElementById('editMemo').value.trim();
            const deadlineStr = document.getElementById('editDeadline').value;

            if (!orderDate) {
                messageEl.innerHTML = '<div class="error">日付を入力してください</div>';
                setTimeout(() => messageEl.innerHTML = '', 3000);
                return;
            }
            
            const menuItems = document.querySelectorAll('#editMenuItems .menu-item');
            const menus = [];
            
            menuItems.forEach(item => {
                const name = item.querySelector('.menu-name').value.trim();
                const price = parseFloat(item.querySelector('.menu-price').value);
                
                if (name && price > 0) {
                    menus.push({ name: name, price: price });
                }
            });
            
            if (menus.length === 0) {
                messageEl.innerHTML = '<div class="error">項目を1つ以上入力してください</div>';
                setTimeout(() => messageEl.innerHTML = '', 3000);
                return;
            }
            
            const result = await editOrderPageAPI({
                orderId: currentOrderId,
                orderDate: orderDate,
                shopName: shopName,
                memo: memo,
                deadline: inputValueToDeadline(deadlineStr),
                menus: menus
            });
            
            if (result.success) {
                messageEl.innerHTML = '<div class="success">注文ページを更新しました</div>';
                setTimeout(() => {
                    showOrderManagement();
                }, 1500);
            } else {
                messageEl.innerHTML = `<div class="error">${result.message}</div>`;
                setTimeout(() => messageEl.innerHTML = '', 3000);
            }
        };

        // 初期化
        window.onload = function() {
            loadOrderList();
        };
    </script>
</body>
</html>
