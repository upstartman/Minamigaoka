<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南ヶ丘注文集計アプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .mode-btn {
            padding: 12px 30px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group input[type="number"],
        .form-group input[type="password"],
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .menu-items {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .menu-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .menu-item input {
            flex: 1;
        }

        .menu-item button {
            padding: 8px 15px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .order-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .order-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .order-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-date {
            font-size: 1em;
            font-weight: bold;
            color: #333;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-open {
            background: #d4edda;
            color: #155724;
        }

        .status-closed {
            background: #f8d7da;
            color: #721c24;
        }

        .user-order.paid {
            background: #d4edda;
            border: 2px solid #28a745;
            border-left: 4px solid #28a745;
        }

        .user-order.paid h4 {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .user-order.paid h4::after {
            content: ' ✓ 集金済';
            color: white;
            font-size: 0.8em;
            margin-left: 10px;
        }

        /* 支払い対象者（負の金額）用スタイル */
        .user-order.payment-target {
            border-left: 4px solid #17a2b8;
        }

        .user-order.payment-target:not(.paid) {
            background: #e7f5ff;
            border: 2px solid #17a2b8;
        }

        .user-order.payment-target.paid {
            background: #d1ecf1;
            border: 2px solid #17a2b8;
            border-left: 4px solid #17a2b8;
        }

        .user-order.payment-target.paid h4 {
            background: linear-gradient(135deg, #17a2b8 0%, #20c997 100%);
        }

        .user-order.payment-target.paid h4::after {
            content: ' ✓ 支払済';
        }

        .btn-paid {
            background: #28a745;
            font-size: 0.85em;
            padding: 6px 12px;
            margin-left: 10px;
        }

        .btn-paid:hover {
            background: #218838;
        }

        .btn-unpaid {
            background: #ffc107;
            color: #333;
            font-size: 0.85em;
            padding: 6px 12px;
            margin-left: 10px;
        }

        .btn-unpaid:hover {
            background: #e0a800;
        }

        .user-order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .user-order-header h4 {
            margin: 0;
        }

        .order-card-body {
            color: #666;
        }

        .order-form-container {
            margin-top: 20px;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .order-table th,
        .order-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .order-table th {
            background: #f8f9fa;
            font-weight: bold;
        }

        .order-table input[type="number"] {
            width: 80px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
        }

        .buttons-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .summary-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .summary-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .user-order-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .user-order {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .user-order h4 {
            margin-bottom: 10px;
            color: #333;
            font-size: 0.95em;
            padding: 6px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 5px;
            display: inline-block;
        }

        .user-order ul {
            list-style: none;
            padding-left: 0;
        }

        .user-order li {
            padding: 5px 0;
            color: #666;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .admin-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .admin-actions button {
            font-size: 0.9em;
            padding: 8px 15px;
        }

        /* スマートフォン向けのスタイル調整 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .header {
                padding: 20px 15px;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
            
            .content {
                padding: 20px 15px;
            }
            
            .order-date {
                font-size: 0.9em;
            }
            
            .status-badge {
                font-size: 0.8em;
                padding: 4px 12px;
            }
            
            .order-card {
                padding: 15px;
            }
            
            .order-card-body {
                font-size: 0.9em;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
            
            .form-group label {
                font-size: 0.95em;
            }
            
            .form-group input[type="text"],
            .form-group input[type="date"],
            .form-group input[type="number"],
            .form-group input[type="password"],
            .form-group select {
                padding: 10px;
                font-size: 14px;
            }
            
            .order-table th,
            .order-table td {
                padding: 10px 8px;
                font-size: 0.9em;
            }
            
            .order-table input[type="number"] {
                width: 60px;
                padding: 6px;
                font-size: 14px;
            }
            
            h2 {
                font-size: 1.3em;
            }
            
            h3 {
                font-size: 1.1em;
            }
            
            .admin-actions {
                flex-wrap: wrap;
            }
            
            .admin-actions button {
                font-size: 0.85em;
                padding: 6px 12px;
            }
        }

        /* より小さい画面向けの調整 */
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            .header {
                padding: 15px 10px;
                margin-bottom: 15px;
            }
            
            .header h1 {
                font-size: 1.3em;
                margin-bottom: 8px;
            }
            
            .content {
                padding: 15px 10px;
            }
            
            .mode-btn {
                padding: 10px 20px;
                font-size: 13px;
            }
            
            .order-date {
                font-size: 0.85em;
            }
            
            .status-badge {
                font-size: 0.75em;
                padding: 3px 10px;
            }
            
            .order-card {
                padding: 12px;
            }
            
            .order-card-body {
                font-size: 0.85em;
            }
            
            .btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            
            .form-group {
                margin-bottom: 15px;
            }
            
            .form-group label {
                font-size: 0.9em;
                margin-bottom: 6px;
            }
            
            .form-group input[type="text"],
            .form-group input[type="date"],
            .form-group input[type="number"],
            .form-group input[type="password"],
            .form-group select {
                padding: 8px;
                font-size: 13px;
            }
            
            .order-table {
                font-size: 0.85em;
            }
            
            .order-table th,
            .order-table td {
                padding: 8px 5px;
            }
            
            .order-table input[type="number"] {
                width: 50px;
                padding: 5px;
                font-size: 13px;
            }
            
            h2 {
                font-size: 1.2em;
                margin-bottom: 15px;
            }
            
            h3 {
                font-size: 1em;
            }
            
            .buttons-container {
                flex-direction: column;
                gap: 8px;
            }
            
            .buttons-container .btn {
                width: 100%;
            }
            
            .admin-actions button {
                font-size: 0.8em;
                padding: 5px 10px;
            }
            
            .back-link {
                font-size: 0.9em;
                margin-bottom: 15px;
            }
            
            .menu-item {
                flex-direction: column;
                gap: 8px;
            }
            
            .menu-item input {
                width: 100%;
            }
            
            .menu-item button {
                width: 100%;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>南ヶ丘注文集計アプリ</h1>
            <div class="mode-selector">
                <button class="mode-btn active" onclick="switchMode('user')">注文画面</button>
                <button class="mode-btn" onclick="switchMode('admin')">管理画面</button>
            </div>
        </div>

        <div class="content">
            <!-- 利用者モード -->
            <div id="userMode" class="section active">
                <div id="orderListSection" class="section active">
                    <h2>注文内容を選択</h2>
                    <div id="orderList" class="order-list">
                        <div class="loading">読み込み中...</div>
                    </div>
                </div>

                <div id="orderFormSection" class="section">
                    <a href="#" class="back-link" onclick="showOrderList(); return false;">← 注文内容選択に戻る</a>
                    <div id="orderFormContent"></div>
                </div>
            </div>

            <!-- 管理者モード -->
            <div id="adminMode" class="section">
                <div id="orderManagementSection" class="section active">
                    <h2>注文管理</h2>
                    <div class="create-button-container" style="margin-bottom: 20px;">
                        <button class="btn btn-success" onclick="showCreateOrderPage()">＋ 新規注文ページ作成</button>
                    </div>
                    <div id="adminOrderList"></div>
                </div>

                <div id="createOrderSection" class="section">
                    <a href="#" class="back-link" onclick="showOrderManagement(); return false;">← 注文管理に戻る</a>
                    <h2>新規注文ページ作成</h2>
                    <div class="form-group">
                        <label>過去の注文からコピーする場合は以下から選択</label>
                        <select id="copyFromOrder" onchange="loadMenusFromOrder()">
                            <option value="">-- 新規作成 --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>日付</label>
                        <input type="date" id="newOrderDate">
                    </div>
                    <div class="form-group">
                        <label>注文内容</label>
                        <input type="text" id="newShopName" placeholder="例: お弁当（ほっともっと）">
                    </div>
                    <div class="form-group">
                        <label>メモ（任意）</label>
                        <textarea id="newMemo" placeholder="例: 締切は3/5(水)までです。" rows="3" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; resize: vertical;"></textarea>
                    </div>
                    <div class="form-group">
                        <label>項目</label>
                        <div class="menu-items" id="menuItems">
                            <div class="menu-item">
                                <input type="text" placeholder="項目名" class="menu-name">
                                <input type="number" placeholder="価格" class="menu-price" min="0">
                            </div>
                        </div>
                        <button class="btn btn-secondary" onclick="addMenuItem()">+ 項目追加</button>
                    </div>
                    <div class="buttons-container">
                        <button class="btn" onclick="createOrderPage()">作成</button>
                        <button class="btn btn-secondary" onclick="showAdminMenu()">キャンセル</button>
                    </div>
                    <div id="createOrderMessage"></div>
                </div>

                <div id="orderDetailSection" class="section">
                    <a href="#" class="back-link" onclick="showOrderManagement(); return false;">← 注文管理に戻る</a>
                    <div id="orderDetailContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            addDoc, 
            getDoc, 
            getDocs, 
            updateDoc, 
            deleteDoc, 
            query, 
            where, 
            orderBy,
            Timestamp 
        } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyACgA83z7xBWICIFLUK1_AwDFL9_EXRJW8",
            authDomain: "minamigaoka-bento.firebaseapp.com",
            projectId: "minamigaoka-bento",
            storageBucket: "minamigaoka-bento.firebasestorage.app",
            messagingSenderId: "160499455872",
            appId: "1:160499455872:web:7ac0b1f07770cc6d121365"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentMode = 'user';
        let currentOrderId = null;

        // UUID生成
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // 日付をそのまま返す
        function formatDate(dateString) {
            return dateString || '';
        }

        // モード切り替え
        window.switchMode = function(mode) {
            currentMode = mode;
            
            // ボタンのアクティブ状態を更新
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // セクションの表示切り替え
            document.getElementById('userMode').classList.remove('active');
            document.getElementById('adminMode').classList.remove('active');

            if (mode === 'user') {
                document.getElementById('userMode').classList.add('active');
                showOrderList();
            } else {
                document.getElementById('adminMode').classList.add('active');
                showOrderManagement();
            }
        };

        // ======================================
        // Firebase Firestore API 関数
        // ======================================

        // 注文ページ一覧取得
        async function getOrderPages() {
            try {
                const querySnapshot = await getDocs(collection(db, 'orderPages'));
                const orderPages = [];
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    orderPages.push({
                        orderId: doc.id,
                        orderDate: data.orderDate,
                        shopName: data.shopName || '',
                        memo: data.memo || '',
                        menus: data.menus || [],
                        status: data.status,
                        createdAt: data.createdAt
                    });
                });

                // 作成日時の新しい順にソート
                orderPages.sort((a, b) => {
                    const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt);
                    const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
                    return dateB - dateA;
                });

                return { success: true, data: orderPages };
            } catch (error) {
                console.error('getOrderPages error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文ページ作成
        async function createOrderPageAPI(params) {
            try {
                const docRef = await addDoc(collection(db, 'orderPages'), {
                    orderDate: params.orderDate,
                    shopName: params.shopName || '',
                    memo: params.memo || '',
                    menus: params.menus,
                    status: 'open',
                    createdAt: Timestamp.now()
                });

                return { 
                    success: true, 
                    message: 'Order page created successfully',
                    data: { orderId: docRef.id, orderDate: params.orderDate }
                };
            } catch (error) {
                console.error('createOrderPage error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文詳細取得
        async function getOrderDetail(params) {
            try {
                const orderId = params.orderId;
                
                // 注文ページを取得
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                
                if (!orderPageDoc.exists()) {
                    return { success: false, message: 'Order page not found' };
                }

                const orderPageData = orderPageDoc.data();
                const orderPage = {
                    orderId: orderId,
                    orderDate: orderPageData.orderDate,
                    shopName: orderPageData.shopName || '',
                    memo: orderPageData.memo || '',
                    menus: orderPageData.menus || [],
                    status: orderPageData.status,
                    createdAt: orderPageData.createdAt
                };

                // この注文ページの注文データを取得
                const ordersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId)
                );
                const ordersSnapshot = await getDocs(ordersQuery);
                const orders = [];

                ordersSnapshot.forEach((doc) => {
                    const data = doc.data();
                    orders.push({
                        id: doc.id,
                        orderId: data.orderId,
                        orderDate: data.orderDate,
                        menuName: data.menuName,
                        price: data.price,
                        userName: data.userName,
                        quantity: data.quantity,
                        timestamp: data.timestamp
                    });
                });

                return { 
                    success: true, 
                    message: 'Order detail retrieved',
                    data: { orderPage, orders }
                };
            } catch (error) {
                console.error('getOrderDetail error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文送信
        async function submitOrderAPI(params) {
            try {
                const orderId = params.orderId;
                const userName = params.userName;
                const orderItems = params.orderItems;

                // 注文ページの状態確認
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                
                if (!orderPageDoc.exists()) {
                    return { success: false, message: 'Order page not found' };
                }

                const orderPageData = orderPageDoc.data();
                if (orderPageData.status === 'closed') {
                    return { success: false, message: 'This order is closed and cannot be modified' };
                }

                // 既存の注文を削除
                const existingOrdersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId),
                    where('userName', '==', userName)
                );
                const existingOrdersSnapshot = await getDocs(existingOrdersQuery);
                
                const deletePromises = [];
                existingOrdersSnapshot.forEach((docSnap) => {

                        }));

                }
                await Promise.all(addPromises);

        async function togglePaymentStatusAPI(params) {
            try {
                const orderId = params.orderId;
                const userName = params.userName;
                const isPaid = params.isPaid;

                // 現在の注文ページを取得
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                
                if (!orderPageDoc.exists()) {
                    return { success: false, message: 'Order page not found' };
                }

                const orderPageData = orderPageDoc.data();
                let paidUsers = orderPageData.paidUsers || [];

                if (isPaid) {
                    // 集金済みにする
                    if (!paidUsers.includes(userName)) {
                        paidUsers.push(userName);
                    }
                } else {
                    // 未集金に戻す
                    paidUsers = paidUsers.filter(u => u !== userName);
                }

                await updateDoc(doc(db, 'orderPages', orderId), {
                    paidUsers: paidUsers
                });

                return { success: true, message: isPaid ? 'Payment recorded' : 'Payment cancelled' };
            } catch (error) {

                return { success: false, message: error.toString() };
            }
        }

        // 注文集計取得
        async function getOrderSummary(params) {
            try {
                const orderId = params.orderId;

                // 注文ページを取得
                const orderPageDoc = await getDoc(doc(db, 'orderPages', orderId));
                
                if (!orderPageDoc.exists()) {
                    return { success: false, message: 'Order page not found' };
                }

                const orderPageData = orderPageDoc.data();
                const orderPage = {
                    orderId: orderId,
                    orderDate: orderPageData.orderDate,
                    shopName: orderPageData.shopName || '',
                    memo: orderPageData.memo || '',
                    menus: orderPageData.menus || [],
                    status: orderPageData.status,
                    paidUsers: orderPageData.paidUsers || []
                };

                // 注文データを取得
                const ordersQuery = query(
                    collection(db, 'orders'),
                    where('orderId', '==', orderId)
                );
                const ordersSnapshot = await getDocs(ordersQuery);

                const menuSummary = {};
                const userOrders = {};
                let totalAmount = 0;

                // 項目ごとの集計初期化
                for (let menu of orderPage.menus) {
                    menuSummary[menu.name] = {
                        menuName: menu.name,
                        price: menu.price,
                        totalQuantity: 0,
                        totalAmount: 0
                    };
                }

                // 注文データを集計
                ordersSnapshot.forEach((doc) => {
                    const data = doc.data();
                    const menuName = data.menuName;
                    const price = data.price;
                    const userName = data.userName;
                    const quantity = data.quantity;

                    // 項目別集計
                    if (menuSummary[menuName]) {
                        menuSummary[menuName].totalQuantity += quantity;
                        menuSummary[menuName].totalAmount += price * quantity;
                    }

                    // ユーザー別集計
                    if (!userOrders[userName]) {
                        userOrders[userName] = [];
                    }
                    userOrders[userName].push({
                        menuName: menuName,
                        price: price,
                        quantity: quantity,
                        amount: price * quantity
                    });

                    totalAmount += price * quantity;
                });

                return { 
                    success: true, 
                    message: 'Order summary retrieved',
                    data: {
                        orderPage: orderPage,
                        menuSummary: Object.values(menuSummary),
                        userOrders: userOrders,
                        totalAmount: totalAmount
                    }
                };
            } catch (error) {
                console.error('getOrderSummary error:', error);
                return { success: false, message: error.toString() };
            }
        }

            currentOrderId = orderId;
            
            document.getElementById('orderManagementSection').classList.remove('active');
            document.getElementById('orderDetailSection').classList.add('active');
            
            const container = document.getElementById('orderDetailContent');
            container.innerHTML = '<div class="loading">読み込み中...</div>';
            
            const result = await getOrderSummary({ orderId: orderId });
            
            if (result.success) {
                const orderPage = result.data.orderPage;
                const menuSummary = result.data.menuSummary;
                const userOrders = result.data.userOrders;
                const totalAmount = result.data.totalAmount;
                const formattedDate = formatDate(orderPage.orderDate);
                const shopInfo = orderPage.shopName ? ` - ${orderPage.shopName}` : '';
                
                // サマリー用の計算を先に行う
                const totalQuantity = menuSummary.reduce((sum, menu) => sum + menu.totalQuantity, 0);
                const totalUsers = Object.keys(userOrders).length;
                
                let html = `
                    <h2>${formattedDate}${shopInfo}の注文詳細</h2>
                    <div class="order-summary-header" style="display: flex; gap: 15px; flex-wrap: wrap; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 12px 15px; border-radius: 10px; margin: 15px 0; color: white;">
                        <div style="text-align: center; min-width: 60px;">
                            <div style="font-size: 1.3em; font-weight: bold;">${totalUsers}</div>
                            <div style="font-size: 0.75em; opacity: 0.9;">注文人数</div>
                        </div>
                        <div style="text-align: center; min-width: 60px;">
                            <div style="font-size: 1.3em; font-weight: bold;">${totalQuantity}</div>
                            <div style="font-size: 0.75em; opacity: 0.9;">合計数量</div>
                        </div>
                        <div style="text-align: center; min-width: 80px;">
                            <div style="font-size: 1.3em; font-weight: bold;">¥${totalAmount.toLocaleString()}</div>
                            <div style="font-size: 0.75em; opacity: 0.9;">合計金額</div>
                        </div>
                        <div style="display: flex; align-items: center; margin-left: auto;">
                            <span class="status-badge ${orderPage.status === 'open' ? 'status-open' : 'status-closed'}" style="font-size: 0.9em;">${orderPage.status === 'open' ? '受付中' : '締切済'}</span>
                        </div>
                    </div>
                `;
                
                if (orderPage.status === 'open') {
                    html += '<button class="btn btn-danger" onclick="closeOrder()">この注文を締め切る</button>';
                } else {
                    html += '<button class="btn btn-success" onclick="reopenOrder()">締切を取り消す（受付中に戻す）</button>';
                }
                
                // 項目別集計
                html += `
                    <div class="summary-section">
                        <h3>項目別集計</h3>
                        <table class="order-table">
                            <thead>
                                <tr>
                                    <th>項目</th>
                                    <th>単価</th>
                                    <th>数量</th>
                                    <th>小計</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                menuSummary.forEach(menu => {
                    const priceDisplay = menu.price < 0 
                        ? `<span style="color: #17a2b8;">-¥${Math.abs(menu.price).toLocaleString()}</span>`
                        : `¥${menu.price.toLocaleString()}`;
                    const totalDisplay = menu.totalAmount < 0 
                        ? `<span style="color: #17a2b8;">-¥${Math.abs(menu.totalAmount).toLocaleString()}</span>`
                        : `¥${menu.totalAmount.toLocaleString()}`;
                    html += `
                        <tr>
                            <td>${menu.menuName}</td>
                            <td>${priceDisplay}</td>
                            <td>${menu.totalQuantity}</td>
                            <td>${totalDisplay}</td>
                        </tr>
                    `;
                });
                
                html += `
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th colspan="2">合計</th>
                                    <th>${totalQuantity}</th>
                                    <th>¥${totalAmount.toLocaleString()}</th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;
                
                // ユーザー別注文
                const paidUsers = orderPage.paidUsers || [];
                const paidCount = Object.keys(userOrders).filter(u => paidUsers.includes(u)).length;
                
                // 未集金・未支払の合計金額を計算
                let unpaidCollectAmount = 0;  // 未集金額（正の金額）
                let unpaidPaymentAmount = 0;  // 未支払額（負の金額）
                for (let userName in userOrders) {
                    if (!paidUsers.includes(userName)) {
                        let userTotal = 0;
                        userOrders[userName].forEach(order => {
                            userTotal += order.amount;
                        });
                        if (userTotal > 0) {
                            unpaidCollectAmount += userTotal;
                        } else {
                            unpaidPaymentAmount += Math.abs(userTotal);
                        }
                    }
                }
                
                let paymentSummaryHtml = `<p><strong>完了状況:</strong> ${paidCount} / ${totalUsers} 人</p>`;
                if (unpaidCollectAmount > 0) {
                    paymentSummaryHtml += `<p><strong>未集金額:</strong> <span style="color: #dc3545;">¥${unpaidCollectAmount.toLocaleString()}</span></p>`;
                }
                if (unpaidPaymentAmount > 0) {
                    paymentSummaryHtml += `<p><strong>未支払額:</strong> <span style="color: #17a2b8;">¥${unpaidPaymentAmount.toLocaleString()}</span></p>`;
                }
                if (unpaidCollectAmount === 0 && unpaidPaymentAmount === 0 && totalUsers > 0) {
                    paymentSummaryHtml += `<p style="color: #28a745;"><strong>✅ 全員完了！</strong></p>`;
                }
                
                html += `
                    <div class="user-order-section">
                        <h3>ユーザー別注文</h3>
                        <div class="payment-summary" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                            ${paymentSummaryHtml}
                        </div>
                `;
                
                for (let userName in userOrders) {
                    const orders = userOrders[userName];
                    let userTotal = 0;
                    orders.forEach(order => userTotal += order.amount);
                    
                    const isPaid = paidUsers.includes(userName);
                    const escapedUserName = userName.replace(/'/g, "\\'");
                    const isPayment = userTotal < 0; // 負の金額=支払い対象
                    
                    // 支払い対象者用のスタイル
                    let cardClass = isPaid ? 'paid' : '';
                    if (isPayment) cardClass += ' payment-target';
                    
                    // ボタンラベルを集金/支払いで切り替え
                    const paidLabel = isPayment ? '支払済みにする' : '集金済みにする';
                    const unpaidLabel = isPayment ? '未支払に戻す' : '未集金に戻す';
                    
                    html += `
                        <div class="user-order ${cardClass}">
                            <div class="user-order-header">
                                <h4>${userName}${isPayment ? ' <span style="background: #28a745; color: white; font-size: 0.7em; padding: 2px 8px; border-radius: 10px; margin-left: 5px;">支払</span>' : ''}</h4>
                                ${isPaid 
                                    ? `<button class="btn btn-unpaid" onclick="togglePaymentStatus('${escapedUserName}', false)">${unpaidLabel}</button>`
                                    : `<button class="btn btn-paid" onclick="togglePaymentStatus('${escapedUserName}', true)">${paidLabel}</button>`
                                }
                            </div>
                            <ul>
                    `;
                    
                    orders.forEach(order => {
                        const amountDisplay = order.amount < 0 
                            ? `<span style="color: #28a745;">-¥${Math.abs(order.amount).toLocaleString()}</span>`
                            : `¥${order.amount.toLocaleString()}`;
                        html += `<li>${order.menuName} × ${order.quantity} = ${amountDisplay}</li>`;
                    });
                    
                    const totalDisplay = userTotal < 0
                        ? `<span style="color: #28a745;">-¥${Math.abs(userTotal).toLocaleString()}</span>（支払い）`
                        : `¥${userTotal.toLocaleString()}`;
                    
                    html += `
                            </ul>
                            <p><strong>小計: ${totalDisplay}</strong></p>
                        </div>
                    `;
                }
                
                html += '</div>';
                
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="error">${result.message}</div>`;
            }
        };

        // 注文締切
        window.closeOrder = async function() {
            if (!confirm('この注文を締め切りますか?締め切ると利用者は注文を変更できなくなります。')) {
                return;
            }
            
            const result = await closeOrderAPI({ orderId: currentOrderId });
            
            if (result.success) {
                alert('注文を締め切りました');
                showOrderDetail(currentOrderId);
            } else {
                alert(`エラー: ${result.message}`);
            }
        };

        // 締切を取り消す
        window.reopenOrder = async function() {
            if (!confirm('締切を取り消して受付中に戻しますか?')) {
                return;
            }
            
            const result = await reopenOrderAPI({ orderId: currentOrderId });
            
            if (result.success) {
                alert('受付中に戻しました');
                showOrderDetail(currentOrderId);
            } else {
                alert(`エラー: ${result.message}`);
            }
        };

        // 集金状態を切り替え
        window.togglePaymentStatus = async function(userName, isPaid) {
            // 確認ダイアログを表示
            const actionText = isPaid ? '集金済み' : '未集金';
            const confirmMessage = `${userName}さんを「${actionText}」に変更しますか？`;
            
            if (!confirm(confirmMessage)) {
                return;
            }
            
            const result = await togglePaymentStatusAPI({
                orderId: currentOrderId,
                userName: userName,
                isPaid: isPaid
            });
            
            if (result.success) {
                // 画面を再読み込み
                showOrderDetail(currentOrderId);
            } else {
                alert(`エラー: ${result.message}`);
            }
        };

        // コピー元候補リストを読み込む
        async function loadCopyOrderList() {
            const select = document.getElementById('copyFromOrder');
            
            const result = await getOrderPages();
            
            if (result.success && result.data.length > 0) {
                select.innerHTML = '<option value="">-- 新規作成 --</option>';
                
                const sortedData = result.data.sort((a, b) => {
                    return b.orderDate.localeCompare(a.orderDate);
                });
                
                sortedData.forEach(order => {
                    const option = document.createElement('option');
                    option.value = order.orderId;
                    const formattedDate = formatDate(order.orderDate);
                    const shopInfo = order.shopName ? ` - ${order.shopName}` : '';
                    option.textContent = `${formattedDate}${shopInfo} - ${order.menus.map(m => m.name).join(', ')}`;
                    option.dataset.menus = JSON.stringify(order.menus);
                    option.dataset.shopName = order.shopName || '';
                    select.appendChild(option);
                });
            }
        }

        // 選択した注文ページから項目を読み込む
        window.loadMenusFromOrder = function() {
            const select = document.getElementById('copyFromOrder');
            const selectedOption = select.options[select.selectedIndex];
            
            if (!selectedOption.value) {
                document.getElementById('newShopName').value = '';
                document.getElementById('menuItems').innerHTML = `
                    <div class="menu-item">
                        <input type="text" placeholder="項目名" class="menu-name">
                        <input type="number" placeholder="価格" class="menu-price" min="0">
                    </div>
                `;
                return;
            }
            
            const menus = JSON.parse(selectedOption.dataset.menus);
            const shopName = selectedOption.dataset.shopName || '';
            
            document.getElementById('newShopName').value = shopName;
            
            const container = document.getElementById('menuItems');
            container.innerHTML = '';
            
            menus.forEach(menu => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.innerHTML = `
                    <input type="text" placeholder="項目名" class="menu-name" value="${menu.name}">
                    <input type="number" placeholder="価格" class="menu-price" min="0" value="${menu.price}">
                    <button onclick="this.parentElement.remove()">削除</button>
                `;
                container.appendChild(menuItem);
            });
        };

        // 注文ページ削除
        window.deleteOrderPage = async function(orderId) {
            if (!confirm('この注文ページを削除しますか?\n関連する注文データもすべて削除されます。\nこの操作は取り消せません。')) {
                return;
            }
            
            const result = await deleteOrderPageAPI({ orderId: orderId });
            
            if (result.success) {
                alert('注文ページを削除しました');
                loadAdminOrderList();
            } else {
                alert(`エラー: ${result.message}`);
            }
        };

        // 注文ページ編集画面を表示
        window.showEditOrderPage = async function(orderId) {
            currentOrderId = orderId;
            
            document.getElementById('orderManagementSection').classList.remove('active');
            document.getElementById('orderDetailSection').classList.add('active');
            
            const container = document.getElementById('orderDetailContent');
            container.innerHTML = '<div class="loading">読み込み中...</div>';
            
            const result = await getOrderDetail({ orderId: orderId });
            
            if (result.success) {
                const orderPage = result.data.orderPage;
                const formattedDate = formatDate(orderPage.orderDate);
                
                let html = `
                    <h2>注文ページ編集</h2>
                    <div class="form-group">
                        <label>日付</label>
                        <input type="date" id="editOrderDate" value="${formattedDate}">
                    </div>
                    <div class="form-group">
                        <label>注文内容</label>
                        <input type="text" id="editShopName" value="${orderPage.shopName || ''}" placeholder="例: お弁当（ほっともっと）">
                    </div>
                    <div class="form-group">
                        <label>メモ（任意）</label>
                        <textarea id="editMemo" placeholder="例: 締切は3/5(水)までです。" rows="3" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; resize: vertical;">${orderPage.memo || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>項目</label>
                        <div class="menu-items" id="editMenuItems">
                `;
                
                orderPage.menus.forEach(menu => {
                    html += `
                        <div class="menu-item">
                            <input type="text" placeholder="項目名" class="menu-name" value="${menu.name}">
                            <input type="number" placeholder="価格" class="menu-price" min="0" value="${menu.price}">
                            <button onclick="this.parentElement.remove()">削除</button>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                        <button class="btn btn-secondary" onclick="addEditMenuItem()">+ 項目追加</button>
                    </div>
                    <div class="buttons-container">
                        <button class="btn" onclick="saveEditOrderPage()">保存</button>
                        <button class="btn btn-secondary" onclick="showOrderManagement()">キャンセル</button>
                    </div>
                    <div id="editOrderMessage"></div>
                `;
                
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="error">${result.message}</div>`;
            }
        };

        // 編集画面で項目を追加
        window.addEditMenuItem = function() {
            const container = document.getElementById('editMenuItems');
            const menuItem = document.createElement('div');
            menuItem.className = 'menu-item';
            menuItem.innerHTML = `
                <input type="text" placeholder="項目名" class="menu-name">
                <input type="number" placeholder="価格" class="menu-price" min="0">
                <button onclick="this.parentElement.remove()">削除</button>
            `;
            container.appendChild(menuItem);
        };

        // 注文ページの編集を保存
        window.saveEditOrderPage = async function() {
            const messageEl = document.getElementById('editOrderMessage');
            const orderDate = document.getElementById('editOrderDate').value;
            const shopName = document.getElementById('editShopName').value.trim();
            const memo = document.getElementById('editMemo').value.trim();
            
            if (!orderDate) {
                messageEl.innerHTML = '<div class="error">日付を入力してください</div>';
                setTimeout(() => messageEl.innerHTML = '', 3000);
                return;
            }
            
            const menuItems = document.querySelectorAll('#editMenuItems .menu-item');
            const menus = [];
            
            menuItems.forEach(item => {
                const name = item.querySelector('.menu-name').value.trim();
                const price = parseFloat(item.querySelector('.menu-price').value);
                
                if (name && price > 0) {
                    menus.push({ name: name, price: price });
                }
            });
            
            if (menus.length === 0) {
                messageEl.innerHTML = '<div class="error">項目を1つ以上入力してください</div>';
                setTimeout(() => messageEl.innerHTML = '', 3000);
                return;
            }
            
            const result = await editOrderPageAPI({
                orderId: currentOrderId,
                orderDate: orderDate,
                shopName: shopName,
                memo: memo,
                menus: menus
            });
            
            if (result.success) {
                messageEl.innerHTML = '<div class="success">注文ページを更新しました</div>';
                setTimeout(() => {
                    showOrderManagement();
                }, 1500);
            } else {
                messageEl.innerHTML = `<div class="error">${result.message}</div>`;
                setTimeout(() => messageEl.innerHTML = '', 3000);
            }
        };

        // 初期化
        window.onload = function() {
            loadOrderList();
        };
    </script>
</body>
</html>
