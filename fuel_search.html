<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カタログ燃費検索</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f0;
    --card: #ffffff;
    --accent: #1a5632;
    --accent-light: #e8f0eb;
    --text: #2c2c2c;
    --text-sub: #6b6b6b;
    --border: #e0ddd5;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.02em;
    margin-bottom: 0.3rem;
  }

  header h1 span {
    display: inline-block;
    font-size: 1.1rem;
    margin-left: 0.4rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 500;
    color: var(--text);
  }

  header p {
    font-size: 0.82rem;
    color: var(--text-sub);
    font-weight: 300;
  }

  .search-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
  }

  .search-box label {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-sub);
    margin-bottom: 0.5rem;
    letter-spacing: 0.04em;
  }

  .input-row {
    display: flex;
    gap: 0.6rem;
  }

  .input-row input {
    flex: 1;
    padding: 0.7rem 1rem;
    font-size: 1rem;
    font-family: 'Noto Sans JP', sans-serif;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
    background: var(--bg);
  }

  .input-row input:focus {
    border-color: var(--accent);
  }

  .input-row button {
    padding: 0.7rem 1.4rem;
    font-size: 0.9rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .input-row button:hover { opacity: 0.85; }
  .input-row button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .examples {
    margin-top: 0.8rem;
    font-size: 0.75rem;
    color: var(--text-sub);
  }

  .examples span {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    margin: 0.15rem 0.2rem 0.15rem 0;
    cursor: pointer;
    transition: background 0.15s;
    font-weight: 500;
  }

  .examples span:hover {
    background: #d0e2d6;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 2rem;
    display: none;
  }

  .loading.active { display: block; }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 0.8rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p {
    font-size: 0.85rem;
    color: var(--text-sub);
  }

  /* Result */
  .result {
    display: none;
  }

  .result.active { display: block; }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .result-header {
    background: var(--accent);
    color: #fff;
    padding: 1rem 1.5rem;
  }

  .result-header h2 {
    font-size: 1.15rem;
    font-weight: 700;
  }

  .result-header .sub {
    font-size: 0.78rem;
    opacity: 0.8;
    margin-top: 0.15rem;
  }

  .result-body {
    padding: 1.2rem 1.5rem;
  }

  .result-body .section {
    margin-bottom: 1.2rem;
  }

  .result-body .section:last-child {
    margin-bottom: 0;
  }

  .result-body .section-title {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--border);
  }

  .fuel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }

  .fuel-item {
    background: var(--bg);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
  }

  .fuel-item .label {
    font-size: 0.7rem;
    color: var(--text-sub);
    font-weight: 500;
  }

  .fuel-item .value {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
    margin-top: 0.1rem;
  }

  .fuel-item .value small {
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-sub);
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 0.4rem 0;
    font-size: 0.88rem;
    border-bottom: 1px dashed var(--border);
  }

  .info-row:last-child { border-bottom: none; }

  .info-row .key {
    color: var(--text-sub);
    font-weight: 300;
  }

  .info-row .val {
    font-weight: 600;
  }

  .note {
    font-size: 0.72rem;
    color: var(--text-sub);
    margin-top: 0.8rem;
    line-height: 1.6;
  }

  /* Error */
  .error {
    display: none;
    background: #fdf2f2;
    border: 1px solid #e8c5c5;
    border-radius: 10px;
    padding: 1rem 1.2rem;
    font-size: 0.85rem;
    color: #8b3a3a;
  }

  .error.active { display: block; }

  /* History */
  .history {
    margin-top: 1.5rem;
    display: none;
  }

  .history.active { display: block; }

  .history h3 {
    font-size: 0.78rem;
    color: var(--text-sub);
    font-weight: 500;
    margin-bottom: 0.5rem;
  }

  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .history-list span {
    font-size: 0.75rem;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .history-list span:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  footer {
    text-align: center;
    margin-top: 2.5rem;
    font-size: 0.7rem;
    color: var(--text-sub);
    font-weight: 300;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>⛽ Fuel Search <span>カタログ燃費検索</span></h1>
    <p>車種名を入力すると、カタログ燃費とエンジン情報を検索します</p>
  </header>

  <div class="search-box">
    <label>車種名（メーカー名 + 車種名で精度UP）</label>
    <div class="input-row">
      <input type="text" id="carInput" placeholder="例: ホンダ フィット" autocomplete="off">
      <button id="searchBtn" onclick="doSearch()">検索</button>
    </div>
    <div class="examples">
      例:
      <span onclick="quickSearch('ホンダ フィット')">ホンダ フィット</span>
      <span onclick="quickSearch('トヨタ ヤリスクロス')">トヨタ ヤリスクロス</span>
      <span onclick="quickSearch('日産 ノート')">日産 ノート</span>
      <span onclick="quickSearch('マツダ CX-5')">マツダ CX-5</span>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Web検索中...</p>
  </div>

  <div class="error" id="error"></div>

  <div class="result" id="result"></div>

  <div class="history" id="history">
    <h3>検索履歴</h3>
    <div class="history-list" id="historyList"></div>
  </div>

  <footer>
    Powered by Claude API + Web Search ｜ 検索結果は参考値です。正確な値はメーカー公式サイトをご確認ください。
  </footer>
</div>

<script>
const API_URL = "https://api.anthropic.com/v1/messages";
const searchHistory = [];

const inputEl = document.getElementById('carInput');
const btnEl = document.getElementById('searchBtn');

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch();
});

function quickSearch(name) {
  inputEl.value = name;
  doSearch();
}

async function doSearch() {
  const carName = inputEl.value.trim();
  if (!carName) return;

  // UI state
  show('loading');
  hide('error');
  hide('result');
  btnEl.disabled = true;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        tools: [{ type: "web_search_20250305", name: "web_search" }],
        messages: [{
          role: "user",
          content: `「${carName}」の現行モデルについて、以下の情報をJSON形式のみで回答してください。前後の説明文やMarkdownバッククォートは不要です。

必ず以下のJSON構造で返してください:
{
  "car_name": "正式車種名",
  "maker": "メーカー名",
  "model_year": "現行モデルの年式またはモデル期間",
  "engine": {
    "type": "エンジン種別（ガソリン/ハイブリッド/ディーゼル/EV等）",
    "displacement": "排気量（例: 1.5L）",
    "detail": "エンジン型式や補足"
  },
  "fuel_economy": {
    "wltc": "WLTCモード燃費（km/L）。グレードにより幅がある場合は範囲で記載",
    "wltc_city": "WLTC市街地モード（km/L）※わかれば",
    "wltc_suburban": "WLTC郊外モード（km/L）※わかれば",
    "wltc_highway": "WLTC高速道路モード（km/L）※わかれば",
    "jc08": "JC08モード燃費（km/L）※わかれば"
  },
  "grades": "代表的なグレードと燃費の違い（簡潔に）",
  "source_note": "情報の出典や補足"
}

検索して最新のカタログ値を調べてください。不明な項目は "—" としてください。`
        }]
      })
    });

    const data = await response.json();

    if (data.error) {
      throw new Error(data.error.message || 'API Error');
    }

    // Extract text content
    const textBlocks = data.content.filter(b => b.type === 'text');
    const text = textBlocks.map(b => b.text).join('\n');

    // Parse JSON from response
    const clean = text.replace(/```json|```/g, '').trim();
    let info;
    try {
      info = JSON.parse(clean);
    } catch {
      // Try to find JSON in the text
      const match = clean.match(/\{[\s\S]*\}/);
      if (match) {
        info = JSON.parse(match[0]);
      } else {
        throw new Error('検索結果の解析に失敗しました。車種名を変えて再度お試しください。');
      }
    }

    renderResult(info);
    addHistory(carName);

  } catch (err) {
    showError(err.message || '検索に失敗しました。しばらくしてから再度お試しください。');
  } finally {
    btnEl.disabled = false;
    hide('loading');
  }
}

function renderResult(info) {
  const fe = info.fuel_economy || {};
  const eng = info.engine || {};

  let fuelGridHTML = '';

  if (fe.wltc && fe.wltc !== '—') {
    fuelGridHTML += fuelItem('WLTC 総合', fe.wltc);
  }
  if (fe.wltc_city && fe.wltc_city !== '—') {
    fuelGridHTML += fuelItem('市街地', fe.wltc_city);
  }
  if (fe.wltc_suburban && fe.wltc_suburban !== '—') {
    fuelGridHTML += fuelItem('郊外', fe.wltc_suburban);
  }
  if (fe.wltc_highway && fe.wltc_highway !== '—') {
    fuelGridHTML += fuelItem('高速道路', fe.wltc_highway);
  }
  if (fe.jc08 && fe.jc08 !== '—') {
    fuelGridHTML += fuelItem('JC08', fe.jc08);
  }

  if (!fuelGridHTML) {
    fuelGridHTML = '<div class="fuel-item" style="grid-column:1/-1"><div class="label">燃費情報</div><div class="value" style="font-size:0.9rem;color:var(--text-sub)">取得できませんでした</div></div>';
  }

  const html = `
    <div class="result-card">
      <div class="result-header">
        <h2>${esc(info.car_name || '—')}</h2>
        <div class="sub">${esc(info.maker || '')} ${esc(info.model_year || '')}</div>
      </div>
      <div class="result-body">
        <div class="section">
          <div class="section-title">カタログ燃費</div>
          <div class="fuel-grid">${fuelGridHTML}</div>
        </div>
        <div class="section">
          <div class="section-title">エンジン・パワートレイン</div>
          <div class="info-row"><span class="key">種別</span><span class="val">${esc(eng.type || '—')}</span></div>
          <div class="info-row"><span class="key">排気量</span><span class="val">${esc(eng.displacement || '—')}</span></div>
          <div class="info-row"><span class="key">詳細</span><span class="val">${esc(eng.detail || '—')}</span></div>
        </div>
        ${info.grades && info.grades !== '—' ? `
        <div class="section">
          <div class="section-title">グレード別の違い</div>
          <p style="font-size:0.85rem;line-height:1.7">${esc(info.grades)}</p>
        </div>` : ''}
        <div class="note">
          ※ ${esc(info.source_note || 'カタログ値のため実燃費とは異なる場合があります')}
        </div>
      </div>
    </div>
  `;

  const el = document.getElementById('result');
  el.innerHTML = html;
  show('result');
}

function fuelItem(label, value) {
  // Extract numeric part for display
  const numMatch = String(value).match(/[\d.]+/);
  const unit = String(value).includes('km') ? '' : ' <small>km/L</small>';
  return `<div class="fuel-item">
    <div class="label">${esc(label)}</div>
    <div class="value">${esc(String(value))}${value.toString().includes('km/L') ? '' : unit}</div>
  </div>`;
}

function addHistory(name) {
  if (!searchHistory.includes(name)) {
    searchHistory.unshift(name);
    if (searchHistory.length > 10) searchHistory.pop();
  }
  renderHistory();
}

function renderHistory() {
  if (searchHistory.length === 0) return;
  const el = document.getElementById('historyList');
  el.innerHTML = searchHistory.map(n => `<span onclick="quickSearch('${esc(n)}')">${esc(n)}</span>`).join('');
  show('history');
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('active');
}

function show(id) { document.getElementById(id).classList.add('active'); }
function hide(id) { document.getElementById(id).classList.remove('active'); }

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>

</body>
</html>
