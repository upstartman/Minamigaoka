<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お弁当注文システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .mode-btn {
            padding: 12px 30px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group input[type="number"],
        .form-group input[type="password"],
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .menu-items {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .menu-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .menu-item input {
            flex: 1;
        }

        .menu-item button {
            padding: 8px 15px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .order-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .order-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .order-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-date {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-open {
            background: #d4edda;
            color: #155724;
        }

        .status-closed {
            background: #f8d7da;
            color: #721c24;
        }

        .order-card-body {
            color: #666;
        }

        .order-form-container {
            margin-top: 20px;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .order-table th,
        .order-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .order-table th {
            background: #f8f9fa;
            font-weight: bold;
        }

        .order-table input[type="number"] {
            width: 80px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
        }

        .buttons-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .summary-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .summary-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .user-order-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .user-order {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .user-order h4 {
            margin-bottom: 10px;
            color: #333;
        }

        .user-order ul {
            list-style: none;
            padding-left: 0;
        }

        .user-order li {
            padding: 5px 0;
            color: #666;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .admin-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .admin-actions button {
            font-size: 0.9em;
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍱 お弁当注文システム</h1>
            <div class="mode-selector">
                <button class="mode-btn active" onclick="switchMode('user')">注文画面</button>
                <button class="mode-btn" onclick="switchMode('admin')">管理画面</button>
            </div>
        </div>

        <div class="content">
            <!-- 利用者モード -->
            <div id="userMode" class="section active">
                <div id="orderListSection" class="section active">
                    <h2>注文する日付を選択</h2>
                    <div id="orderList" class="order-list">
                        <div class="loading">読み込み中...</div>
                    </div>
                </div>

                <div id="orderFormSection" class="section">
                    <a href="#" class="back-link" onclick="showOrderList(); return false;">← 日付選択に戻る</a>
                    <div id="orderFormContent"></div>
                </div>
            </div>

            <!-- 管理者モード -->
            <div id="adminMode" class="section">
                <div id="adminMenuSection" class="section active">
                    <h2>管理メニュー</h2>
                    <div class="buttons-container">
                        <button class="btn" onclick="showCreateOrderPage()">新規注文ページ作成</button>
                        <button class="btn" onclick="showOrderManagement()">注文管理</button>
                    </div>
                </div>

                <div id="createOrderSection" class="section">
                    <a href="#" class="back-link" onclick="showAdminMenu(); return false;">← メニューに戻る</a>
                    <h2>新規注文ページ作成</h2>
                    <div class="form-group">
                        <label>過去のページからコピー（オプション）</label>
                        <select id="copyFromOrder" onchange="loadMenusFromOrder()">
                            <option value="">-- 新規作成 --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>日付</label>
                        <input type="date" id="newOrderDate">
                    </div>
                    <div class="form-group">
                        <label>お店の名前（オプション）</label>
                        <input type="text" id="newShopName" placeholder="例: ほっともっと、ほっかほっか亭">
                    </div>
                    <div class="form-group">
                        <label>メニュー</label>
                        <div class="menu-items" id="menuItems">
                            <div class="menu-item">
                                <input type="text" placeholder="メニュー名" class="menu-name">
                                <input type="number" placeholder="価格" class="menu-price" min="0">
                            </div>
                        </div>
                        <button class="btn btn-secondary" onclick="addMenuItem()">+ メニュー追加</button>
                    </div>
                    <div class="buttons-container">
                        <button class="btn" onclick="createOrderPage()">作成</button>
                        <button class="btn btn-secondary" onclick="showAdminMenu()">キャンセル</button>
                    </div>
                    <div id="createOrderMessage"></div>
                </div>

                <div id="orderManagementSection" class="section">
                    <a href="#" class="back-link" onclick="showAdminMenu(); return false;">← メニューに戻る</a>
                    <h2>注文管理</h2>
                    <div id="adminOrderList"></div>
                </div>

                <div id="orderDetailSection" class="section">
                    <a href="#" class="back-link" onclick="showOrderManagement(); return false;">← 注文管理に戻る</a>
                    <div id="orderDetailContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API URL（デプロイしたGoogle Apps ScriptのURL）
        const API_URL = 'https://script.google.com/macros/s/AKfycbxShYvxn14ojRkRKk6gU91PI7frEgQHJVTUFTzLC7I2Imy_GDTr_Vn1hsiPQD3t7vEoBw/exec';

        let currentMode = 'user';
        let currentOrderId = null;

        // モード切り替え
        function switchMode(mode) {
            currentMode = mode;
            
            // ボタンのアクティブ状態を更新
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // セクションの表示切り替え
            document.getElementById('userMode').classList.remove('active');
            document.getElementById('adminMode').classList.remove('active');

            if (mode === 'user') {
                document.getElementById('userMode').classList.add('active');
                // 利用者モードに切り替えたら、最初から読み込み直す
                showOrderList();
            } else {
                document.getElementById('adminMode').classList.add('active');
                showAdminMenu();
            }
        }

        // 日付をそのまま返す（Apps Scriptから取得した日付をそのまま表示）
        function formatDate(dateString) {
            return dateString || '';
        }

        // API呼び出し（GETリクエスト）
        async function callAPI(action, params = {}) {
            try {
                const url = new URL(API_URL);
                url.searchParams.append('action', action);
                if (Object.keys(params).length > 0) {
                    url.searchParams.append('data', JSON.stringify(params));
                }
                
                const response = await fetch(url.toString());
                const result = await response.json();
                return result;
            } catch (error) {
                console.error('API Error:', error);
                return { success: false, message: error.toString() };
            }
        }

        // 注文リスト表示（利用者向け）
        async function loadOrderList() {
            const container = document.getElementById('orderList');
            container.innerHTML = '<div class="loading">読み込み中...</div>';

            const result = await callAPI('getOrderPages');

            if (result.success) {
                // 日付の新しい順にソート（文字列比較でYYYY-MM-DD形式を直接比較）
                const sortedData = result.data.sort((a, b) => {
                    return b.orderDate.localeCompare(a.orderDate);
                });

                if (sortedData.length === 0) {
                    container.innerHTML = '<p>現在注文可能な日付はありません。</p>';
                    return;
                }

                let html = '';
                sortedData.forEach(order => {
                    const statusClass = order.status === 'open' ? 'status-open' : 'status-closed';
                    const statusText = order.status === 'open' ? '受付中' : '締切済';
                    const formattedDate = formatDate(order.orderDate);
                    const shopInfo = order.shopName ? ` - ${order.shopName}` : '';
                    
                    html += `
                        <div class="order-card" onclick="${order.status === 'open' ? `showOrderForm('${order.orderId}')` : ''}">
                            <div class="order-card-header">
                                <div class="order-date">${formattedDate}${shopInfo}</div>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="order-card-body">
                                メニュー: ${order.menus.map(m => m.name).join(', ')}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="error">${result.message}</div>`;
            }
        }

        // 注文リストを表示
        function showOrderList() {
            document.getElementById('orderListSection').classList.add('active');
            document.getElementById('orderFormSection').classList.remove('active');
            // 最新データを読み込み
            loadOrderList();
        }

        // 注文フォーム表示
        async function showOrderForm(orderId) {
            currentOrderId = orderId;
            
            document.getElementById('orderListSection').classList.remove('active');
            document.getElementById('orderFormSection').classList.add('active');

            const container = document.getElementById('orderFormContent');
            container.innerHTML = '<div class="loading">読み込み中...</div>';

            const result = await callAPI('getOrderDetail', { orderId: orderId });

            if (result.success) {
                const orderPage = result.data.orderPage;
                const formattedDate = formatDate(orderPage.orderDate);
                const shopInfo = orderPage.shopName ? ` - ${orderPage.shopName}` : '';
                
                // ユーザー一覧を取得
                const userListResult = await callAPI('getUserList', { orderId: orderId });
                const existingUsers = userListResult.success ? userListResult.data : [];

                let html = `
                    <h2>${formattedDate}${shopInfo}の注文</h2>
                    <div class="form-group">
                        <label>名前</label>
                        <select id="userNameSelect" onchange="handleUserSelection()">
                            <option value="">-- 新規入力 --</option>
                `;
                
                existingUsers.forEach(user => {
                    html += `<option value="${user}">${user}</option>`;
                });
                
                html += `
                        </select>
                    </div>
                    <div class="form-group" id="userNameInputGroup">
                        <label>名前を入力</label>
                        <input type="text" id="userName" placeholder="山田太郎">
                    </div>
                    <div class="form-group">
                        <label>注文内容</label>
                        <table class="order-table">
                            <thead>
                                <tr>
                                    <th>メニュー</th>
                                    <th>価格</th>
                                    <th>数量</th>
                                    <th>小計</th>
                                </tr>
                            </thead>
                            <tbody id="orderTableBody">
                `;

                orderPage.menus.forEach((menu, index) => {
                    html += `
                        <tr>
                            <td>${menu.name}</td>
                            <td>¥${menu.price.toLocaleString()}</td>
                            <td>
                                <input type="number" 
                                    id="quantity_${index}" 
                                    data-menu-name="${menu.name}"
                                    data-price="${menu.price}"
                                    min="0" 
                                    value="0"
                                    onchange="updateTotal()">
                            </td>
                            <td id="subtotal_${index}">¥0</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th colspan="3">合計</th>
                                    <th id="orderTotal">¥0</th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <div class="buttons-container">
                        <button class="btn" onclick="submitOrder()">注文する</button>
                    </div>
                    <div id="orderMessage"></div>
                `;

                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="error">${result.message}</div>`;
            }
        }

        // ユーザー選択時の処理
        async function handleUserSelection() {
            const select = document.getElementById('userNameSelect');
            const selectedUser = select.value;
            const userNameInput = document.getElementById('userName');
            const userNameInputGroup = document.getElementById('userNameInputGroup');

            if (selectedUser === '') {
                // 新規入力の場合
                userNameInputGroup.style.display = 'block';
                userNameInput.value = '';
                // 数量を0にリセット
                resetQuantities();
            } else {
                // 既存ユーザーを選択した場合
                userNameInputGroup.style.display = 'none';
                userNameInput.value = selectedUser;
                // 前回の注文内容を読み込む
                await loadPreviousOrder(selectedUser);
            }
        }

        // 前回の注文内容を読み込む
        async function loadPreviousOrder(userName) {
            const result = await callAPI('getOrderDetail', { orderId: currentOrderId });
            
            if (result.success) {
                const orders = result.data.orders;
                
                // まず全ての数量を0にリセット
                resetQuantities();
                
                // 該当ユーザーの注文を探して数量を設定
                orders.forEach(order => {
                    if (order.userName === userName) {
                        const inputs = document.querySelectorAll('[data-menu-name]');
                        inputs.forEach(input => {
                            if (input.dataset.menuName === order.menuName) {
                                input.value = order.quantity;
                            }
                        });
                    }
                });
                
                // 合計を更新
                updateTotal();
            }
        }

        // 数量を0にリセット
        function resetQuantities() {
            const inputs = document.querySelectorAll('[data-menu-name]');
            inputs.forEach(input => {
                input.value = 0;
            });
            updateTotal();
        }

        // 合計計算
        function updateTotal() {
            let total = 0;
            const inputs = document.querySelectorAll('[data-menu-name]');
            
            inputs.forEach((input, index) => {
                const quantity = parseInt(input.value) || 0;
                const price = parseFloat(input.dataset.price);
                const subtotal = quantity * price;
                
                document.getElementById(`subtotal_${index}`).textContent = `¥${subtotal.toLocaleString()}`;
                total += subtotal;
            });

            document.getElementById('orderTotal').textContent = `¥${total.toLocaleString()}`;
        }

        // 注文送信
        async function submitOrder() {
            const messageEl = document.getElementById('orderMessage');
            const userNameSelect = document.getElementById('userNameSelect');
            const userNameInput = document.getElementById('userName');
            const userName = userNameInput.value.trim();

            if (!userName) {
                messageEl.innerHTML = '<div class="error">名前を入力してください</div>';
                setTimeout(() => messageEl.innerHTML = '', 3000);
                return;
            }

            const orderItems = [];
            const inputs = document.querySelectorAll('[data-menu-name]');
            
            inputs.forEach(input => {
                const quantity = parseInt(input.value) || 0;
                if (quantity > 0) {
                    orderItems.push({
                        menuName: input.dataset.menuName,
                        price: parseFloat(input.dataset.price),
                        quantity: quantity
                    });
                }
            });

            if (orderItems.length === 0) {
                messageEl.innerHTML = '<div class="error">数量を1つ以上入力してください</div>';
                setTimeout(() => messageEl.innerHTML = '', 3000);
                return;
            }

            const result = await callAPI('submitOrder', {
                orderId: currentOrderId,
                userName: userName,
                orderItems: orderItems
            });

            if (result.success) {
                messageEl.innerHTML = '<div class="success">注文を送信しました！</div>';
                setTimeout(() => {
                    // 注文完了後、日付選択画面に戻る
                    showOrderList();
                }, 1500);
            } else {
                messageEl.innerHTML = `<div class="error">${result.message}</div>`;
                setTimeout(() => messageEl.innerHTML = '', 3000);
            }
        }

        // 管理者メニュー表示
        function showAdminMenu() {
            document.getElementById('adminMenuSection').classList.add('active');
            document.getElementById('createOrderSection').classList.remove('active');
            document.getElementById('orderManagementSection').classList.remove('active');
            document.getElementById('orderDetailSection').classList.remove('active');
        }

        // 新規注文ページ作成画面表示
        async function showCreateOrderPage() {
            document.getElementById('adminMenuSection').classList.remove('active');
            document.getElementById('createOrderSection').classList.add('active');
            
            // コピー元候補をロード
            await loadCopyOrderList();
            
            // フォームをリセット
            document.getElementById('newOrderDate').value = '';
            document.getElementById('newShopName').value = '';
            document.getElementById('menuItems').innerHTML = `
                <div class="menu-item">
                    <input type="text" placeholder="メニュー名" class="menu-name">
                    <input type="number" placeholder="価格" class="menu-price" min="0">
                </div>
            `;
            document.getElementById('createOrderMessage').innerHTML = '';
        }

        // メニュー項目追加
        function addMenuItem() {
            const container = document.getElementById('menuItems');
            const menuItem = document.createElement('div');
            menuItem.className = 'menu-item';
            menuItem.innerHTML = `
                <input type="text" placeholder="メニュー名" class="menu-name">
                <input type="number" placeholder="価格" class="menu-price" min="0">
                <button onclick="this.parentElement.remove()">削除</button>
            `;
            container.appendChild(menuItem);
        }

        // 注文ページ作成
        async function createOrderPage() {
            const messageEl = document.getElementById('createOrderMessage');
            const orderDate = document.getElementById('newOrderDate').value;
            const shopName = document.getElementById('newShopName').value.trim();

            if (!orderDate) {
                messageEl.innerHTML = '<div class="error">日付を入力してください</div>';
                setTimeout(() => messageEl.innerHTML = '', 3000);
                return;
            }

            const menuItems = document.querySelectorAll('#menuItems .menu-item');
            const menus = [];

            menuItems.forEach(item => {
                const name = item.querySelector('.menu-name').value.trim();
                const price = parseFloat(item.querySelector('.menu-price').value);

                if (name && price > 0) {
                    menus.push({ name: name, price: price });
                }
            });

            if (menus.length === 0) {
                messageEl.innerHTML = '<div class="error">メニューを1つ以上入力してください</div>';
                setTimeout(() => messageEl.innerHTML = '', 3000);
                return;
            }

            const result = await callAPI('createOrderPage', {
                orderDate: orderDate,
                shopName: shopName,
                menus: menus
            });

            if (result.success) {
                messageEl.innerHTML = '<div class="success">注文ページを作成しました！</div>';
                setTimeout(() => {
                    showAdminMenu();
                }, 1500);
            } else {
                messageEl.innerHTML = `<div class="error">${result.message}</div>`;
                setTimeout(() => messageEl.innerHTML = '', 3000);
            }
        }

        // 注文管理画面表示
        async function showOrderManagement() {
            document.getElementById('adminMenuSection').classList.remove('active');
            document.getElementById('orderManagementSection').classList.add('active');
            document.getElementById('orderDetailSection').classList.remove('active');
            
            // 最新データを読み込み
            await loadAdminOrderList();
        }

        // 管理者用注文リスト読み込み
        async function loadAdminOrderList() {
            const container = document.getElementById('adminOrderList');
            container.innerHTML = '<div class="loading">読み込み中...</div>';

            const result = await callAPI('getOrderPages');

            if (result.success) {
                // 日付の新しい順にソート（文字列比較でYYYY-MM-DD形式を直接比較）
                const sortedData = result.data.sort((a, b) => {
                    return b.orderDate.localeCompare(a.orderDate);
                });

                if (sortedData.length === 0) {
                    container.innerHTML = '<p>注文ページがありません。</p>';
                    return;
                }

                let html = '';
                sortedData.forEach(order => {
                    const statusClass = order.status === 'open' ? 'status-open' : 'status-closed';
                    const statusText = order.status === 'open' ? '受付中' : '締切済';
                    const formattedDate = formatDate(order.orderDate);
                    const shopInfo = order.shopName ? ` - ${order.shopName}` : '';
                    
                    html += `
                        <div class="order-card">
                            <div class="order-card-header">
                                <div class="order-date">${formattedDate}${shopInfo}</div>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="order-card-body">
                                メニュー: ${order.menus.map(m => m.name).join(', ')}
                            </div>
                            <div class="admin-actions">
                                <button class="btn" onclick="showOrderDetail('${order.orderId}')">詳細</button>
                                <button class="btn" onclick="showEditOrderPage('${order.orderId}')">編集</button>
                                <button class="btn btn-danger" onclick="deleteOrderPage('${order.orderId}')">削除</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="error">${result.message}</div>`;
            }
        }

        // 注文詳細表示
        async function showOrderDetail(orderId) {
            currentOrderId = orderId;
            
            document.getElementById('orderManagementSection').classList.remove('active');
            document.getElementById('orderDetailSection').classList.add('active');
            
            const container = document.getElementById('orderDetailContent');
            container.innerHTML = '<div class="loading">読み込み中...</div>';
            
            const result = await callAPI('getOrderSummary', { orderId: orderId });
            
            if (result.success) {
                const orderPage = result.data.orderPage;
                const menuSummary = result.data.menuSummary;
                const userOrders = result.data.userOrders;
                const totalAmount = result.data.totalAmount;
                const formattedDate = formatDate(orderPage.orderDate);
                const shopInfo = orderPage.shopName ? ` - ${orderPage.shopName}` : '';
                
                let html = `
                    <h2>${formattedDate}${shopInfo}の注文詳細</h2>
                    <p>ステータス: <span class="status-badge ${orderPage.status === 'open' ? 'status-open' : 'status-closed'}">${orderPage.status === 'open' ? '受付中' : '締切済'}</span></p>
                `;
                
                if (orderPage.status === 'open') {
                    html += '<button class="btn btn-danger" onclick="closeOrder()">この注文を締め切る</button>';
                } else {
                    html += '<button class="btn btn-success" onclick="reopenOrder()">締切を取り消す（受付中に戻す）</button>';
                }
                
                // メニュー別集計
                html += `
                    <div class="summary-section">
                        <h3>メニュー別集計</h3>
                        <table class="order-table">
                            <thead>
                                <tr>
                                    <th>メニュー</th>
                                    <th>単価</th>
                                    <th>数量</th>
                                    <th>小計</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                menuSummary.forEach(menu => {
                    html += `
                        <tr>
                            <td>${menu.menuName}</td>
                            <td>¥${menu.price.toLocaleString()}</td>
                            <td>${menu.totalQuantity}</td>
                            <td>¥${menu.totalAmount.toLocaleString()}</td>
                        </tr>
                    `;
                });
                
                html += `
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th colspan="3">合計</th>
                                    <th>¥${totalAmount.toLocaleString()}</th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;
                
                // ユーザー別注文
                html += '<div class="user-order-section"><h3>ユーザー別注文</h3>';
                
                for (let userName in userOrders) {
                    const orders = userOrders[userName];
                    let userTotal = 0;
                    
                    html += `
                        <div class="user-order">
                            <h4>${userName}</h4>
                            <ul>
                    `;
                    
                    orders.forEach(order => {
                        html += `<li>${order.menuName} × ${order.quantity} = ¥${order.amount.toLocaleString()}</li>`;
                        userTotal += order.amount;
                    });
                    
                    html += `
                            </ul>
                            <p><strong>小計: ¥${userTotal.toLocaleString()}</strong></p>
                        </div>
                    `;
                }
                
                html += '</div>';
                
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="error">${result.message}</div>`;
            }
        }

        // 注文締切
        async function closeOrder() {
            if (!confirm('この注文を締め切りますか?締め切ると利用者は注文を変更できなくなります。')) {
                return;
            }
            
            const result = await callAPI('closeOrder', {
                orderId: currentOrderId
            });
            
            if (result.success) {
                alert('注文を締め切りました');
                // 詳細画面を再読み込み
                showOrderDetail(currentOrderId);
            } else {
                alert(`エラー: ${result.message}`);
            }
        }

        // 締切を取り消す（受付中に戻す）
        async function reopenOrder() {
            if (!confirm('締切を取り消して受付中に戻しますか?')) {
                return;
            }
            
            const result = await callAPI('reopenOrder', {
                orderId: currentOrderId
            });
            
            if (result.success) {
                alert('受付中に戻しました');
                // 詳細画面を再読み込み
                showOrderDetail(currentOrderId);
            } else {
                alert(`エラー: ${result.message}`);
            }
        }

        // コピー元候補リストを読み込む
        async function loadCopyOrderList() {
            const select = document.getElementById('copyFromOrder');
            
            const result = await callAPI('getOrderPages');
            
            if (result.success && result.data.length > 0) {
                select.innerHTML = '<option value="">-- 新規作成 --</option>';
                
                // 日付の新しい順にソート（文字列比較でYYYY-MM-DD形式を直接比較）
                const sortedData = result.data.sort((a, b) => {
                    return b.orderDate.localeCompare(a.orderDate);
                });
                
                sortedData.forEach(order => {
                    const option = document.createElement('option');
                    option.value = order.orderId;
                    const formattedDate = formatDate(order.orderDate);
                    const shopInfo = order.shopName ? ` - ${order.shopName}` : '';
                    option.textContent = `${formattedDate}${shopInfo} - ${order.menus.map(m => m.name).join(', ')}`;
                    option.dataset.menus = JSON.stringify(order.menus);
                    option.dataset.shopName = order.shopName || '';
                    select.appendChild(option);
                });
            }
        }

        // 選択した注文ページからメニューを読み込む
        function loadMenusFromOrder() {
            const select = document.getElementById('copyFromOrder');
            const selectedOption = select.options[select.selectedIndex];
            
            if (!selectedOption.value) {
                // 新規作成を選択した場合はリセット
                document.getElementById('newShopName').value = '';
                document.getElementById('menuItems').innerHTML = `
                    <div class="menu-item">
                        <input type="text" placeholder="メニュー名" class="menu-name">
                        <input type="number" placeholder="価格" class="menu-price" min="0">
                    </div>
                `;
                return;
            }
            
            const menus = JSON.parse(selectedOption.dataset.menus);
            const shopName = selectedOption.dataset.shopName || '';
            
            // お店の名前を設定
            document.getElementById('newShopName').value = shopName;
            
            const container = document.getElementById('menuItems');
            container.innerHTML = '';
            
            menus.forEach(menu => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.innerHTML = `
                    <input type="text" placeholder="メニュー名" class="menu-name" value="${menu.name}">
                    <input type="number" placeholder="価格" class="menu-price" min="0" value="${menu.price}">
                    <button onclick="this.parentElement.remove()">削除</button>
                `;
                container.appendChild(menuItem);
            });
        }

        // 注文ページ削除
        async function deleteOrderPage(orderId) {
            if (!confirm('この注文ページを削除しますか?\n関連する注文データもすべて削除されます。\nこの操作は取り消せません。')) {
                return;
            }
            
            const result = await callAPI('deleteOrderPage', {
                orderId: orderId
            });
            
            if (result.success) {
                alert('注文ページを削除しました');
                // 注文管理画面を再読み込み
                loadAdminOrderList();
            } else {
                alert(`エラー: ${result.message}`);
            }
        }

        // 注文ページ編集画面を表示
        async function showEditOrderPage(orderId) {
            currentOrderId = orderId;
            
            document.getElementById('orderManagementSection').classList.remove('active');
            document.getElementById('orderDetailSection').classList.add('active');
            
            const container = document.getElementById('orderDetailContent');
            container.innerHTML = '<div class="loading">読み込み中...</div>';
            
            const result = await callAPI('getOrderDetail', { orderId: orderId });
            
            if (result.success) {
                const orderPage = result.data.orderPage;
                const formattedDate = formatDate(orderPage.orderDate);
                
                let html = `
                    <h2>注文ページ編集</h2>
                    <div class="form-group">
                        <label>日付</label>
                        <input type="date" id="editOrderDate" value="${formattedDate}">
                    </div>
                    <div class="form-group">
                        <label>お店の名前（オプション）</label>
                        <input type="text" id="editShopName" value="${orderPage.shopName || ''}" placeholder="例: ほっともっと、ほっかほっか亭">
                    </div>
                    <div class="form-group">
                        <label>メニュー</label>
                        <div class="menu-items" id="editMenuItems">
                `;
                
                orderPage.menus.forEach(menu => {
                    html += `
                        <div class="menu-item">
                            <input type="text" placeholder="メニュー名" class="menu-name" value="${menu.name}">
                            <input type="number" placeholder="価格" class="menu-price" min="0" value="${menu.price}">
                            <button onclick="this.parentElement.remove()">削除</button>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                        <button class="btn btn-secondary" onclick="addEditMenuItem()">+ メニュー追加</button>
                    </div>
                    <div class="buttons-container">
                        <button class="btn" onclick="saveEditOrderPage()">保存</button>
                        <button class="btn btn-secondary" onclick="showOrderManagement()">キャンセル</button>
                    </div>
                    <div id="editOrderMessage"></div>
                `;
                
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="error">${result.message}</div>`;
            }
        }

        // 編集画面でメニュー項目を追加
        function addEditMenuItem() {
            const container = document.getElementById('editMenuItems');
            const menuItem = document.createElement('div');
            menuItem.className = 'menu-item';
            menuItem.innerHTML = `
                <input type="text" placeholder="メニュー名" class="menu-name">
                <input type="number" placeholder="価格" class="menu-price" min="0">
                <button onclick="this.parentElement.remove()">削除</button>
            `;
            container.appendChild(menuItem);
        }

        // 注文ページの編集を保存
        async function saveEditOrderPage() {
            const messageEl = document.getElementById('editOrderMessage');
            const orderDate = document.getElementById('editOrderDate').value;
            const shopName = document.getElementById('editShopName').value.trim();
            
            if (!orderDate) {
                messageEl.innerHTML = '<div class="error">日付を入力してください</div>';
                setTimeout(() => messageEl.innerHTML = '', 3000);
                return;
            }
            
            const menuItems = document.querySelectorAll('#editMenuItems .menu-item');
            const menus = [];
            
            menuItems.forEach(item => {
                const name = item.querySelector('.menu-name').value.trim();
                const price = parseFloat(item.querySelector('.menu-price').value);
                
                if (name && price > 0) {
                    menus.push({ name: name, price: price });
                }
            });
            
            if (menus.length === 0) {
                messageEl.innerHTML = '<div class="error">メニューを1つ以上入力してください</div>';
                setTimeout(() => messageEl.innerHTML = '', 3000);
                return;
            }
            
            const result = await callAPI('editOrderPage', {
                orderId: currentOrderId,
                orderDate: orderDate,
                shopName: shopName,
                menus: menus
            });
            
            if (result.success) {
                messageEl.innerHTML = '<div class="success">注文ページを更新しました</div>';
                setTimeout(() => {
                    // 更新後、注文管理画面に戻る
                    showOrderManagement();
                }, 1500);
            } else {
                messageEl.innerHTML = `<div class="error">${result.message}</div>`;
                setTimeout(() => messageEl.innerHTML = '', 3000);
            }
        }

        // 初期化
        window.onload = function() {
            loadOrderList();
        };
    </script>
</body>
</html>
