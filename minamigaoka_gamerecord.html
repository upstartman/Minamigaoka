<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合結果入力フォーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #666;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            bottom: -2px;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .year-link {
            text-align: center;
            margin-bottom: 25px;
        }

        .year-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 15px;
            border: 2px solid #667eea;
            border-radius: 20px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .year-link a:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .score-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .footer-info h4 {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .url-display {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #333;
            word-break: break-all;
            line-height: 1.6;
            border: 1px solid #e0e0e0;
        }

        .url-display.not-configured {
            color: #e74c3c;
            font-family: inherit;
            font-style: italic;
        }

        .url-display.configured {
            color: #28a745;
        }

        .preview-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-header h3 {
            margin: 0;
            color: #333;
        }

        .reload-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reload-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .reload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .preview-container {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table thead {
            background: #667eea;
            color: white;
        }

        .data-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .data-table tbody tr:hover {
            background: #f8f9fa;
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* 勝敗列のスタイル */
        .result-cell {
            font-weight: 700;
            text-align: center;
        }

        .result-win {
            color: #28a745;
            background: #d4edda;
        }

        .result-lose {
            color: #fd7e14;
            background: #fff3cd;
        }

        .result-draw {
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #667eea;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: #e74c3c;
        }

        .data-count {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        .stats-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
        }

        .stats-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat-value {
                font-size: 20px;
            }
        }

        .required {
            color: #e74c3c;
        }

        .config-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .config-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .config-section small {
            color: #666;
            display: block;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .score-group {
                grid-template-columns: 1fr;
            }

            .tabs {
                gap: 5px;
            }

            .tab {
                padding: 10px 16px;
                font-size: 14px;
            }

            .preview-header {
                justify-content: center;
            }

            .reload-btn {
                width: auto;
            }

            .data-table {
                font-size: 12px;
            }

            .data-table th,
            .data-table td {
                padding: 8px;
            }
        }

        /* 編集・削除ボタン */
        .action-btns {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .edit-btn, .delete-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .edit-btn {
            background: #667eea;
            color: white;
        }

        .edit-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .delete-btn:hover {
            background: #c0392b;
            transform: translateY(-1px);
        }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            color: #333;
            font-size: 22px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #999;
            cursor: pointer;
            line-height: 1;
            padding: 0;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn.primary {
            background: #667eea;
            color: white;
        }

        .modal-btn.primary:hover {
            background: #5568d3;
        }

        .modal-btn.secondary {
            background: #e0e0e0;
            color: #333;
        }

        .modal-btn.secondary:hover {
            background: #d0d0d0;
        }

        .modal-btn.danger {
            background: #e74c3c;
            color: white;
        }

        .modal-btn.danger:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏀 南ヶ丘MBC試合結果記録アプリ(2025年度)</h1>
        <p class="subtitle">南ヶ丘MBCの試合データを記録/閲覧</p>
        <div class="year-link">
            <a href="https://upstartman.github.io/minamigaoka/minamigaoka_gamerecord_2026.html" target="_blank">📅 2026年度データ</a>
        </div>
        <div class="year-link">
            <a href="https://youtube.com/playlist?list=PLpQLKhKt0bVLFcCulOTLxv7M3orfU1_iG&si=EkTkFlnivNJeQ8W4" target="_blank">🎥 南ヶ丘MBC (2025年) 大会試合</a>
        </div>
        <div class="year-link">
            <a href="https://youtube.com/playlist?list=PLpQLKhKt0bVIm54PezkFCuG0eW7CdToro&si=mYgX2qR6QhSbBETJ" target="_blank">🎥 南ヶ丘MBC (2025年) 練習試合</a>
        </div>

        <!-- タブナビゲーション -->
        <div class="tabs">
            <button class="tab" onclick="switchTab('form')" disabled style="opacity: 0.5; cursor: not-allowed;">📝 データ入力</button>
            <button class="tab active" onclick="switchTab('preview')">📊 データ閲覧</button>
        </div>

        <!-- データ入力タブ -->
        <div id="formTab" class="tab-content">
            <form id="matchForm">
            <div class="form-group">
                <label for="date">日付 <span class="required">*</span></label>
                <input type="date" id="date" name="date" required />
            </div>

            <div class="form-group">
                <label for="tournament">大会名 <span class="required">*</span></label>
                <input type="text" id="tournament" name="tournament" placeholder="例：練習試合" required />
            </div>

            <div class="form-group">
                <label for="venue">会場 <span class="required">*</span></label>
                <input type="text" id="venue" name="venue" placeholder="例：南小学校" required />
            </div>

            <div class="form-group">
                <label for="opponent">対戦チーム名 <span class="required">*</span></label>
                <input type="text" id="opponent" name="opponent" placeholder="例：西が岡" required />
            </div>

            <div class="form-group">
                <label>スコア <span class="required">*</span></label>
                <div class="score-group">
                    <div>
                        <input type="number" id="scoreMinamiGaoka" name="scoreMinamiGaoka" placeholder="南ヶ丘" min="0" required />
                    </div>
                    <div>
                        <input type="number" id="scoreOpponent" name="scoreOpponent" placeholder="対戦チーム" min="0" required />
                    </div>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">データを追加</button>
        </form>

        <div id="statusMessage" class="status-message"></div>
        </div>

        <!-- データプレビュータブ -->
        <div id="previewTab" class="tab-content active">
            <div class="preview-header">
                <button class="reload-btn" onclick="loadPreviewData()">🔄 更新</button>
            </div>
            
            <div id="previewContent">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>データを読み込んでいます...</p>
                </div>
            </div>
            
            <div class="data-count" id="dataCount"></div>
        </div>

        <div class="footer-info">
            <h4>📡 設定情報</h4>
            <div id="urlDisplay" class="url-display"></div>
        </div>
    </div>

    <!-- 編集モーダル -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ データを編集</h2>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editRowIndex">
                
                <div class="form-group">
                    <label for="editDate">日付 <span class="required">*</span></label>
                    <input type="date" id="editDate" required />
                </div>

                <div class="form-group">
                    <label for="editTournament">大会名 <span class="required">*</span></label>
                    <input type="text" id="editTournament" required />
                </div>

                <div class="form-group">
                    <label for="editVenue">会場 <span class="required">*</span></label>
                    <input type="text" id="editVenue" required />
                </div>

                <div class="form-group">
                    <label for="editOpponent">対戦チーム名 <span class="required">*</span></label>
                    <input type="text" id="editOpponent" required />
                </div>

                <div class="form-group">
                    <label>スコア <span class="required">*</span></label>
                    <div class="score-group">
                        <div>
                            <input type="number" id="editScoreMinamiGaoka" placeholder="南ヶ丘" min="0" required />
                        </div>
                        <div>
                            <input type="number" id="editScoreOpponent" placeholder="対戦チーム" min="0" required />
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="modal-btn secondary" onclick="closeEditModal()">キャンセル</button>
                    <button type="submit" class="modal-btn primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🗑️ データを削除</h2>
                <button class="close-btn" onclick="closeDeleteModal()">&times;</button>
            </div>
            <p style="margin: 20px 0; color: #666;">このデータを削除してもよろしいですか？</p>
            <div id="deletePreview" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 15px 0;"></div>
            <input type="hidden" id="deleteRowIndex">
            <div class="modal-actions">
                <button type="button" class="modal-btn secondary" onclick="closeDeleteModal()">キャンセル</button>
                <button type="button" class="modal-btn danger" onclick="confirmDelete()">削除</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 設定: ここにGoogle Apps Script URLを設定してください =====
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx-kwAD0ZNPc-bq3k5j6ILqqqjZ7q7R38fWDAvi0VxjNeXJJNzGxxgEMC6wgnU700L5/exec';
        // ============================================================

        // LocalStorageから値を読み込み
        window.addEventListener('DOMContentLoaded', () => {
            // 大会名と会場名を復元
            const savedTournament = localStorage.getItem('tournament');
            if (savedTournament) {
                document.getElementById('tournament').value = savedTournament;
            }

            const savedVenue = localStorage.getItem('venue');
            if (savedVenue) {
                document.getElementById('venue').value = savedVenue;
            }

            // 今日の日付をデフォルトで設定
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;

            // URL情報を表示
            displayScriptUrl();
        });

        // タブ切り替え
        function switchTab(tabName) {
            // すべてのタブとコンテンツを非アクティブに
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // 選択されたタブをアクティブに
            if (tabName === 'form') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('formTab').classList.add('active');
            } else if (tabName === 'preview') {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('previewTab').classList.add('active');
                // プレビュータブを開いたときにデータを読み込む
                loadPreviewData();
            }
        }

        // プレビューデータを読み込む
        async function loadPreviewData() {
            if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                showPreviewError('Google Apps Script URLが設定されていません');
                return;
            }

            const previewContent = document.getElementById('previewContent');
            const dataCount = document.getElementById('dataCount');
            
            // ローディング表示
            previewContent.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>データを読み込んでいます...</p>
                </div>
            `;
            dataCount.textContent = '';

            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();

                if (result.status === 'success') {
                    if (result.data && result.data.length > 0) {
                        displayPreviewData(result.data, result.stats);
                        dataCount.textContent = `${result.count}件のデータ`;
                    } else {
                        showPreviewEmpty();
                    }
                } else {
                    showPreviewError(result.message || 'データの取得に失敗しました');
                }
            } catch (error) {
                console.error('Preview error:', error);
                showPreviewError('データの読み込み中にエラーが発生しました');
            }
        }

        // プレビューデータを表示
        function displayPreviewData(data, stats) {
            const previewContent = document.getElementById('previewContent');
            
            let html = '';
            
            // 集計情報を表示（J1~N2）
            if (stats && stats.length === 2) {
                const labels = stats[0]; // 1行目：ラベル
                const values = stats[1]; // 2行目：値
                
                html += `
                    <div class="stats-container">
                        <h3 class="stats-title">📊 集計情報</h3>
                        <div class="stats-grid">
                `;
                
                for (let i = 0; i < labels.length && i < values.length; i++) {
                    if (labels[i] !== '' || values[i] !== '') {
                        const label = String(labels[i]);
                        let value = values[i];
                        
                        // 勝率の場合はパーセント表示にフォーマット
                        if (label.includes('勝率') || label.toLowerCase().includes('rate') || label.toLowerCase().includes('win')) {
                            value = formatPercentage(value);
                        } else {
                            value = String(value);
                        }
                        
                        html += `
                            <div class="stat-item">
                                <div class="stat-label">${escapeHtml(label)}</div>
                                <div class="stat-value">${escapeHtml(value)}</div>
                            </div>
                        `;
                    }
                }
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            // データテーブルを表示
            html += `
                <div class="preview-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>日付</th>
                                <th>大会名</th>
                                <th>会場</th>
                                <th>対戦チーム</th>
                                <th>南ヶ丘</th>
                                <th>対戦相手</th>
                                <th>勝敗</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            data.forEach(row => {
                // 日付をスラッシュ区切りに変換
                const formattedDate = formatDateForDisplay(row.date);
                
                // 勝敗に応じたクラスを決定
                const result = String(row.result || '').trim();
                let resultClass = 'result-cell';
                if (result === '勝' || result === '勝ち') {
                    resultClass += ' result-win';
                } else if (result === '負' || result === '負け') {
                    resultClass += ' result-lose';
                } else if (result === '引き分け' || result === '分') {
                    resultClass += ' result-draw';
                }
                
                html += `
                    <tr>
                        <td>${escapeHtml(formattedDate)}</td>
                        <td>${escapeHtml(row.tournament)}</td>
                        <td>${escapeHtml(row.venue)}</td>
                        <td>${escapeHtml(row.opponent)}</td>
                        <td>${escapeHtml(row.scoreMinamiGaoka)}</td>
                        <td>${escapeHtml(row.scoreOpponent)}</td>
                        <td class="${resultClass}">${escapeHtml(result)}</td>
                        <td>
                            <div class="action-btns">
                                <button class="edit-btn" onclick='openEditModal(${JSON.stringify(row)})'>編集</button>
                                <button class="delete-btn" onclick='openDeleteModal(${JSON.stringify(row)})'>削除</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            html += `
                        </tbody>
                    </table>
                </div>
            `;
            
            previewContent.innerHTML = html;
        }

        // パーセント表示にフォーマット（小数点以下2桁）
        function formatPercentage(value) {
            if (value === '' || value === null || value === undefined) {
                return '';
            }
            
            try {
                let numValue = parseFloat(value);
                
                // 既にパーセント値（0-100の範囲）の場合
                if (numValue > 1) {
                    return numValue.toFixed(2) + '%';
                }
                
                // 小数（0-1の範囲）の場合は100倍してパーセント表示
                return (numValue * 100).toFixed(2) + '%';
            } catch (error) {
                // 数値に変換できない場合はそのまま返す
                return String(value);
            }
        }

        // 日付をYYYY/MM/DD形式でフォーマット
        function formatDateForDisplay(dateStr) {
            if (!dateStr) return '';
            
            try {
                // 既にYYYY/MM/DD形式の場合はそのまま返す
                if (/^\d{4}\/\d{2}\/\d{2}$/.test(dateStr)) {
                    return dateStr;
                }
                
                // YYYY-MM-DD形式の場合はスラッシュに変換
                if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                    return dateStr.replace(/-/g, '/');
                }
                
                // ISO形式（YYYY-MM-DDTHH:mm:ss.sssZ）の場合
                if (dateStr.includes('T')) {
                    const date = new Date(dateStr);
                    if (!isNaN(date.getTime())) {
                        const year = date.getFullYear();
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        const day = String(date.getDate()).padStart(2, '0');
                        return `${year}/${month}/${day}`;
                    }
                }
                
                // その他の形式の場合もDateオブジェクトとしてパース
                const date = new Date(dateStr);
                if (!isNaN(date.getTime())) {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}/${month}/${day}`;
                }
                
                // パースできない場合は元の文字列を返す
                return dateStr;
            } catch (error) {
                console.error('Date formatting error:', error);
                return dateStr;
            }
        }

        // 空のデータ表示
        function showPreviewEmpty() {
            const previewContent = document.getElementById('previewContent');
            previewContent.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <p>データがまだありません</p>
                    <p style="font-size: 14px; color: #999;">データ入力タブから試合結果を追加してください</p>
                </div>
            `;
        }

        // エラー表示
        function showPreviewError(message) {
            const previewContent = document.getElementById('previewContent');
            previewContent.innerHTML = `
                <div class="error-state">
                    <div class="empty-state-icon">⚠️</div>
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
        }

        // HTMLエスケープ
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 大会名の保存
        const tournamentInput = document.getElementById('tournament');
        tournamentInput.addEventListener('blur', (e) => {
            if (e.target.value.trim() !== '') {
                localStorage.setItem('tournament', e.target.value.trim());
            }
        });
        tournamentInput.addEventListener('change', (e) => {
            if (e.target.value.trim() !== '') {
                localStorage.setItem('tournament', e.target.value.trim());
            }
        });

        // 会場名の保存
        const venueInput = document.getElementById('venue');
        venueInput.addEventListener('blur', (e) => {
            if (e.target.value.trim() !== '') {
                localStorage.setItem('venue', e.target.value.trim());
            }
        });
        venueInput.addEventListener('change', (e) => {
            if (e.target.value.trim() !== '') {
                localStorage.setItem('venue', e.target.value.trim());
            }
        });

        document.getElementById('matchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // URLが設定されているか確認
            if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                showMessage('エラー: HTMLファイル内のSCRIPT_URLを設定してください', 'error');
                return;
            }

            const formData = {
                action: 'add',
                date: document.getElementById('date').value,
                tournament: document.getElementById('tournament').value,
                venue: document.getElementById('venue').value,
                opponent: document.getElementById('opponent').value,
                scoreMinamiGaoka: document.getElementById('scoreMinamiGaoka').value,
                scoreOpponent: document.getElementById('scoreOpponent').value
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '送信中...';

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                // no-corsモードでは実際のレスポンスを受け取れないため、
                // エラーがなければ成功とみなす
                showMessage('データを追加しました！', 'success');
                
                // 対戦チーム名とスコアのみクリア（大会名と会場名は保持）
                document.getElementById('opponent').value = '';
                document.getElementById('scoreMinamiGaoka').value = '';
                document.getElementById('scoreOpponent').value = '';
                
                // 日付を今日に戻す
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('date').value = today;

                // プレビュータブが開いている場合は更新
                setTimeout(() => {
                    if (document.getElementById('previewTab').classList.contains('active')) {
                        loadPreviewData();
                    }
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                showMessage('エラーが発生しました。URLとネットワーク接続を確認してください。', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'データを追加';
            }
        });

        function showMessage(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type} show`;
            
            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 5000);
        }

        function displayScriptUrl() {
            const urlDisplay = document.getElementById('urlDisplay');
            
            if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                urlDisplay.textContent = '⚠️ Google Apps Script URLが未設定です。HTMLファイルを編集してSCRIPT_URLを設定してください。';
                urlDisplay.className = 'url-display not-configured';
            } else {
                urlDisplay.textContent = `✓ 接続先: ${SCRIPT_URL}`;
                urlDisplay.className = 'url-display configured';
            }
        }

        // 編集モーダルを開く
        function openEditModal(row) {
            document.getElementById('editRowIndex').value = row.rowIndex;
            document.getElementById('editDate').value = row.date.replace(/\//g, '-');
            document.getElementById('editTournament').value = row.tournament;
            document.getElementById('editVenue').value = row.venue;
            document.getElementById('editOpponent').value = row.opponent;
            document.getElementById('editScoreMinamiGaoka').value = row.scoreMinamiGaoka;
            document.getElementById('editScoreOpponent').value = row.scoreOpponent;
            
            document.getElementById('editModal').classList.add('show');
        }

        // 編集モーダルを閉じる
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        // 編集フォームの送信
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                showMessage('エラー: HTMLファイル内のSCRIPT_URLを設定してください', 'error');
                return;
            }

            const formData = {
                action: 'edit',
                rowIndex: parseInt(document.getElementById('editRowIndex').value),
                date: document.getElementById('editDate').value,
                tournament: document.getElementById('editTournament').value,
                venue: document.getElementById('editVenue').value,
                opponent: document.getElementById('editOpponent').value,
                scoreMinamiGaoka: document.getElementById('editScoreMinamiGaoka').value,
                scoreOpponent: document.getElementById('editScoreOpponent').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                showMessage('データを更新しました！', 'success');
                closeEditModal();
                
                // プレビューを更新
                setTimeout(() => {
                    loadPreviewData();
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                showMessage('エラーが発生しました。', 'error');
            }
        });

        // 削除モーダルを開く
        function openDeleteModal(row) {
            document.getElementById('deleteRowIndex').value = row.rowIndex;
            
            const preview = document.getElementById('deletePreview');
            preview.innerHTML = `
                <p style="margin: 5px 0;"><strong>日付:</strong> ${escapeHtml(row.date)}</p>
                <p style="margin: 5px 0;"><strong>大会名:</strong> ${escapeHtml(row.tournament)}</p>
                <p style="margin: 5px 0;"><strong>対戦チーム:</strong> ${escapeHtml(row.opponent)}</p>
                <p style="margin: 5px 0;"><strong>スコア:</strong> ${escapeHtml(row.scoreMinamiGaoka)} - ${escapeHtml(row.scoreOpponent)}</p>
            `;
            
            document.getElementById('deleteModal').classList.add('show');
        }

        // 削除モーダルを閉じる
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
        }

        // 削除を実行
        async function confirmDelete() {
            if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                showMessage('エラー: HTMLファイル内のSCRIPT_URLを設定してください', 'error');
                return;
            }

            const rowIndex = parseInt(document.getElementById('deleteRowIndex').value);

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'delete',
                        rowIndex: rowIndex
                    })
                });

                showMessage('データを削除しました！', 'success');
                closeDeleteModal();
                
                // プレビューを更新
                setTimeout(() => {
                    loadPreviewData();
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                showMessage('エラーが発生しました。', 'error');
            }
        }

        // モーダル外クリックで閉じる
        window.onclick = function(event) {
            const editModal = document.getElementById('editModal');
            const deleteModal = document.getElementById('deleteModal');
            
            if (event.target == editModal) {
                closeEditModal();
            }
            if (event.target == deleteModal) {
                closeDeleteModal();
            }
        }
    </script>
</body>
</html>
