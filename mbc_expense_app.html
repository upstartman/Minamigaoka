<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南ヶ丘MBC 遠征費用清算</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1a5f4a;
            --primary-light: #2d8a6e;
            --primary-dark: #0d3d2f;
            --secondary: #e8a838;
            --bg-cream: #faf8f5;
            --bg-card: #ffffff;
            --text-dark: #2c3e50;
            --text-light: #6c7a89;
            --border: #e0dcd5;
            --success: #27ae60;
            --danger: #e74c3c;
            --shadow: 0 2px 10px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 13px;
            background: var(--bg-cream);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 0.8rem 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            font-size: 1.3rem;
        }

        .logo h1 {
            font-size: 1rem;
            font-weight: 700;
        }

        .firebase-status {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.7rem;
            opacity: 0.9;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
        }

        .status-dot.connected {
            background: var(--success);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            background: white;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .nav-tab {
            flex: 1;
            min-width: 60px;
            padding: 0.6rem 0.3rem;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.7rem;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }

        .nav-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .nav-tab-icon {
            font-size: 1.1rem;
        }

        /* Main Content */
        .main-content {
            padding: 0.8rem;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Section Headers */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
        }

        .section-title {
            font-size: 1rem;
            color: var(--primary);
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 0.8rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-family: inherit;
            font-size: 0.85rem;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
        }

        /* Buttons */
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--text-dark);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dark);
        }

        .btn-sm {
            padding: 0.3rem 0.6rem;
            font-size: 0.7rem;
        }

        .btn-block {
            width: 100%;
        }

        .order-buttons {
            display: inline-flex;
            gap: 0.2rem;
            margin-right: 0.5rem;
        }

        .order-buttons .btn {
            padding: 0.2rem 0.4rem;
            font-size: 0.65rem;
            min-width: 24px;
        }

        .order-buttons .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 0.8rem;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        th, td {
            padding: 0.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--primary);
            color: white;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Checkbox Grid */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.4rem;
            background: #f5f5f5;
            border-radius: 0.3rem;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .checkbox-item.selected {
            background: rgba(26,95,74,0.15);
        }

        .checkbox-item input {
            width: 14px;
            height: 14px;
            accent-color: var(--primary);
        }

        /* Toll Section */
        .toll-item {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        .toll-item input,
        .toll-item select {
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 0.3rem;
            font-size: 0.75rem;
            min-width: 0;
        }

        .toll-item .toll-from,
        .toll-item .toll-to {
            flex: 1;
            min-width: 60px;
        }

        .toll-item .toll-direction {
            width: 55px;
        }

        .toll-item .toll-price {
            width: 60px;
        }

        .toll-item .btn {
            flex-shrink: 0;
        }

        /* Calculation Results */
        .calc-result {
            background: var(--primary);
            color: white;
            border-radius: 0.75rem;
            padding: 1rem;
            margin: 1rem 0;
        }

        .calc-result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }

        .calc-item {
            text-align: center;
        }

        .calc-item-label {
            font-size: 0.7rem;
            opacity: 0.9;
        }

        .calc-item-value {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 0.75rem;
            padding: 1rem;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
        }

        /* History List */
        .history-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .history-item.settled {
            background: #f5f5f5;
            opacity: 0.8;
        }

        .settled-badge {
            display: inline-block;
            background: var(--success);
            color: white;
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            margin-left: 0.3rem;
            vertical-align: middle;
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
        }

        .history-date {
            font-weight: 600;
            color: var(--primary);
        }

        .history-total {
            font-weight: 600;
            color: var(--secondary);
        }

        .history-destination {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .history-actions {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        /* Settlement */
        .settlement-positive {
            color: var(--success);
            font-weight: 600;
        }

        .settlement-negative {
            color: var(--danger);
            font-weight: 600;
        }

        /* Print Window Styles */
        .print-content {
            font-family: 'Noto Sans JP', sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .print-content h1 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .print-content .print-date {
            text-align: right;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .print-content table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin: 10px 0;
        }

        .print-content th,
        .print-content td {
            border: 1px solid #333;
            padding: 5px;
        }

        .print-content th {
            background: #f0f0f0;
            color: #333;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            .print-content, .print-content * {
                visibility: visible;
            }
            .print-content {
                position: absolute;
                left: 0;
                top: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🏀</span>
                <h1>南ヶ丘MBC 遠征費用清算</h1>
            </div>
            <div class="firebase-status">
                <div class="status-dot" id="firebaseStatus"></div>
                <span id="firebaseStatusText">未接続</span>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <!-- v2.0: 部員タブは削除（名簿アプリで管理） -->
    <nav class="nav-tabs">
        <button class="nav-tab" data-tab="vehicles">
            <span class="nav-tab-icon">🚗</span>
            車両
        </button>
        <button class="nav-tab active" data-tab="expedition">
            <span class="nav-tab-icon">📝</span>
            遠征入力
        </button>
        <button class="nav-tab" data-tab="history">
            <span class="nav-tab-icon">📋</span>
            履歴
        </button>
        <button class="nav-tab" data-tab="settlement">
            <span class="nav-tab-icon">💰</span>
            清算
        </button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- v2.0: 部員管理タブは削除。部員情報は名簿アプリ(minamigaoka-meibo)から取得 -->

        <!-- Vehicles Tab -->
        <div class="tab-content" id="tab-vehicles">
            <div class="section-header">
                <h2 class="section-title">🚗 車両管理</h2>
                <button class="btn btn-primary btn-sm" onclick="showVehicleModal()">➕ 追加</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>車両提供者</th>
                            <th>燃費</th>
                            <th>燃料</th>
                            <th>紐付け部員</th>
                            <th>遠征使用</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="vehiclesTableBody"></tbody>
                </table>
            </div>

            <div class="empty-state" id="vehiclesEmptyState">
                <div class="empty-state-icon">🚗</div>
                <p>車両が登録されていません</p>
            </div>
        </div>

        <!-- Expedition Input Tab -->
        <div class="tab-content active" id="tab-expedition">
            <div class="section-header">
                <h2 class="section-title">📝 遠征入力</h2>
            </div>

            <form id="expeditionForm">
                <div class="card">
                    <div class="card-title">基本情報</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>日付 *</label>
                            <input type="date" id="expDate" required>
                        </div>
                        <div class="form-group">
                            <label>行き先 *</label>
                            <input type="text" id="expDestination" placeholder="例：いちごアリーナ" required>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">📏 距離・ガソリン単価</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>片道距離 (km) *</label>
                            <input type="number" id="expDistanceOneWay" placeholder="50" required min="0" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>往復距離 (km)</label>
                            <input type="number" id="expDistanceTotal" readonly style="background: #f0f0f0;">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>レギュラー (円/L) *</label>
                            <input type="number" id="expGasPriceRegular" placeholder="150" required min="0" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>軽油 (円/L) *</label>
                            <input type="number" id="expGasPriceDiesel" placeholder="140" required min="0" step="0.1">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">🛣️ 高速道路料金</div>
                    <div id="tollItemsContainer">
                        <div class="toll-item" data-toll-index="0">
                            <input type="text" placeholder="から" class="toll-from">
                            <input type="text" placeholder="まで" class="toll-to">
                            <select class="toll-direction">
                                <option value="outbound">往路</option>
                                <option value="return">復路</option>
                            </select>
                            <input type="number" placeholder="料金" class="toll-price" min="0">
                            <button type="button" class="btn btn-sm btn-danger" onclick="removeTollItem(this)">✕</button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline btn-sm" style="margin-top: 0.5rem;" onclick="addTollItem()">
                        ➕ 区間追加
                    </button>
                </div>

                <div class="card">
                    <div class="card-title">👥 参加部員</div>
                    <div class="checkbox-grid" id="memberCheckboxes">
                        <p style="color: var(--text-light); font-size: 0.75rem;">部員を先に登録してください</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">🚗 使用車両</div>
                    <div class="checkbox-grid" id="vehicleCheckboxes">
                        <p style="color: var(--text-light); font-size: 0.75rem;">車両を先に登録してください</p>
                    </div>
                </div>

                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button type="button" class="btn btn-primary" onclick="calculateExpedition()">🧮 計算</button>
                    <button type="button" class="btn btn-secondary" onclick="saveExpedition()">💾 保存</button>
                    <button type="button" class="btn btn-outline" onclick="resetExpeditionForm()">🔄 リセット</button>
                </div>

                <!-- Calculation Results -->
                <div id="calculationResults" style="display: none;">
                    <div class="calc-result">
                        <div class="calc-result-grid" style="grid-template-columns: repeat(3, 1fr);">
                            <div class="calc-item">
                                <div class="calc-item-label">交通費合計</div>
                                <div class="calc-item-value" id="resultTotal">¥0</div>
                            </div>
                            <div class="calc-item">
                                <div class="calc-item-label">参加人数</div>
                                <div class="calc-item-value" id="resultCount">0人</div>
                            </div>
                            <div class="calc-item">
                                <div class="calc-item-label">1人あたり</div>
                                <div class="calc-item-value" id="resultPerPerson">¥0</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">🚗 車両別明細</div>
                        <div class="table-container">
                            <table id="vehicleDetailsTable">
                                <thead>
                                    <tr>
                                        <th>車両</th>
                                        <th>燃費</th>
                                        <th>燃料</th>
                                        <th>ガソリン代</th>
                                        <th>高速代</th>
                                        <th>計</th>
                                    </tr>
                                </thead>
                                <tbody id="vehicleDetailsBody"></tbody>
                            </table>
                        </div>
                    </div>

                    <button type="button" class="btn btn-secondary btn-block" onclick="openPrintView()">
                        🖨️ 印刷用表示
                    </button>
                </div>
            </form>
        </div>

        <!-- History Tab -->
        <div class="tab-content" id="tab-history">
            <div class="section-header">
                <h2 class="section-title">📋 遠征履歴</h2>
            </div>

            <div id="historyList"></div>

            <div class="empty-state" id="historyEmptyState">
                <div class="empty-state-icon">📋</div>
                <p>遠征履歴がありません</p>
            </div>
        </div>

        <!-- Settlement Tab -->
        <div class="tab-content" id="tab-settlement">
            <div class="section-header">
                <h2 class="section-title">💰 清算</h2>
            </div>

            <div class="card">
                <div class="card-title">清算する遠征を選択</div>
                <div class="checkbox-grid" id="settlementExpeditions"></div>
            </div>

            <button class="btn btn-primary btn-block" onclick="calculateSettlement()">🧮 清算計算</button>

            <div id="settlementResults" style="display: none;">
                <div class="card" style="margin-top: 1rem;">
                    <div class="card-title">📊 清算結果</div>
                    <div id="settlementLegend" style="background: #f9f9f9; border: 1px solid #ddd; padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 0.3rem; font-size: 0.75rem; line-height: 1.6;"></div>
                    <div class="table-container">
                        <table id="settlementTable">
                            <thead>
                                <tr id="settlementHeader"></tr>
                            </thead>
                            <tbody id="settlementBody"></tbody>
                        </table>
                    </div>
                </div>

                <button class="btn btn-secondary btn-block" onclick="openSettlementPrintView()">
                    🖨️ 清算表を印刷用表示
                </button>
                
                <button class="btn btn-primary btn-block" onclick="sendToCollectionApp()" style="margin-top: 0.5rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    📤 集金アプリに送信
                </button>
            </div>
        </div>
    </main>

    <!-- v2.0: 部員モーダルは削除（名簿アプリで管理） -->

    <!-- Vehicle Modal -->
    <div class="modal-overlay" id="vehicleModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="vehicleModalTitle">車両を追加</h3>
                <button type="button" class="modal-close" onclick="closeVehicleModal()">×</button>
            </div>
            <!-- v2.0: 車両提供者は名簿アプリの保護者から選択。選択時に同家族の部員を自動紐付け -->
            <div class="form-group">
                <label>車両提供者 *（名簿アプリの保護者から選択）</label>
                <select id="vehicleOwnerSelect" onchange="onVehicleOwnerChange()">
                    <option value="">-- 選択してください --</option>
                </select>
            </div>
            <div class="form-group">
                <label>燃費 (km/L) *</label>
                <input type="number" id="vehicleFuelEfficiencyInput" placeholder="例：9" min="1" max="30" step="0.1">
            </div>
            <div class="form-group">
                <label>燃料タイプ *</label>
                <select id="vehicleFuelTypeInput">
                    <option value="regular">レギュラー</option>

    <script>
        // ==================== CHANGELOG ====================
        // v2.0 (2026-04-27): 名簿アプリ(minamigaoka-meibo)連携対応
        //   - 部員情報を名簿アプリのfamilies/membersから取得（部員管理タブは削除）
        //   - 車両提供者を名簿アプリの保護者(type='parent')から選択するUIに変更

        // v1.x: 部員/車両/遠征/清算の基本機能、集金アプリ連携

        // ==================== App State ====================

        let expeditions = [];
        let currentExpedition = null;
        let editingExpeditionId = null;

        // ==================== Firebase Config ====================
        const FIREBASE_CONFIG = {

        // ==================== Firebase Connection ====================
        function autoConnect() {
            try {

                // 弁当注文集計アプリ用のFirebaseを初期化（2つ目のアプリとして）

        // ==================== Data Loading ====================
        async function loadAllData() {
            if (!db) return;
            try {
                // v2.0: 名簿アプリからfamiliesを取得し、部員・保護者リストを派生
                await loadRoster();

                // 旧membersコレクションは履歴の名前解決用にフォールバック保持
                try {
                    const legacySnap = await db.collection('members').get();
                    legacyMembers = legacySnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (e) {
                    legacyMembers = [];
                }

                const vehiclesSnapshot = await db.collection('vehicles').get();
                vehicles = vehiclesSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // v2.2: 車両一覧は車両提供者(rosterParents)の並び順(学年降順)に揃える
                sortVehiclesByParentOrder();
                renderVehicles();

                const expeditionsSnapshot = await db.collection('expeditions').orderBy('date', 'desc').get();
                expeditions = expeditionsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderHistory();
                renderSettlementExpeditions();

                renderMemberCheckboxes();
                renderVehicleCheckboxes();
                updateVehicleMemberSelect();
                updateVehicleOwnerSelect();
            } catch (error) {
                console.error('Data loading error:', error);
            }
        }

        // v2.1: 4/1時点の年齢から学年番号を算出（小1=1, 小6=6, 中1=7, 高3=12, 大学以上=99, 未就学=0, 不明=999）
        function getGrade(age) {
            if (age == null || age === '' || isNaN(age)) return 999;
            const a = Number(age);
            if (a >= 18) return 99;
            if (a >= 17) return 12;
            if (a >= 16) return 11;
            if (a >= 15) return 10;
            if (a >= 14) return 9;
            if (a >= 13) return 8;
            if (a >= 12) return 7;
            if (a >= 11) return 6;
            if (a >= 10) return 5;
            if (a >= 9)  return 4;
            if (a >= 8)  return 3;
            if (a >= 7)  return 2;
            if (a >= 6)  return 1;
            return 0;
        }

        // v2.1: 部員表示名は「名前（ふりがな）」
        function memberDisplayName(m) {
            if (!m) return '';
            return m.reading ? `${m.name}（${m.reading}）` : (m.name || '');
        }

        // v2.0: 名簿アプリからfamiliesを取得し、部員・保護者リストを派生
        async function loadRoster() {
            if (!meiboDb) return;
            try {
                const snap = await meiboDb.collection('families').get();
                families = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // 部員(type='member')派生：ID = "roster_{familyId}_{idx}"
                members = [];
                rosterParents = [];
                families.forEach(f => {
                    (f.members || []).forEach((m, idx) => {
                        const stableId = `roster_${f.id}_${idx}`;
                        const displayName = m.name || '';
                        if (m.type === 'member') {
                            members.push({
                                id: stableId,
                                name: displayName,
                                reading: m.reading || '',
                                age: m.age,
                                grade: getGrade(m.age),
                                familyId: f.id,
                                familyName: f.name || '',
                                memberIdx: idx,
                                _source: 'roster'
                            });
                        } else if (m.type === 'parent') {
                            rosterParents.push({
                                id: stableId,
                                name: displayName,
                                reading: m.reading || '',
                                familyId: f.id,
                                familyName: f.name || '',
                                memberIdx: idx,
                                _source: 'roster'
                            });
                        }
                    });
                });

                // v2.2: 部員は学年降順（高学年が上）、同学年内は名前(読み)順
                //       未登録(grade=999)は末尾になるよう、999は最下位として扱う
                const gradeKey = g => (g === 999 ? -1 : g); // 未登録を最下位に
                members.sort((a, b) => {
                    const ga = gradeKey(a.grade), gb = gradeKey(b.grade);
                    if (ga !== gb) return gb - ga; // 降順
                    return (a.reading || a.name).localeCompare(b.reading || b.name, 'ja');
                });

                // v2.2: 保護者は同family内の代表学年(最年長部員)で降順→同学年内は名前順
                //       (家族に部員がいなければ末尾)
                const familyGradeMap = new Map();
                members.forEach(m => {
                    const cur = familyGradeMap.get(m.familyId);
                    // 代表学年は「最年長(grade最大)」を採用（降順の先頭に出すため）
                    if (cur == null || (m.grade !== 999 && m.grade > cur)) familyGradeMap.set(m.familyId, m.grade);
                });
                rosterParents.forEach(p => {
                    p._sortGrade = familyGradeMap.has(p.familyId) ? familyGradeMap.get(p.familyId) : 999;
                });
                rosterParents.sort((a, b) => {
                    const ga = gradeKey(a._sortGrade), gb = gradeKey(b._sortGrade);
                    if (ga !== gb) return gb - ga; // 降順
                    const rc = (a.reading || a.name).localeCompare(b.reading || b.name, 'ja');
                    if (rc !== 0) return rc;
                    return (a.familyName || '').localeCompare(b.familyName || '', 'ja');
                });
            } catch (e) {
                console.error('Roster load error:', e);
                families = []; members = []; rosterParents = [];
            }
        }

        // v2.2: 車両配列を rosterParents の並び順(学年降順)で並べ替え
        function sortVehiclesByParentOrder() {
            const orderMap = new Map();
            rosterParents.forEach((p, idx) => orderMap.set(p.id, idx));
            vehicles.sort((a, b) => {
                const ai = orderMap.has(a.ownerParentId) ? orderMap.get(a.ownerParentId) : Number.MAX_SAFE_INTEGER;
                const bi = orderMap.has(b.ownerParentId) ? orderMap.get(b.ownerParentId) : Number.MAX_SAFE_INTEGER;
                if (ai !== bi) return ai - bi;
                // ownerParentId未設定の旧データはownerName順で末尾に並べる
                return (a.owner || '').localeCompare(b.owner || '', 'ja');
            });
        }

        // v2.0/2.1: ID → 表示名の解決（現行 + 旧membersフォールバック）。部員は「名前（ふりがな）」
        function getMemberName(id) {
            if (!id) return '';
            const r = members.find(m => m.id === id);
            if (r) return memberDisplayName(r);
            const l = legacyMembers.find(m => m.id === id);
            if (l) return l.name;
            return '(不明)';
        }

        // ==================== Members ====================
        // v2.0: 部員のCRUDは名簿アプリ(minamigaoka-meibo)で管理。本アプリは読み取りのみ。
        // 旧API（renderMembers/showMemberModal/saveMember/editMember/deleteMember/moveMember）は削除。

        // ==================== Vehicles ====================
        function renderVehicles() {
            const tbody = document.getElementById('vehiclesTableBody');
            const emptyState = document.getElementById('vehiclesEmptyState');
            
            if (vehicles.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            // v2.0: linkedMemberIdは新名簿ID/旧IDの双方を解決、useForExpeditionを表示
            tbody.innerHTML = vehicles.map(vehicle => {
                const linkedName = getMemberName(vehicle.linkedMemberId);
                const useFlag = vehicle.useForExpedition !== false; // 既存データはデフォルトtrue扱い
                return `
                    <tr>
                        <td>${vehicle.owner || ''}</td>
                        <td>${vehicle.fuelEfficiency}km/L</td>
                        <td>${vehicle.fuelType === 'diesel' ? '軽油' : 'レギュラー'}</td>
                        <td>${linkedName || '-'}</td>
                        <td>${useFlag ? '✅' : '—'}</td>
                        <td>
                            <button class="btn btn-sm btn-outline" onclick="editVehicle('${vehicle.id}')">編集</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteVehicle('${vehicle.id}')">削除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // v2.0: 車両提供者の選択肢（名簿アプリの保護者）
        function updateVehicleOwnerSelect() {
            const select = document.getElementById('vehicleOwnerSelect');
            if (!select) return;
            select.innerHTML = '<option value="">-- 選択してください --</option>' +
                rosterParents.map(p => {
                    const label = `${p.familyName} ${p.name}`.trim();
                    return `<option value="${p.id}" data-family="${p.familyId}" data-name="${label}">${label}</option>`;
                }).join('');

        // v2.0: 紐付け部員選択肢（指定familyIdに属する部員のみ。未指定時は全員）
        // v2.1: 表示は「名前（ふりがな）」
        function updateVehicleMemberSelect(familyId) {
            const select = document.getElementById('vehicleMemberInput');
            const list = familyId ? members.filter(m => m.familyId === familyId) : members;

        // v2.0: 車両提供者選択時、同family内の部員を自動絞り込み・自動選択
        function onVehicleOwnerChange() {
            const sel = document.getElementById('vehicleOwnerSelect');
            const opt = sel.options[sel.selectedIndex];
            const familyId = opt ? opt.getAttribute('data-family') : '';
            updateVehicleMemberSelect(familyId);
            // 同familyに部員が1人だけなら自動選択
            const family = members.filter(m => m.familyId === familyId);
            if (family.length === 1) {
                document.getElementById('vehicleMemberInput').value = family[0].id;
            }

        function showVehicleModal(vehicleId = null) {
            document.getElementById('vehicleModal').classList.add('active');
            document.getElementById('vehicleFuelEfficiencyInput').value = '';
            document.getElementById('vehicleFuelTypeInput').value = 'regular';
            document.getElementById('vehicleUseForExpeditionInput').checked = true;
            document.getElementById('editVehicleId').value = '';

            updateVehicleOwnerSelect();
            updateVehicleMemberSelect();
            document.getElementById('vehicleOwnerSelect').value = '';
            document.getElementById('vehicleMemberInput').value = '';

            if (vehicleId) {
                const vehicle = vehicles.find(v => v.id === vehicleId);
                if (vehicle) {
                    document.getElementById('vehicleModalTitle').textContent = '車両を編集';
                    // ownerParentId（v2.0で新規追加）優先、後方互換でowner名から推測
                    let ownerVal = vehicle.ownerParentId || '';
                    if (!ownerVal && vehicle.owner) {
                        const guess = rosterParents.find(p => `${p.familyName} ${p.name}`.trim() === vehicle.owner || p.name === vehicle.owner);
                        if (guess) ownerVal = guess.id;
                    }
                    document.getElementById('vehicleOwnerSelect').value = ownerVal;
                    // ownerに応じて部員リストを絞る
                    const ownerOpt = document.getElementById('vehicleOwnerSelect').selectedOptions[0];
                    const fid = ownerOpt ? ownerOpt.getAttribute('data-family') : '';
                    updateVehicleMemberSelect(fid);

                    document.getElementById('vehicleFuelEfficiencyInput').value = vehicle.fuelEfficiency;
                    document.getElementById('vehicleFuelTypeInput').value = vehicle.fuelType;
                    document.getElementById('vehicleMemberInput').value = vehicle.linkedMemberId || '';
                    document.getElementById('vehicleUseForExpeditionInput').checked = vehicle.useForExpedition !== false;
                    document.getElementById('editVehicleId').value = vehicleId;
                }
            } else {
                document.getElementById('vehicleModalTitle').textContent = '車両を追加';
            }
        }

        function closeVehicleModal() {
            document.getElementById('vehicleModal').classList.remove('active');
        }

        async function saveVehicle() {
            if (!db) { alert('Firebaseに接続してください'); return; }

            const ownerSel = document.getElementById('vehicleOwnerSelect');
            const ownerParentId = ownerSel.value;
            const ownerOpt = ownerSel.selectedOptions[0];
            const ownerName = ownerOpt ? (ownerOpt.getAttribute('data-name') || ownerOpt.text) : '';
            const fuelEfficiency = parseFloat(document.getElementById('vehicleFuelEfficiencyInput').value);
            const fuelType = document.getElementById('vehicleFuelTypeInput').value;
            const linkedMemberId = document.getElementById('vehicleMemberInput').value || null;
            const useForExpedition = document.getElementById('vehicleUseForExpeditionInput').checked;
            const editId = document.getElementById('editVehicleId').value;

            if (!ownerParentId || !fuelEfficiency) { alert('必須項目を入力してください'); return; }

            try {
                // v2.0: ownerParentIdとownerName(表示用キャッシュ)を保存。useForExpeditionも保存。
                const data = { owner: ownerName, ownerParentId, fuelEfficiency, fuelType, linkedMemberId, useForExpedition };
                if (editId) {
                    await db.collection('vehicles').doc(editId).update(data);
                } else {
                    await db.collection('vehicles').add(data);
                }
                closeVehicleModal();
                loadAllData();
            } catch (error) {
                alert('保存に失敗しました: ' + error.message);
            }
        }

        function editVehicle(id) { showVehicleModal(id); }

        async function deleteVehicle(id) {
            if (!confirm('この車両を削除しますか？')) return;
            try {
                await db.collection('vehicles').doc(id).delete();
                loadAllData();

                alert('削除に失敗しました: ' + error.message);

        // ==================== Expedition Input ====================

        // Distance calculation
        document.addEventListener('DOMContentLoaded', function() {
            const distOneWay = document.getElementById('expDistanceOneWay');
            const distTotal = document.getElementById('expDistanceTotal');

            distOneWay.addEventListener('input', function() {
                const oneWay = parseFloat(this.value) || 0;
                distTotal.value = oneWay * 2;

            autoConnect();
            document.getElementById('expDate').value = new Date().toISOString().split('T')[0];

        // Toll functions
        function addTollItem() {
            const container = document.getElementById('tollItemsContainer');
            const div = document.createElement('div');
            div.className = 'toll-item';

                <input type="text" placeholder="から" class="toll-from">

        // ==================== Calculation ====================
        function calculateExpedition() {
            const date = document.getElementById('expDate').value;
            const destination = document.getElementById('expDestination').value;
            const distanceOneWay = parseFloat(document.getElementById('expDistanceOneWay').value) || 0;
            const distanceTotal = distanceOneWay * 2;
            const gasPriceRegular = parseFloat(document.getElementById('expGasPriceRegular').value) || 0;
            const gasPriceDiesel = parseFloat(document.getElementById('expGasPriceDiesel').value) || 0;

            const tollItems = Array.from(document.querySelectorAll('.toll-item')).map(item => ({
                from: item.querySelector('.toll-from').value,
                to: item.querySelector('.toll-to').value,
                direction: item.querySelector('.toll-direction').value,
                price: parseFloat(item.querySelector('.toll-price').value) || 0
            })).filter(item => item.price > 0);

            const totalToll = tollItems.reduce((sum, item) => sum + item.price, 0);

            const selectedMemberIds = Array.from(document.querySelectorAll('#memberCheckboxes input:checked')).map(cb => cb.value);
            const selectedVehicleIds = Array.from(document.querySelectorAll('#vehicleCheckboxes input:checked')).map(cb => cb.value);

            if (!date || !destination || distanceOneWay === 0 || selectedMemberIds.length === 0 || selectedVehicleIds.length === 0) {
                alert('必須項目を入力してください');
                return;
            }

            // 高速代は各車両に同じ金額を適用
            const tollPerVehicle = totalToll;

            const vehicleDetails = selectedVehicleIds.map(vid => {
                const vehicle = vehicles.find(v => v.id === vid);
                if (!vehicle) return null;

                const gasPrice = vehicle.fuelType === 'diesel' ? gasPriceDiesel : gasPriceRegular;
                const gasCost = Math.round(gasPrice * distanceTotal / vehicle.fuelEfficiency);
                const total = gasCost + tollPerVehicle;

                return {
                    vehicleId: vid,
                    owner: vehicle.owner,
                    fuelEfficiency: vehicle.fuelEfficiency,
                    fuelType: vehicle.fuelType,
                    linkedMemberId: vehicle.linkedMemberId,
                    gasPrice,
                    distance: distanceTotal,
                    gasCost,
                    tollCost: tollPerVehicle,
                    total
                };
            }).filter(Boolean);

            const totalExpense = vehicleDetails.reduce((sum, v) => sum + v.total, 0);
            const participantCount = selectedMemberIds.length;
            const perPerson = Math.ceil(totalExpense / participantCount);
            const collected = perPerson * participantCount;
            const remainder = collected - totalExpense;

            currentExpedition = {
                date,
                destination,
                distanceOneWay,
                distanceTotal,
                gasPriceRegular,
                gasPriceDiesel,

                totalToll,

            };

            try {
                if (editingExpeditionId) {
                    await db.collection('expeditions').doc(editingExpeditionId).update({
                        ...currentExpedition,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    editingExpeditionId = null;
                } else {
                    await db.collection('expeditions').add({
                        ...currentExpedition,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                alert('保存しました');

        function renderSettlementExpeditions() {

        function calculateSettlement() {
            const selectedIds = Array.from(document.querySelectorAll('#settlementExpeditions input:checked')).map(cb => cb.value);
            if (selectedIds.length === 0) { alert('遠征を選択してください'); return; }

            const selectedExpeditions = expeditions.filter(exp => selectedIds.includes(exp.id));
            const settlementData = {};

            // v2.0: 現役名簿の部員を初期化
            members.forEach(member => {
                settlementData[member.id] = {
                    name: member.name,
                    costs: {},
                    vehicleIncome: {},
                    totalCost: 0,
                    totalIncome: 0,
                    balance: 0
                };
            });
            // v2.0: 旧IDを参照する遠征向けに、legacyMembersも遅延追加
            const ensureEntry = (id) => {
                if (settlementData[id]) return;
                settlementData[id] = {
                    name: getMemberName(id) || '(旧)',
                    costs: {}, vehicleIncome: {},
                    totalCost: 0, totalIncome: 0, balance: 0
                };
            };

            selectedExpeditions.forEach(exp => {
                exp.selectedMemberIds?.forEach(memberId => {
                    ensureEntry(memberId);
                    settlementData[memberId].costs[exp.id] = exp.perPerson;
                    settlementData[memberId].totalCost += exp.perPerson;
                });

                exp.vehicleDetails?.forEach(vehicle => {
                    if (vehicle.linkedMemberId) {
                        ensureEntry(vehicle.linkedMemberId);
                        settlementData[vehicle.linkedMemberId].vehicleIncome[exp.id] =
                            (settlementData[vehicle.linkedMemberId].vehicleIncome[exp.id] || 0) + vehicle.total;
                        settlementData[vehicle.linkedMemberId].totalIncome += vehicle.total;
                    }
                });
            });

            Object.values(settlementData).forEach(data => {
                data.balance = data.totalIncome - data.totalCost;
            });

            renderSettlementTable(selectedExpeditions, settlementData);
            document.getElementById('settlementResults').style.display = 'block';
        }

        function renderSettlementTable(selectedExpeditions, settlementData) {
            const headerRow = document.getElementById('settlementHeader');
            const tbody = document.getElementById('settlementBody');

            // 元の残金の合計
            const baseRemainder = selectedExpeditions.reduce((sum, exp) => sum + (exp.remainder || 0), 0);

            // 番号記号の配列
            const circleNumbers = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩', '⑪', '⑫', '⑬', '⑭', '⑮'];

            let headerHtml = '<th>部員</th>';
            selectedExpeditions.forEach((exp, i) => {
                headerHtml += `<th>${circleNumbers[i]}</th>`;
            });
            headerHtml += '<th>遠征費計</th>';
            selectedExpeditions.forEach((exp, i) => {
                headerHtml += `<th>${circleNumbers[i]}</th>`;
            });
            headerHtml += '<th>差引額</th><th>集金額</th>';
            headerRow.innerHTML = headerHtml;

            // 凡例を更新
            const legendDiv = document.getElementById('settlementLegend');
            const legendHtml = selectedExpeditions.map((exp, i) => 
                `${circleNumbers[i]} ${exp.date} ${exp.destination}`
            ).join('<br>');
            legendDiv.innerHTML = '遠征費 / 交通費負担額<br>' + legendHtml;

            let bodyHtml = '';
            let roundingRemainder = 0; // 丸めによる残金

            Object.entries(settlementData).forEach(([memberId, data]) => {
                if (data.totalCost === 0 && data.totalIncome === 0) return;

                bodyHtml += '<tr>';
                bodyHtml += `<td>${data.name}</td>`;
                
                selectedExpeditions.forEach(exp => {
                    const cost = data.costs[exp.id] || 0;
                    bodyHtml += `<td>${cost > 0 ? cost : '-'}</td>`;
                });
                
                bodyHtml += `<td><strong>${data.totalCost}</strong></td>`;
                
                selectedExpeditions.forEach(exp => {
                    const income = data.vehicleIncome[exp.id] || 0;
                    bodyHtml += `<td>${income > 0 ? income : ''}</td>`;
                });
                
                // 差引額 = 負担額 - 交通費収入（丸め前）
                const rawCollectAmount = data.totalCost - data.totalIncome;
                let roundedCollectAmount;
                
                if (rawCollectAmount > 0) {
                    // 支払う側：100円単位で切り上げ
                    roundedCollectAmount = Math.ceil(rawCollectAmount / 100) * 100;
                } else if (rawCollectAmount < 0) {
                    // もらう側：100円単位で切り捨て（絶対値で切り捨て、符号を戻す）
                    roundedCollectAmount = -Math.floor(Math.abs(rawCollectAmount) / 100) * 100;
                } else {
                    roundedCollectAmount = 0;
                }
                // 丸めによる差額を残金に加算（支払う側も、もらう側も同じ式でOK）
                roundingRemainder += roundedCollectAmount - rawCollectAmount;
                
                // 差引額
                bodyHtml += `<td>${rawCollectAmount}</td>`;
                // 集金額
                const collectClass = roundedCollectAmount < 0 ? 'settlement-positive' : (roundedCollectAmount > 0 ? 'settlement-negative' : '');
                bodyHtml += `<td class="${collectClass}"><strong>${roundedCollectAmount}</strong></td>`;
                bodyHtml += '</tr>';
            });

            // 残金の行を追加（元の残金 + 丸めによる残金）
            const totalRemainder = baseRemainder + roundingRemainder;
            bodyHtml += `<tr style="background: #fff9e6;">
                <td colspan="${selectedExpeditions.length + 1}"><strong>残金（部費へ繰入れ）</strong></td>
                <td colspan="${selectedExpeditions.length + 2}" style="text-align: right;"><strong>¥${totalRemainder}</strong></td>
            </tr>`;

            tbody.innerHTML = bodyHtml;
        }

            let roundingRemainder = 0; // 丸めによる残金

            Object.entries(settlementData).forEach(([memberId, data]) => {
                if (data.totalCost === 0 && data.totalIncome === 0) return;

                bodyHtml += '<tr>';
                bodyHtml += `<td>${data.name}</td>`;
                selectedExpeditions.forEach(exp => {
                    const cost = data.costs[exp.id] || 0;
                    bodyHtml += `<td>${cost > 0 ? '¥' + cost : '-'}</td>`;
                });
                bodyHtml += `<td><strong>¥${data.totalCost}</strong></td>`;
                selectedExpeditions.forEach(exp => {
                    const income = data.vehicleIncome[exp.id] || 0;
                    bodyHtml += `<td>${income > 0 ? '¥' + income : ''}</td>`;
                });
                
                // 差引額 = 負担額 - 交通費収入（丸め前）
                const rawCollectAmount = data.totalCost - data.totalIncome;
                let roundedCollectAmount;
                
                if (rawCollectAmount > 0) {
                    // 支払う側：100円単位で切り上げ
                    roundedCollectAmount = Math.ceil(rawCollectAmount / 100) * 100;
                } else if (rawCollectAmount < 0) {
                    // もらう側：100円単位で切り捨て
                    roundedCollectAmount = -Math.floor(Math.abs(rawCollectAmount) / 100) * 100;
                } else {
                    roundedCollectAmount = 0;
                }
                // 丸めによる差額を残金に加算
                roundingRemainder += roundedCollectAmount - rawCollectAmount;
                
                // 差引額
                bodyHtml += `<td>¥${rawCollectAmount}</td>`;
                // 集金額
                const color = roundedCollectAmount < 0 ? 'green' : (roundedCollectAmount > 0 ? 'red' : 'black');
                bodyHtml += `<td style="color: ${color};"><strong>¥${roundedCollectAmount}</strong></td>`;
                bodyHtml += '</tr>';
            });

            // 残金の行を追加（元の残金 + 丸めによる残金）
            const totalRemainder = baseRemainder + roundingRemainder;
            const colCount = selectedExpeditions.length * 2 + 4;
            bodyHtml += `<tr style="background: #fff9e6;">
                <td colspan="${Math.ceil(colCount / 2)}"><strong>残金（部費へ繰入れ）</strong></td>
                <td colspan="${Math.floor(colCount / 2)}" style="text-align: right;"><strong>¥${totalRemainder}</strong></td>
            </tr>`;

            const dateRange = selectedExpeditions.length > 0 
                ? `${selectedExpeditions[selectedExpeditions.length - 1].date} ～ ${selectedExpeditions[0].date}`
                : '';

            const html = `
                <!DOCTYPE html>
                <html lang="ja">
                <head>
                    <meta charset="UTF-8">
                    <title>清算表</title>
                    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
                    <style>
                        body { font-family: 'Noto Sans JP', sans-serif; padding: 20px; font-size: 13px; }
                        h1 { text-align: center; font-size: 20px; margin-bottom: 8px; }
                        .date-range { text-align: center; margin-bottom: 10px; font-size: 14px; }
                        .legend { background: #f9f9f9; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; border-radius: 5px; font-size: 12px; line-height: 1.8; }
                        table { width: 100%; border-collapse: collapse; }
                        th, td { border: 1px solid #333; padding: 6px; text-align: center; }
                        th { background: #f0f0f0; font-size: 13px; }
                        @media print { body { padding: 0; } }
                    </style>
                </head>
                <body>
                    <h1>遠征費用清算表</h1>
                    <div class="date-range">${dateRange}</div>
                    <div class="legend">${legendHtml}</div>
                    <table>
                        <thead>
                            <tr>${headerRow1}</tr>
                            <tr>${headerRow2}</tr>
                        </thead>
                        <tbody>${bodyHtml}</tbody>
                    </table>
                </body>
                </html>
            `;

            const printWindow = window.open('', '_blank');
            printWindow.document.write(html);
            printWindow.document.close();
        }

        // ==================== 集金アプリへ送信 ====================
        async function sendToCollectionApp() {
            const selectedIds = Array.from(document.querySelectorAll('#settlementExpeditions input:checked')).map(cb => cb.value);
            if (selectedIds.length === 0) {
                alert('遠征を選択してください');
                return;
            }

            if (!bentoDb) {
                alert('集金アプリへの接続に失敗しました。ページを再読み込みしてください。');
                return;
            }

            const selectedExpeditions = expeditions.filter(exp => selectedIds.includes(exp.id));
            
            // 清算データを計算
            const settlementData = {};
            const baseRemainder = selectedExpeditions.reduce((sum, exp) => sum + (exp.remainder || 0), 0);

            // v2.0: 現役+legacy両対応
            members.forEach(member => {
                settlementData[member.id] = {
                    name: member.name,
                    totalCost: 0,
                    totalIncome: 0
                };
            });
            const ensureEntry = (id) => {
                if (settlementData[id]) return;
                settlementData[id] = { name: getMemberName(id) || '(旧)', totalCost: 0, totalIncome: 0 };
            };

            selectedExpeditions.forEach(exp => {
                exp.selectedMemberIds?.forEach(memberId => {
                    ensureEntry(memberId);
                    settlementData[memberId].totalCost += exp.perPerson;
                });
                exp.vehicleDetails?.forEach(vehicle => {
                    if (vehicle.linkedMemberId) {
                        ensureEntry(vehicle.linkedMemberId);
                        settlementData[vehicle.linkedMemberId].totalIncome += vehicle.total;
                    }
                });
            });

            // 集金・支払いデータを作成（正=集金、負=支払い）
            const collectItems = [];
            const paymentItems = [];
            let roundingRemainder = 0;

            Object.entries(settlementData).forEach(([memberId, data]) => {
                if (data.totalCost === 0 && data.totalIncome === 0) return;

                const rawCollectAmount = data.totalCost - data.totalIncome;
                let roundedCollectAmount;

                if (rawCollectAmount > 0) {
                    roundedCollectAmount = Math.ceil(rawCollectAmount / 100) * 100;
                } else if (rawCollectAmount < 0) {
                    roundedCollectAmount = -Math.floor(Math.abs(rawCollectAmount) / 100) * 100;
                } else {
                    roundedCollectAmount = 0;
                }
                roundingRemainder += roundedCollectAmount - rawCollectAmount;

                if (roundedCollectAmount > 0) {
                    collectItems.push({
                        name: data.name,
                        amount: roundedCollectAmount
                    });
                } else if (roundedCollectAmount < 0) {
                    paymentItems.push({
                        name: data.name,
                        amount: roundedCollectAmount  // 負の値のまま
                    });
                }
            });

            if (collectItems.length === 0 && paymentItems.length === 0) {
                alert('集金・支払い対象者がいません。');
                return;
            }

            // 日付範囲を取得
            const sortedExpeditions = [...selectedExpeditions].sort((a, b) => a.date.localeCompare(b.date));
            const dateRange = sortedExpeditions.length > 1
                ? `${sortedExpeditions[0].date} ～ ${sortedExpeditions[sortedExpeditions.length - 1].date}`
                : sortedExpeditions[0].date;

            // 確認ダイアログ
            const totalRemainder = baseRemainder + roundingRemainder;
            const totalCollect = collectItems.reduce((sum, item) => sum + item.amount, 0);
            const totalPayment = paymentItems.reduce((sum, item) => sum + Math.abs(item.amount), 0);
            
            let confirmMsg = `以下の内容で集金アプリに送信します。\n\n`;
            confirmMsg += `📅 期間: ${dateRange}\n`;
            confirmMsg += `💰 集金合計: ¥${totalCollect.toLocaleString()}（${collectItems.length}人）\n`;
            confirmMsg += `💸 支払合計: ¥${totalPayment.toLocaleString()}（${paymentItems.length}人）\n`;
            confirmMsg += `📝 残金: ¥${Math.round(totalRemainder).toLocaleString()}\n\n`;
            
            if (collectItems.length > 0) {
                confirmMsg += `【集金対象者】\n`;
                collectItems.forEach(item => {
                    confirmMsg += `・${item.name}: ¥${item.amount.toLocaleString()}\n`;
                });
            }
            if (paymentItems.length > 0) {
                confirmMsg += `\n【支払対象者（車両提供者等）】\n`;
                paymentItems.forEach(item => {
                    confirmMsg += `・${item.name}: ¥${Math.abs(item.amount).toLocaleString()}\n`;
                });
            }
            confirmMsg += `\n送信しますか？`;

            if (!confirm(confirmMsg)) {
                return;
            }

            try {
                // 注文ページを作成
                const today = new Date().toISOString().split('T')[0];
                const destinations = selectedExpeditions.map(exp => exp.destination).join('、');
                const shopName = `遠征費用清算（${destinations.length > 20 ? destinations.slice(0, 20) + '…' : destinations}）`;
                
                // メニュー項目を作成（集金用と支払用）
                const menus = [];
                if (collectItems.length > 0) {
                    menus.push({ name: '遠征費用（集金）', price: 100 });
                }
                if (paymentItems.length > 0) {
                    menus.push({ name: '遠征費用（支払）', price: -100 });
                }
                
                const orderPageRef = await bentoDb.collection('orderPages').add({
                    orderDate: today,
                    shopName: shopName,
                    memo: `期間: ${dateRange}\n残金（部費へ繰入れ）: ¥${Math.round(totalRemainder).toLocaleString()}\n\n※金額が負の人は支払い対象です`,
                    menus: menus,
                    status: 'open',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    paidUsers: []
                });

                const orderId = orderPageRef.id;

                // 各メンバーの注文を作成
                const batch = bentoDb.batch();
                
                // 集金対象者
                collectItems.forEach(item => {
                    const orderRef = bentoDb.collection('orders').doc();
                    batch.set(orderRef, {
                        orderId: orderId,
                        orderDate: today,
                        menuName: '遠征費用（集金）',
                        price: item.amount,
                        userName: item.name,
                        quantity: 1,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
                
                // 支払対象者（負の金額）
                paymentItems.forEach(item => {
                    const orderRef = bentoDb.collection('orders').doc();
                    batch.set(orderRef, {
                        orderId: orderId,
                        orderDate: today,
                        menuName: '遠征費用（支払）',
                        price: item.amount,  // 負の値のまま登録
                        userName: item.name,
                        quantity: 1,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
                
                await batch.commit();

                // 選択された遠征を清算済みにする
                for (const expId of selectedIds) {
                    await db.collection('expeditions').doc(expId).update({ settled: true });
                }

                alert(`✅ 集金アプリへの送信が完了しました！\n\n集金アプリを開いて「${shopName}」を確認してください。\n\n💰 集金: ${collectItems.length}人\n💸 支払: ${paymentItems.length}人`);
                
                // 画面を更新
                loadAllData();

            } catch (error) {
                console.error('Send to collection app error:', error);
                alert('送信に失敗しました: ' + error.message);
            }
        }

        // ==================== Tab Navigation ====================
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const tabId = this.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                document.getElementById(`tab-${tabId}`).classList.add('active');
            });
        });
    </script>
</body>
</html>
